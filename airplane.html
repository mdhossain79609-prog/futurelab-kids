<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>বিমান তৈরি করো</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#fff;color:#0f172a;user-select:none;-webkit-user-select:none;touch-action:none}
main{display:flex;flex-direction:column;height:100dvh;height:100vh}
@supports(height:100dvh){main{height:100dvh}}
header{display:flex;align-items:center;gap:6px;padding:6px 8px 4px}
h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(1rem,4.6vw,1.75rem);font-weight:800;
background:linear-gradient(90deg,#0ea5e9,#8b5cf6,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700;border:0}
#count{background:#f1f5f9}
#reset{background:#1e293b;color:#fff}
#boardWrap{flex:0 0 42%;min-height:0;padding:0 8px 4px;position:relative}
#board{position:absolute;inset:0 8px 4px;border:2px dashed #93c5fd;border-radius:24px;overflow:hidden;
background:linear-gradient(180deg,#cfe8fb,#f3f9fd);transition:background .5s}
#board.night{background:linear-gradient(180deg,#0b1026,#1e2a55)}
#board svg{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:#64748b;text-align:center;padding:16px}
#tray{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:6px;background:#fff;box-shadow:0 -4px 12px #0001;border-radius:20px 20px 0 0}
#tray{flex:1;min-height:0;align-content:center}
@media(max-width:640px){#tray{grid-template-columns:repeat(5,1fr);gap:4px;padding:6px}.slot{height:clamp(48px,8.5vh,72px)}.slot span{font-size:11px}}
.slot{height:64px;border-radius:10px;background:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.slot svg{width:100%;height:70%;filter:drop-shadow(0 2px 2px #0004);cursor:grab}
.slot span{font-size:10px;color:#64748b;white-space:nowrap;overflow:hidden;max-width:100%}
.slot.gone>*{visibility:hidden}
#controls{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 6px 8px;max-width:100vw;overflow:hidden;background:#fff}
.btns{display:flex;gap:4px;flex-shrink:1;min-width:0}
.cbtn{width:clamp(44px,13vw,62px);height:clamp(44px,13vw,62px);border-radius:16px;border:0;color:#fff;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #0003;line-height:1.1}
.cbtn b{font-size:20px}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
#bColor{background:linear-gradient(135deg,#f43f5e,#f59e0b,#22c55e,#3b82f6)}
#bLight{background:linear-gradient(135deg,#facc15,#f97316)}
#bStart{background:linear-gradient(135deg,#22c55e,#15803d)}
#bStart.on{background:linear-gradient(135deg,#ef4444,#991b1b)}
#remote{display:grid;grid-template-columns:repeat(4,clamp(30px,8.5vw,40px));grid-template-rows:repeat(2,clamp(30px,8.5vw,40px));gap:3px;padding:5px;flex-shrink:0;border-radius:18px;background:linear-gradient(160deg,#334155,#0f172a);box-shadow:0 4px 0 #0005}
.r{border:0;border-radius:10px;background:#475569;color:#fff;font-size:17px;font-weight:800}
.r:active,.r.act{background:#22d3ee;color:#0f172a}
.r.run{background:#16a34a}.r.run.act{background:#facc15}
.cbtn:disabled,.r:disabled{opacity:.4}
#drag{position:fixed;pointer-events:none;z-index:50;filter:drop-shadow(0 6px 6px #0005)}
#msg{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes blink2{0%,49%{opacity:.15}50%,100%{opacity:1}}
.bl1{animation:blink .8s infinite}.bl2{animation:blink2 .8s infinite}
</style>
</head>
<body>
<main>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<header>
  <h1>✈️ বিমান তৈরি করো</h1>
  <span id="count" class="pill">0 / 20</span>
  <button id="reset" class="pill">আবার শুরুর</button>
</header>
<div id="boardWrap"><div id="board">
  <svg id="scene" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="beam" cx="1" cy="0.5" r="1"><stop offset="0" stop-color="#fff7b0" stop-opacity=".9"/><stop offset="1" stop-color="#fff7b0" stop-opacity="0"/></radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g id="mover"><g id="facer"><g id="tilter"><g id="plane"></g><g id="lights"></g></g></g></g>
  </svg>
  <div id="hint">নিচের অংশগুলা টেনে এখানে আনো</div>
</div></div>
<section id="tray"></section>
<div id="controls">
  <div class="btns">
    <button class="cbtn" id="bColor"><b>🎨</b>১ রং</button>
    <button class="cbtn" id="bLight"><b>💡</b>২ আলো</button>
    <button class="cbtn" id="bSound" style="background:linear-gradient(135deg,#0ea5e9,#6366f1)"><b>🔊</b>সাউন্ড</button>
    <button class="cbtn" id="bStart"><b>▶</b>৩ স্টার্ট</button>
  </div>
  <div id="remote" title="৪ রিমোট">
    <button class="r" data-k="up">▲</button>
    <button class="r" data-k="left">◀</button>
    <button class="r" data-k="right">▶</button>
    <button class="r" data-k="spin">⟳</button>
    <button class="r" data-k="down">▼</button>
    <button class="r" data-k="turn">⇄</button>
    <button class="r run" data-k="run" style="grid-column:span 2;font-size:13px">🏃 রান</button>
  </div>
</div>
</main>
<div id="msg"></div>

<script>
// ---------- ছবি আঁকার অংশ ----------
const VB={x:62,y:52,w:560,h:252};
const S='stroke="#1e293b" stroke-width="2"';
const g=c=>`url(#g-${c})`;
const sh=(x,y,w,h)=>`<rect x="${x+w*.1}" y="${y+h*.1}" width="${w*.8}" height="${Math.max(2,h*.25)}" rx="${Math.min(w,h)*.12}" fill="#fff" opacity=".45"/>`;
const fan=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${g('dark')}" ${S}/>`+
 `<g class="fan" data-c="${cx},${cy}"><rect x="${cx-r*.22}" y="${cy-r*.85}" width="${r*.44}" height="${r*1.7}" rx="${r*.2}" fill="#fff" opacity=".9"/>`+
 `<rect x="${cx-r*.85}" y="${cy-r*.22}" width="${r*1.7}" height="${r*.44}" rx="${r*.2}" fill="#fff" opacity=".9"/></g>`+
 `<circle cx="${cx}" cy="${cy}" r="${r*.22}" fill="#f8fafc"/>`;

const PARTS=[
 {id:8,n:"উপরের ডানা",b:[250,124,154,64],a:`<polygon points="252,186 352,186 402,126 312,126" fill="${g('teal')}" ${S}/><polygon points="266,180 348,180 390,134 322,134" fill="#fff" opacity=".28"/>`},
 {id:13,n:"ইঞ্জিন ২",b:[370,194,68,32],a:`<rect x="372" y="196" width="64" height="28" rx="13" fill="${g('steel')}" ${S}/>${sh(372,196,64,28)}`},
 {id:15,n:"পাখা ২",b:[366,198,24,24],cls:"fan",a:fan(378,210,10)},
 {id:11,n:"পেছনের ডানা",b:[466,158,104,41],a:`<polygon points="468,180 552,160 568,175 488,197" fill="${g('pink')}" ${S}/><polygon points="482,178 546,164 556,172 494,186" fill="#fff" opacity=".3"/>`},
 {id:9,n:"লেজের ডানা",b:[430,93,88,61],a:`<polygon points="432,152 470,95 500,95 516,168" fill="${g('green')}" ${S}/><polygon points="442,146 472,102 480,102 454,150" fill="#fff" opacity=".35"/>`},
 {id:10,n:"ডানার আগা",b:[464,86,42,16],a:`<rect x="466" y="88" width="38" height="12" rx="6" fill="${g('purple')}" ${S}/>${sh(466,88,38,12)}`},
 {id:1,n:"মূল বডি",b:[116,149,402,74],a:`<path d="M118,189 Q122,155 172,151 L425,151 Q478,153 516,174 L516,182 Q470,206 425,221 L172,221 Q121,217 118,189 Z" fill="${g('red')}" ${S}/><ellipse cx="290" cy="163" rx="120" ry="8" fill="#fff" opacity=".35"/>`},
 {id:3,n:"জানালার সারি",b:[242,164,140,16],a:[250,275,300,325,350,375].map(x=>`<circle cx="${x}" cy="172" r="6" fill="${g('cyan')}" ${S}/>`).join('')},
 {id:4,n:"দরজা",b:[203,164,34,54],a:`<rect x="205" y="166" width="30" height="50" rx="6" fill="${g('orange')}" ${S}/><circle cx="230" cy="192" r="3" fill="#1e293b"/>${sh(205,166,30,50)}`},
 {id:2,n:"সামনের কাঁচ",b:[126,152,52,28],a:`<path d="M128,178 Q132,158 165,154 L176,154 L178,178 Z" fill="${g('blue')}" ${S}/><path d="M136,174 Q140,162 160,159 L150,174 Z" fill="#fff" opacity=".6"/>`},
 {id:5,n:"বড় ডানা",b:[253,203,219,61],a:`<polygon points="255,205 380,205 470,258 345,258" fill="${g('yellow')}" ${S}/><polygon points="270,211 372,211 446,250 342,250" fill="#fff" opacity=".28"/>`},
 {id:6,n:"ডানার ফ্ল্যাপ",b:[340,256,138,16],a:`<polygon points="348,258 470,258 476,270 342,270" fill="${g('coral')}" ${S}/>${sh(342,258,132,12)}`},
 {id:7,n:"ডানার আগা ২",b:[458,246,26,22],a:`<rect x="460" y="248" width="22" height="18" rx="7" fill="${g('lime')}" ${S}/>`},
 {id:12,n:"ইঞ্জিন ১",b:[268,226,82,38],a:`<rect x="270" y="228" width="78" height="34" rx="16" fill="${g('indigo')}" ${S}/>${sh(270,228,78,34)}`},
 {id:14,n:"পাখা ১",b:[265,230,30,30],cls:"fan",a:fan(280,245,13)},
 {id:16,n:"সামনের খুঁটি",b:[166,216,14,56],a:`<rect x="168" y="218" width="10" height="52" rx="4" fill="${g('silver')}" ${S}/>`},
 {id:17,n:"সামনের চাকা",b:[160,266,26,26],a:`<circle cx="173" cy="279" r="11" fill="${g('dark')}" ${S}/><circle cx="173" cy="279" r="4" fill="${g('silver')}"/>`},
 {id:18,n:"পেছনের খুঁটি",b:[292,228,16,36],a:`<rect x="294" y="230" width="12" height="34" rx="4" fill="${g('silver')}" ${S}/>`},
 {id:19,n:"পেছনের চাকা",b:[281,254,38,38],a:`<circle cx="300" cy="273" r="17" fill="${g('dark')}" ${S}/><circle cx="300" cy="273" r="6" fill="${g('silver')}"/>`},
 {id:20,n:"সামনের বাতি",b:[123,191,18,18],a:`<circle cx="132" cy="200" r="7" fill="${g('gold')}" ${S}/><circle cx="129" cy="197" r="2.5" fill="#fff"/>`},
];
const BASE={red:"#ef4444",blue:"#3b82f6",cyan:"#22d3ee",orange:"#f97316",yellow:"#facc15",green:"#22c55e",steel:"#64748b",purple:"#a855f7",pink:"#ec4899",gold:"#f59e0b",teal:"#14b8a6",lime:"#84cc16",indigo:"#6366f1",dark:"#334155",silver:"#94a3b8",coral:"#fb7185"};

// রঙের থিম (১ নম্বর বাটন)
const THEMES=[
 {name:"রঙধনু",map:{}},
 {name:"পুলিশ নীল",map:{red:"#1d4ed8",yellow:"#1e40af",orange:"#f8fafc",teal:"#0f172a",lime:"#0f172a",green:"#2563eb",coral:"#ef4444"}},
 {name:"আর্মি সবুজ",map:{red:"#4d7c0f",yellow:"#3f6212",orange:"#365314",teal:"#1c1917",lime:"#1c1917",green:"#57534e",coral:"#a16207",indigo:"#44403c"}},
 {name:"সোনালি",map:{red:"#d97706",yellow:"#fbbf24",orange:"#b45309",teal:"#78350f",lime:"#78350f",green:"#f59e0b",indigo:"#92400e"}},
 {name:"গোলাপি",map:{red:"#ec4899",yellow:"#f9a8d4",orange:"#db2777",teal:"#a855f7",lime:"#a855f7",green:"#f472b6",indigo:"#c026d3"}},
 {name:"অ্যাম্বুলেন্স",map:{red:"#f8fafc",yellow:"#e2e8f0",orange:"#dc2626",teal:"#dc2626",lime:"#dc2626",green:"#ef4444",coral:"#dc2626",indigo:"#cbd5e1"}},
];
const defs=document.getElementById('defs');
function paint(t){
  const m={...BASE,...THEMES[t].map};
  defs.innerHTML=Object.entries(m).map(([k,c])=>`<linearGradient id="g-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#ffffff',.55)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,'#000000',.35)}"/></linearGradient>`).join('');
}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
paint(0);

// ---------- ১ম ধাপ: টেনে এনে বানানো ----------
const TRAY=[10,17,3,8,12,15,1,9,20,4,13,16,11,6,19,7,2,14,5,18];
const $=id=>document.getElementById(id);
const scene=$('scene'),plane=$('plane'),board=$('board'),tray=$('tray');
scene.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
let placed=new Set(),drag=null,dragEl=null;
function fit(){const r=board.getBoundingClientRect();const s=Math.min(r.width/VB.w,r.height/VB.h);return{r,s,ox:(r.width-VB.w*s)/2,oy:(r.height-VB.h*s)/2}}
function buildTray(){
  tray.innerHTML='';
  TRAY.forEach(id=>{const p=PARTS.find(q=>q.id===id);const d=document.createElement('div');d.className='slot'+(placed.has(id)?' gone':'');d.dataset.id=id;
    d.innerHTML=`<svg viewBox="${p.b.join(' ')}">${p.a}</svg><span>${p.n}</span>`;
    d.querySelector('svg').addEventListener('pointerdown',e=>startDrag(e,id));tray.appendChild(d);});
}
function renderPlane(){
  // ক্রম অনুযায়ী আঁকা (পেছন থেকে সামনে)
  let h='';PARTS.forEach(p=>{if(placed.has(p.id))h+=p.a;});
  plane.innerHTML=h;
  $('count').textContent=placed.size+' / 20';
  $('hint').style.display=placed.size?'none':'flex';
  updateLights();
}
function startDrag(e,id){
  e.preventDefault();const p=PARTS.find(q=>q.id===id);const {s}=fit();
  drag={id,s,x:e.clientX,y:e.clientY};dragEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  dragEl.id='drag';dragEl.setAttribute('viewBox',p.b.join(' '));dragEl.setAttribute('width',p.b[2]*s);dragEl.setAttribute('height',p.b[3]*s);
  dragEl.innerHTML=p.a;document.body.appendChild(dragEl);
  tray.querySelector(`[data-id="${id}"]`).classList.add('gone');moveDrag(e);
}
function moveDrag(e){if(!drag)return;const p=PARTS.find(q=>q.id===drag.id);dragEl.style.left=(e.clientX-p.b[2]*drag.s/2)+'px';dragEl.style.top=(e.clientY-p.b[3]*drag.s/2)+'px';drag.x=e.clientX;drag.y=e.clientY}
window.addEventListener('pointermove',e=>{if(drag){e.preventDefault();moveDrag(e)}},{passive:false});
function endDrag(){
  if(!drag)return;const p=PARTS.find(q=>q.id===drag.id);const {r,s,ox,oy}=fit();
  const tx=r.left+ox+(p.b[0]+p.b[2]/2-VB.x+pos.x)*s, ty=r.top+oy+(p.b[1]+p.b[3]/2-VB.y+pos.y)*s;
  if(Math.hypot(drag.x-tx,drag.y-ty)<Math.max(40,55*s)){placed.add(drag.id);renderPlane()}
  else tray.querySelector(`[data-id="${drag.id}"]`).classList.remove('gone');
  dragEl.remove();dragEl=null;drag=null;
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);

// ---------- ২য় ধাপ: রং, আলো, স্টার্ট, রিমোট ----------
const msg=t=>{const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.opacity=0,1200)};
let theme=0;
$('bColor').onclick=()=>{theme=(theme+1)%THEMES.length;paint(theme);buildTray();if(drag)endDrag();msg('🎨 '+THEMES[theme].name)};

const LIGHTS=["আলো বন্ধ","জ্বলা-নেভা বাতি","সামনের হেডলাইট","রঙিন আভা","রাতের আলো"];
let light=0;
$('bLight').onclick=()=>{light=(light+1)%LIGHTS.length;updateLights();msg('💡 '+LIGHTS[light])};
function updateLights(){
  const L=$('lights');let h='';
  board.classList.toggle('night',light===4);
  plane.setAttribute('filter',light===3?'url(#glow)':'');
  plane.style.filter=light===3?'drop-shadow(0 0 8px hsl('+(Date.now()/10%360)+',100%,60%))':'';
  if(light===1||light===4){h+=`<circle class="bl1" cx="470" cy="262" r="6" fill="#ef4444"/><circle class="bl2" cx="558" cy="172" r="6" fill="#22c55e"/><circle class="bl1" cx="486" cy="92" r="5" fill="#fff"/>`}
  if(light===2||light===4){h+=`<polygon points="128,196 -40,142 -40,268" fill="url(#beam)"/>`}
  L.innerHTML=placed.size?h:'';
}
setInterval(()=>{if(light===3)updateLights()},60);

let started=false;
$('bStart').onclick=()=>{
  if(placed.size<20){msg('আগে ২০টা অংশ বসাও');return}
  started=!started;$('bStart').classList.toggle('on',started);
  $('bStart').innerHTML=started?'<b>■</b>৩ বন্ধ':'<b>▶</b>৩ স্টার্ট';
  if(!started){run=false;$$run.classList.remove('act')}
  msg(started?'✈️ ইঞ্জিন ঘুরছ!':'ইঞ্জিন বন্ধ');
};

// অবস্থা
const pos={x:0,y:0};let face=-1,tilt=0,spin=0,rot=0,trot=0,speed=0,run=false;
const held=new Set();const $$run=document.querySelector('[data-k="run"]');
document.querySelectorAll('.r').forEach(b=>{
  const k=b.dataset.k;
  if(k==='run'){b.onclick=()=>{if(!started){msg('আগে স্টার্ট চাপো');return}run=!run;b.classList.toggle('act',run)};return}
  if(k==='turn'){b.onclick=()=>{if(!started){msg('আগে স্টার্ট চাপো');return}face*=-1};return}
  if(k==='spin'){b.onclick=()=>{if(!started){msg('আগে স্টার্ট চাপো');return}if(pos.y>-5){msg('আগে উপরে ওঠো');return}spin+=360};return}
  const on=e=>{e.preventDefault();if(!started){msg('আগে স্টার্ট চাপো');return}held.add(k);b.classList.add('act')};
  const off=()=>{held.delete(k);b.classList.remove('act')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
// কীবোর্ড (কম্পিউটারে)
const KEY={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
addEventListener('keydown',e=>{if(KEY[e.key]&&started)held.add(KEY[e.key])});
addEventListener('keyup',e=>{if(KEY[e.key])held.delete(KEY[e.key])});

let spinNow=0,last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  // ইঞ্জিনের পাখা ঘোরা
  speed+=((started?1:0)-speed)*dt*1.5;
  rot+=speed*dt*14; trot+=speed*dt*900;
  plane.querySelectorAll('.fan').forEach(f=>{
    const c=f.dataset.c.split(',');
    f.setAttribute('transform',`rotate(${trot} ${c[0]} ${c[1]})`);
  });
  // চলচল
  let vx=0,vy=0;const air=pos.y<-2;
  if(held.has('up'))vy=-120;
  if(held.has('down'))vy=120;
  if(air&&held.has('left')){vx=-160;face=-1}
  if(air&&held.has('right')){vx=160;face=1}
  if(run&&air)vx=220*face;
  if(started&&!air&&run)vy=-80; // রান চাপলে নিজে উঠে যায়
  if(!started&&air)vy=90; // ইঞ্জিন বন্ধ হলে নেমে আসে
  pos.x+=vx*dt;pos.y+=vy*dt;
  pos.y=Math.max(-120,Math.min(0,pos.y));
  // রান করলে স্ক্রিনের এক পাশ দিয়ে বেরিয়ে অন্য পাশে আসে
  if(pos.x>506)pos.x=-506; if(pos.x<-506)pos.x=506;
  if(!run)pos.x=Math.max(-120,Math.min(120,pos.x));
  const tTilt=vx? (vx>0?8:-8) : 0; tilt+=(tTilt-tilt)*dt*5;
  spinNow+=(spin-spinNow)*dt*3;
  const bob=air?Math.sin(t/300)*2:0;
  $('mover').setAttribute('transform',`translate(${pos.x} ${pos.y+bob})`);
  $('facer').setAttribute('transform',`translate(328 190) scale(${-face*Math.cos(spinNow*Math.PI/180)||-face*0.01} 1) translate(-328 -190)`);
  $('tilter').setAttribute('transform',`rotate(${face>0?-Math.abs(tilt)*Math.sign(vx||0)*-1:tilt} 328 190)`);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$('reset').onclick=()=>{placed=new Set();started=false;run=false;pos.x=pos.y=0;face=-1;spin=spinNow=0;
  $('bStart').classList.remove('on');$('bStart').innerHTML='<b>▶</b>৩ স্টার্ট';$$run.classList.remove('act');buildTray();renderPlane()};
buildTray();renderPlane();

// ---------- সাউন্ড: বিমানের ইঞ্জিন ----------
let snd=true,actx=null,J=null;
function ensureAudio(){
  if(actx)return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  const master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
  // গর্জন (noise)
  const buf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
  const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=70;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;lp.Q.value=.8;
  const roar=actx.createGain();roar.gain.value=.9;
  src.connect(hp);hp.connect(lp);lp.connect(roar);roar.connect(master);
  // বুক বুক (sub)
  const sub=actx.createOscillator();sub.type='sawtooth';sub.frequency.value=44;
  const sg=actx.createGain();sg.gain.value=.28;sub.connect(sg);sg.connect(master);
  // টারবাইনের হাইম (whine)
  const wh=actx.createOscillator();wh.type='triangle';wh.frequency.value=650;
  const wg=actx.createGain();wg.gain.value=.1;wh.connect(wg);wg.connect(master);
  // বাতাসের শিষ (hiss)
  const hs=actx.createOscillator();hs.type='sine';hs.frequency.value=5200;
  const hg=actx.createGain();hg.gain.value=.025;hs.connect(hg);hg.connect(master);
  src.start();sub.start();wh.start();hs.start();
  J={master,lp,sub,wh};
}
function updSound(){
  if(!actx||!J)return;
  actx.resume();
  const t=actx.currentTime,v=(snd&&started)?.55:0;
  J.master.gain.setTargetAtTime(v,t,.35);
  // স্টার্ট দিলে ইঞ্জিন ধীরে ধীরে চড়া হয় (পITCH বাড়ে)
  J.sub.frequency.setTargetAtTime(38+speed*26,t,.4);
  J.wh.frequency.setTargetAtTime(650+speed*2400,t,.5);
  J.lp.frequency.setTargetAtTime(420+speed*1500,t,.5);
}
$('bSound').onclick=()=>{ensureAudio();snd=!snd;$('bSound').innerHTML=snd?'<b>🔊</b>সাউন্ড':'<b>🔇</b>বন্ধ';updSound()};
document.addEventListener('click',()=>{if(started)ensureAudio();updSound()},true);
setInterval(updSound,120);
</script>
