<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CT Scan Machine Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#0d1b2a;color:#e8f1ff}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 14px 6px;background:linear-gradient(90deg,#0b3d5c,#126e82,#0b3d5c);box-shadow:0 2px 12px #0008;text-align:center}
header h1{font-size:19px;letter-spacing:2px;font-weight:800;text-transform:uppercase;background:linear-gradient(90deg,#9ff3ff,#fff,#9ff3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
header small{font-size:11px;letter-spacing:3px;color:#bfe9f2}
#bar{height:6px;background:#ffffff22;border-radius:4px;margin:6px 0 0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#4ade80);transition:width .3s}
#stage{flex:1;position:relative;min-height:0;background:radial-gradient(ellipse at 50% 40%,#1e3a52,#0d1b2a 75%)}
#stage.light{background:radial-gradient(ellipse at 50% 40%,#ffffff,#d9e4ee 80%)}
#machine{width:100%;height:100%;display:block}
#tray{height:128px;background:#0a1622;border-top:2px solid #22d3ee55;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px;touch-action:pan-x}
.tile{flex:0 0 92px;height:108px;border-radius:12px;background:#13283b;border:2px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;box-shadow:0 0 10px var(--c) inset}
.tile svg{width:76px;height:72px;pointer-events:none}
.tile span{font-size:10px;font-weight:700;color:#fff;margin-top:3px;text-align:center;line-height:1.1;pointer-events:none}
nav{display:flex;gap:6px;padding:8px;background:#06101a}
nav button{flex:1;padding:11px 4px;border:0;border-radius:12px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(180deg,#1f4e6e,#123247);box-shadow:0 3px 0 #061a28,0 0 0 1px #2dd4ff44 inset;letter-spacing:.5px}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #061a28}
#pwr{background:linear-gradient(180deg,#555,#333)}
#pwr.ready{background:linear-gradient(180deg,#22c55e,#15803d);animation:pulse 1.2s infinite}
#pwr.on{background:linear-gradient(180deg,#ef4444,#b91c1c)}
@keyframes pulse{50%{box-shadow:0 0 18px #4ade80}}
#drag{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 12px #000a) drop-shadow(0 0 6px var(--c));display:none}
#ring{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px #22d3ee;pointer-events:none;z-index:49;display:none}
#cc{position:fixed;right:10px;bottom:70px;width:250px;background:#0f2233f2;border:1px solid #22d3ee66;border-radius:16px;padding:14px;z-index:40;display:none;box-shadow:0 10px 30px #000a}
#cc h3{font-size:14px;letter-spacing:2px;margin-bottom:10px;color:#7dd3fc}
#cc label{font-size:12px;display:block;margin:8px 0 4px;color:#cbd5e1}
.sw{display:flex;gap:8px}
.sw b{width:34px;height:34px;border-radius:50%;border:3px solid #fff3}
.sw b.act{border-color:#22d3ee}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{flex:1;padding:8px;border:0;border-radius:10px;background:#1e3a52;color:#fff;font-weight:700;font-size:12px}
.row button.act{background:#0891b2}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#16a34a;padding:10px 18px;border-radius:20px;font-weight:800;display:none;z-index:60;box-shadow:0 4px 16px #0008;white-space:nowrap}
.placed{animation:pop .35s}
@keyframes pop{0%{opacity:.3}60%{opacity:1;filter:brightness(1.6)}100%{filter:none}}
#slide{transition:transform 2.5s ease-in-out}
</style>
</head>
<body>
<div id="app">
<header><h1>CT Scan Machine</h1><small>DRAG &amp; ASSEMBLE · 20 PARTS</small><div id="bar"><i></i></div></header>
<div id="stage"><svg id="machine" viewBox="0 40 480 340" preserveAspectRatio="xMidYMid meet"></svg></div>
<div id="tray"></div>
<nav>
<button id="bReset">↺ Reset</button>
<button id="bHint">◎ Hint</button>
<button id="bCC">⚙ Control</button>
<button id="pwr">⏻ Power</button>
</nav>
</div>
<div id="drag"></div><div id="ring"></div><div id="toast"></div>
<div id="cc">
<h3>CONTROL CENTER</h3>
<label>Machine Color</label>
<div class="sw" id="colors"></div>
<label>Background</label>
<div class="row"><button data-bg="dark" class="act">Dark</button><button data-bg="light">Light</button></div>
<label>Placement Guide</label>
<div class="row"><button data-g="1" class="act">On</button><button data-g="0">Off</button></div>
<label>Assembly</label>
<div class="row"><button id="auto">Auto Build</button><button id="shuf">Shuffle</button></div>
<label>Scan Mode (when ON)</label>
<div class="row"><button data-m="a" class="act">Axial</button><button data-m="c">Contrast</button></div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const COLORS={White:["#ffffff","#e4e9ee","#b9c3cc"],Grey:["#d7dbe0","#aeb5bd","#7f8892"],Sky:["#e8f6ff","#b8dcf2","#7fb2d4"],Mint:["#effcf7","#c2eadb","#86c7ad"]};
const DEFS=`<defs>
<linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="var(--b2)"/><stop offset=".35" stop-color="var(--b1)"/><stop offset="1" stop-color="var(--b3)"/></linearGradient>
<linearGradient id="bodyV" y1="0" y2="1" x1="0" x2="0"><stop offset="0" stop-color="var(--b1)"/><stop offset="1" stop-color="var(--b3)"/></linearGradient>
<radialGradient id="ringG" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="var(--b1)"/><stop offset=".7" stop-color="var(--b2)"/><stop offset="1" stop-color="var(--b3)"/></radialGradient>
<radialGradient id="boreG" cx=".6" cy=".6" r=".7"><stop offset="0" stop-color="#1b2530"/><stop offset=".6" stop-color="#5b6877"/><stop offset="1" stop-color="#c9d2da"/></radialGradient>
<linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#8a939c"/><stop offset=".5" stop-color="#d9dee3"/><stop offset="1" stop-color="#6b737b"/></linearGradient>
<linearGradient id="dark" y1="0" y2="1" x1="0" x2="0"><stop offset="0" stop-color="#5a6470"/><stop offset="1" stop-color="#2c333b"/></linearGradient>
<linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
<linearGradient id="pad" y1="0" y2="1" x1="0" x2="0"><stop offset="0" stop-color="#7fb8e6"/><stop offset="1" stop-color="#2f6aa3"/></linearGradient>
<radialGradient id="glass" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#2b3540"/><stop offset="1" stop-color="#05080b"/></radialGradient>
</defs>`;
const CX=235,CY=190;
const PARTS=[
{id:"floor",n:"Floor Plinth",c:"#a855f7",s:`<ellipse cx="240" cy="318" rx="210" ry="26" fill="#000" opacity=".25"/><path d="M160 300 L320 300 L334 318 L148 318Z" fill="url(#metal)"/><rect x="148" y="318" width="186" height="8" rx="2" fill="#6b737b"/>`},
{id:"back",n:"Gantry Housing",c:"#3b82f6",s:`<path d="M${CX+10} 70 Q${CX+130} 75 ${CX+132} 190 Q${CX+130} 300 ${CX+10} 306 L${CX+30} 306 Q${CX+150} 300 ${CX+152} 190 Q${CX+150} 78 ${CX+30} 72Z" fill="url(#bodyV)" stroke="#9aa6b2"/><rect x="${CX-100}" y="250" width="215" height="54" rx="10" fill="url(#body)" stroke="#9aa6b2"/>`},
{id:"gantry",n:"Gantry Ring",c:"#22c55e",s:`<path fill-rule="evenodd" d="M${CX-115} ${CY} a115 120 0 1 0 230 0 a115 120 0 1 0 -230 0Z M${CX-58} ${CY} a58 60 0 1 0 116 0 a58 60 0 1 0 -116 0Z" fill="url(#ringG)" stroke="#9aa6b2" stroke-width="1.5"/><path d="M${CX-100} ${CY-40} Q${CX-70} ${CY-108} ${CX} ${CY-112}" stroke="#fff" stroke-width="5" fill="none" opacity=".8" stroke-linecap="round"/>`},
{id:"bore",n:"Scan Bore",c:"#06b6d4",s:`<ellipse cx="${CX}" cy="${CY}" rx="58" ry="60" fill="url(#boreG)"/><ellipse cx="${CX+8}" cy="${CY+4}" rx="40" ry="44" fill="none" stroke="#8fa0b0" stroke-width="2" opacity=".6"/>`},
{id:"trim",n:"Bore Trim",c:"#0ea5e9",s:`<ellipse cx="${CX}" cy="${CY}" rx="64" ry="66" fill="none" stroke="url(#blue)" stroke-width="7"/>`},
{id:"band",n:"Accent Band",c:"#1d4ed8",s:`<path d="M${CX-112} ${CY+30} Q${CX} ${CY+150} ${CX+112} ${CY+30}" stroke="url(#blue)" stroke-width="8" fill="none" stroke-linecap="round"/>`},
{id:"panelL",n:"Control Panel L",c:"#f59e0b",s:`<rect x="${CX-98}" y="${CY-14}" width="22" height="34" rx="4" fill="#2c333b"/><circle cx="${CX-87}" cy="${CY-4}" r="3" fill="#22c55e"/><circle cx="${CX-87}" cy="${CY+6}" r="3" fill="#facc15"/><rect x="${CX-93}" y="${CY+12}" width="12" height="4" rx="2" fill="#3b82f6"/>`},
{id:"panelR",n:"Control Panel R",c:"#eab308",s:`<rect x="${CX+76}" y="${CY-14}" width="22" height="34" rx="4" fill="#2c333b"/><circle cx="${CX+87}" cy="${CY-4}" r="3" fill="#ef4444"/><circle cx="${CX+87}" cy="${CY+6}" r="3" fill="#22c55e"/><rect x="${CX+81}" y="${CY+12}" width="12" height="4" rx="2" fill="#3b82f6"/>`},
{id:"logo",n:"Status Display",c:"#10b981",s:`<rect x="${CX-30}" y="${CY-98}" width="60" height="16" rx="4" fill="#0b1520" stroke="#3a4652"/><text x="${CX}" y="${CY-86}" font-size="10" font-weight="800" text-anchor="middle" fill="#38bdf8">CT 128</text>`},
{id:"tbase",n:"Table Pedestal",c:"#f97316",s:`<path d="M40 300 L150 300 L158 318 L32 318Z" fill="url(#metal)"/><path d="M58 300 L132 300 L126 262 L64 262Z" fill="url(#body)" stroke="#9aa6b2"/>`},
{id:"lift",n:"Lift Column",c:"#ef4444",s:`<path d="M74 262 L118 262 L124 238 L68 238Z" fill="url(#dark)"/><rect x="70" y="244" width="52" height="4" fill="#8a96a2"/>`},
{id:"cradle",n:"Table Cradle",c:"#ec4899",s:`<g class="sl"><path d="M14 226 L230 222 Q238 222 238 230 L236 240 L18 242 Q10 242 10 234Z" fill="url(#bodyV)" stroke="#9aa6b2"/><path d="M18 242 L236 240 L236 246 L20 248Z" fill="#9aa3ab"/></g>`},
{id:"mattress",n:"Mattress",c:"#38bdf8",s:`<g class="sl"><rect x="34" y="214" width="196" height="12" rx="6" fill="url(#pad)"/></g>`},
{id:"head",n:"Head Rest",c:"#8b5cf6",s:`<g class="sl"><path d="M196 214 Q200 198 222 200 Q236 202 234 214Z" fill="url(#pad)"/></g>`},
{id:"rail",n:"Side Rails",c:"#84cc16",s:`<g class="sl"><rect x="20" y="236" width="200" height="3" rx="1.5" fill="url(#metal)"/><rect x="40" y="230" width="6" height="10" rx="2" fill="#6b737b"/><rect x="120" y="230" width="6" height="10" rx="2" fill="#6b737b"/></g>`},
{id:"pedal",n:"Foot Pedals",c:"#f43f5e",s:`<rect x="40" y="304" width="24" height="8" rx="3" fill="#2c333b"/><rect x="126" y="304" width="24" height="8" rx="3" fill="#2c333b"/>`},
{id:"desk",n:"Console Desk",c:"#14b8a6",s:`<path d="M360 228 L470 228 L476 236 L354 236Z" fill="url(#body)" stroke="#9aa6b2"/><rect x="364" y="236" width="6" height="84" fill="url(#metal)"/><rect x="460" y="236" width="6" height="84" fill="url(#metal)"/>`},
{id:"tower",n:"Workstation",c:"#c084fc",s:`<rect x="430" y="262" width="30" height="58" rx="3" fill="url(#dark)"/><circle cx="445" cy="272" r="3" fill="#22c55e"/><rect x="436" y="282" width="18" height="2" fill="#1a1f25"/><rect x="436" y="288" width="18" height="2" fill="#1a1f25"/>`},
{id:"kbd",n:"Keyboard",c:"#fde047",s:`<path d="M378 222 L432 222 L436 228 L374 228Z" fill="#5d6773"/>${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${380+i*6.5}" y="223.5" width="5" height="3" rx=".6" fill="#dfe6ec"/>`).join("")}<ellipse cx="450" cy="225" rx="5" ry="3" fill="#5d6773"/>`},
{id:"monitor",n:"Dual Monitors",c:"#2dd4bf",s:`<rect x="410" y="196" width="6" height="28" fill="url(#metal)"/><rect x="356" y="148" width="58" height="46" rx="3" fill="url(#dark)"/><rect x="359" y="151" width="52" height="40" fill="url(#glass)"/><rect x="414" y="146" width="58" height="48" rx="3" fill="url(#dark)"/><rect x="417" y="149" width="52" height="42" fill="url(#glass)"/><path d="M392 222 L434 222 L428 218 L398 218Z" fill="#6b737b"/>`}
];
const svg=document.getElementById("machine"),tray=document.getElementById("tray"),drag=document.getElementById("drag"),ring=document.getElementById("ring");
let placed={},guide=true,powered=false,mode="a";
svg.innerHTML=DEFS+`<g id="ghost" opacity=".18"></g><g id="parts"></g><g id="fx" style="display:none"></g><g id="screen" style="display:none"></g>`;
const ghost=svg.querySelector("#ghost"),pg=svg.querySelector("#parts"),scr=svg.querySelector("#screen"),fx=svg.querySelector("#fx");
const TOTAL=PARTS.length;
PARTS.forEach(p=>{
  const g=document.createElementNS(NS,"g");g.innerHTML=p.s;
  g.querySelectorAll("*").forEach(e=>{if(e.tagName=="g")return;e.setAttribute("fill","none");e.setAttribute("stroke","#7dd3fc");e.setAttribute("stroke-dasharray","4 3");e.setAttribute("stroke-width","1.2")});
  ghost.appendChild(g);
  const slot=document.createElementNS(NS,"g");slot.id="p_"+p.id;slot.innerHTML=p.s;pg.appendChild(slot);
  p.bb=slot.getBBox();slot.style.display="none";
});
function setColor(k){const [a,b,c]=COLORS[k];const r=document.documentElement.style;r.setProperty("--b1",a);r.setProperty("--b2",b);r.setProperty("--b3",c);
  document.querySelectorAll("#colors b").forEach(e=>e.classList.toggle("act",e.dataset.k==k))}
Object.keys(COLORS).forEach(k=>{const b=document.createElement("b");b.dataset.k=k;b.style.background=COLORS[k][0];b.onclick=()=>setColor(k);document.getElementById("colors").appendChild(b)});
setColor("White");
function thumb(p){const pad=4,b=p.bb;return `<svg viewBox="${b.x-pad} ${b.y-pad} ${b.width+pad*2} ${b.height+pad*2}">${DEFS}${p.s}</svg>`}
function buildTray(order){tray.innerHTML="";order.forEach(p=>{if(placed[p.id])return;const t=document.createElement("div");t.className="tile";t.style.setProperty("--c",p.c);t.innerHTML=thumb(p)+`<span>${p.n}</span>`;t.dataset.id=p.id;t.addEventListener("pointerdown",e=>start(e,p,t));tray.appendChild(t)})}
function shuffled(){return PARTS.slice().sort(()=>Math.random()-.5)}
let cur=null;
function start(e,p,tile){e.preventDefault();const s=svg.getScreenCTM().a;cur={p,tile,w:p.bb.width*s,h:p.bb.height*s};
  drag.style.setProperty("--c",p.c);drag.innerHTML=`<svg width="${cur.w}" height="${cur.h}" viewBox="${p.bb.x} ${p.bb.y} ${p.bb.width} ${p.bb.height}" style="overflow:visible">${DEFS}${p.s}</svg>`;
  drag.style.display="block";ring.style.display="block";tile.style.opacity=".25";move(e);
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end)}
function move(e){if(!cur)return;e.preventDefault();cur.x=e.clientX;cur.y=e.clientY;
  drag.style.transform=`translate(${cur.x-cur.w/2}px,${cur.y-cur.h/2}px) scale(1.04)`;ring.style.left=cur.x+"px";ring.style.top=cur.y+"px"}
function end(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",end);window.removeEventListener("pointercancel",end);
  if(!cur)return;const {p,tile}=cur;const m=svg.getScreenCTM();
  const tx=m.a*(p.bb.x+p.bb.width/2)+m.e,ty=m.d*(p.bb.y+p.bb.height/2)+m.f;
  const d=Math.hypot(cur.x-tx,cur.y-ty),tol=Math.max(45,Math.min(cur.w,cur.h)*.45);
  drag.style.display="none";ring.style.display="none";
  if(d<tol){place(p.id);tile.remove()}else{tile.style.opacity="1";toast("Try again: "+p.n)}
  cur=null}
function place(id){placed[id]=1;const el=document.getElementById("p_"+id);el.style.display="";el.classList.remove("placed");void el.getBBox();el.classList.add("placed");update()}
function update(){const n=Object.keys(placed).length;document.querySelector("#bar i").style.width=(n/TOTAL*100)+"%";
  ghost.style.display=guide&&n<TOTAL?"":"none";document.getElementById("pwr").classList.toggle("ready",n==TOTAL&&!powered);
  if(n==TOTAL&&!powered)toast("Assembly complete! Press Power")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)}
function slide(on){document.querySelectorAll("#parts .sl").forEach(g=>{g.style.transition="transform 2.5s ease-in-out";g.style.transform=on?"translateX(70px)":"none"})}
// CT slice drawing
function slice(x,y,w,h,t,c,k){const cx=x+w/2,cy=y+h/2,s=Math.min(w,h)/2-3,b=1+.04*Math.sin(t/300+k);
  let g=`<ellipse cx="${cx}" cy="${cy}" rx="${s*.95}" ry="${s*.8}" fill="#9aa3ab" opacity=".85"/><ellipse cx="${cx}" cy="${cy}" rx="${s*.82}" ry="${s*.68}" fill="#3a4450"/>`;
  g+=`<ellipse cx="${cx-s*.35}" cy="${cy-s*.05}" rx="${s*.3*b}" ry="${s*.4*b}" fill="#1a1f25"/><ellipse cx="${cx+s*.35}" cy="${cy-s*.05}" rx="${s*.3*b}" ry="${s*.4*b}" fill="#1a1f25"/>`;
  g+=`<circle cx="${cx}" cy="${cy+s*.45}" r="${s*.14}" fill="#f1f5f9"/><ellipse cx="${cx+s*.08}" cy="${cy+s*.05}" rx="${s*.22}" ry="${s*.2}" fill="${c?'#ef4444':'#8a96a2'}" opacity="${c?.85:.9}"/>`;
  if(c)g+=`<circle cx="${cx-s*.1}" cy="${cy+s*.2}" r="${s*.07}" fill="#facc15"/>`;
  return g}
let raf;
function drawScreen(t){const c=mode=="c";
  let h=`<rect x="359" y="151" width="52" height="40" fill="#000"/>${slice(359,151,52,40,t,c,0)}<text x="362" y="158" font-size="4" fill="#4ade80">AXIAL ${(Math.floor(t/100)%300)+1}</text>`;
  h+=`<rect x="417" y="149" width="52" height="42" fill="#000"/>`;
  for(let i=0;i<4;i++){const xx=417+(i%2)*26,yy=149+Math.floor(i/2)*21;h+=slice(xx,yy,26,21,t+i*400,c,i)}
  h+=`<rect x="${CX-28}" y="${CY-96}" width="56" height="12" fill="#0b1520"/><text x="${CX}" y="${CY-87}" font-size="8" font-weight="800" text-anchor="middle" fill="${Math.floor(t/400)%2?'#facc15':'#f97316'}">SCANNING</text>`;
  scr.innerHTML=h;
  const a=(t/6)%360;
  fx.innerHTML=`<g transform="rotate(${a} ${CX} ${CY})"><ellipse cx="${CX}" cy="${CY}" rx="61" ry="63" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="20 340" opacity=".9"/></g><line x1="${CX}" y1="${CY-60}" x2="${CX}" y2="${CY+60}" stroke="#ef4444" stroke-width="1" opacity="${.5+.4*Math.sin(t/150)}"/><line x1="${CX-58}" y1="${CY+24}" x2="${CX+58}" y2="${CY+24}" stroke="#ef4444" stroke-width=".8" opacity=".6"/>`;
  raf=requestAnimationFrame(drawScreen)}
document.getElementById("pwr").onclick=()=>{
  if(Object.keys(placed).length<TOTAL){toast("Complete all 20 parts first");return}
  powered=!powered;const b=document.getElementById("pwr");b.classList.toggle("on",powered);b.classList.remove("ready");
  slide(powered);
  if(powered){scr.style.display="";fx.style.display="";raf=requestAnimationFrame(drawScreen)}else{cancelAnimationFrame(raf);scr.style.display="none";fx.style.display="none"}};
function reset(){placed={};powered=false;cancelAnimationFrame(raf);scr.style.display="none";fx.style.display="none";slide(false);document.getElementById("pwr").className="";
  PARTS.forEach(p=>document.getElementById("p_"+p.id).style.display="none");buildTray(shuffled());update()}
document.getElementById("bReset").onclick=reset;
document.getElementById("bHint").onclick=()=>{const t=tray.querySelector(".tile");if(!t)return;const p=PARTS.find(x=>x.id==t.dataset.id);
  const g=ghost.children[PARTS.indexOf(p)];ghost.style.display="";g.setAttribute("opacity","6");g.querySelectorAll("*").forEach(e=>e.setAttribute("stroke","#facc15"));
  t.scrollIntoView({behavior:"smooth",inline:"center"});setTimeout(()=>{g.removeAttribute("opacity");g.querySelectorAll("*").forEach(e=>e.setAttribute("stroke","#7dd3fc"));update()},1500)};
const cc=document.getElementById("cc");document.getElementById("bCC").onclick=()=>cc.style.display=cc.style.display=="block"?"none":"block";
cc.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-bg]").forEach(x=>x.classList.toggle("act",x==b));document.getElementById("stage").classList.toggle("light",b.dataset.bg=="light")});
cc.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("act",x==b));guide=b.dataset.g=="1";update()});
cc.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("act",x==b));mode=b.dataset.m});
document.getElementById("auto").onclick=()=>{let i=0;const left=PARTS.filter(p=>!placed[p.id]);const iv=setInterval(()=>{if(i>=left.length){clearInterval(iv);return}place(left[i].id);const t=tray.querySelector(`[data-id="${left[i].id}"]`);t&&t.remove();i++},120)};
document.getElementById("shuf").onclick=()=>buildTray(shuffled());
document.addEventListener("touchmove",e=>{if(!e.target.closest("#tray"))e.preventDefault()},{passive:false});
buildTray(shuffled());update();
</script>
</body>
</html>
