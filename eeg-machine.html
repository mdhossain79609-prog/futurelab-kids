<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EEG Machine Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#0d1b2a;color:#e8f1ff}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 14px 6px;background:linear-gradient(90deg,#0b3d5c,#126e82,#0b3d5c);box-shadow:0 2px 12px #0008;text-align:center}
header h1{font-size:19px;letter-spacing:2px;font-weight:800;text-transform:uppercase;background:linear-gradient(90deg,#9ff3ff,#fff,#9ff3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
header small{font-size:11px;letter-spacing:2px;color:#bfe9f2}
#bar{height:6px;background:#ffffff22;border-radius:4px;margin:6px 0 0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#4ade80);transition:width .3s}
#stage{flex:1;position:relative;min-height:0;background:radial-gradient(ellipse at 50% 40%,#1e3a52,#0d1b2a 75%)}
#stage.light{background:radial-gradient(ellipse at 50% 40%,#ffffff,#d9e4ee 80%)}
#machine{width:100%;height:100%;display:block}
#tray{height:128px;background:#0a1622;border-top:2px solid #22d3ee55;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px;touch-action:pan-x}
.tile{flex:0 0 92px;height:108px;border-radius:12px;background:#13283b;border:2px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;box-shadow:0 0 10px var(--c) inset}
.tile svg{width:76px;height:70px;pointer-events:none}
.tile span{font-size:10px;font-weight:700;color:#fff;margin-top:3px;text-align:center;line-height:1.15;pointer-events:none}
.drag{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.1)}
nav{display:flex;gap:6px;padding:8px;background:#06101a}
nav button{flex:1;padding:11px 4px;border:0;border-radius:12px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(180deg,#1f4e6e,#123247);box-shadow:0 3px 0 #061a28,0 0 0 1px #2dd4ff44 inset}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #061a28}
#pwr{background:linear-gradient(180deg,#555,#333)}
#pwr.ready{background:linear-gradient(180deg,#f59e0b,#b45309);animation:pulse 1s infinite}
#pwr.on{background:linear-gradient(180deg,#22c55e,#15803d)}
@keyframes pulse{50%{filter:brightness(1.4)}}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#cc{display:none;position:absolute;right:8px;top:8px;background:#0a1622ee;border:1px solid #22d3ee66;border-radius:12px;padding:10px;z-index:20;font-size:12px;width:190px}
#cc div{margin:6px 0 3px;color:#9fd}
#cc button{padding:6px 8px;margin:2px;border-radius:8px;border:1px solid #2dd4ff55;background:#123247;color:#fff;font-size:11px}
#cc button.act{background:#0891b2}
#lbl{position:absolute;left:8px;top:8px;font-size:11px;background:#0008;padding:4px 8px;border-radius:8px;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>EEG Machine Builder</h1>
  <small>Assemble the machine from 20 parts · <b id="cnt">0</b>/20</small>
  <div id="bar"><i></i></div>
</header>
<div id="stage">
  <div id="lbl">Drag parts onto the machine</div>
  <svg id="machine" viewBox="0 0 400 630" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#9aa7b4"/><stop offset=".5" stop-color="#f1f5f9"/><stop offset="1" stop-color="#9aa7b4"/></linearGradient>
      <linearGradient id="white" x1="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4dde6"/></linearGradient>
      <linearGradient id="dark" x1="0" y1="0" y2="1"><stop offset="0" stop-color="#3a4552"/><stop offset="1" stop-color="#151b22"/></linearGradient>
      <linearGradient id="blue" x1="0" y1="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    </defs>
    <g id="ghost"></g>
    <g id="parts"></g>
    <g id="scr" style="display:none"></g>
    <g id="fx" style="display:none"></g>
  </svg>
  <div id="cc">
    <b>⚙ Settings</b>
    <div>Background</div><button data-bg="dark" class="act">Dark</button><button data-bg="light">Light</button>
    <div>Guide lines</div><button data-g="1" class="act">On</button><button data-g="0">Off</button>
    <div>Mode</div><button data-m="easy" class="act">Easy</button><button data-m="exact">Exact</button>
    <div>Other</div><button id="auto">Auto build</button><button id="shuf">Shuffle</button>
  </div>
</div>
<div id="tray"></div>
<nav>
  <button id="bReset">↺ Reset</button>
  <button id="bHint">💡 Hint</button>
  <button id="bCC">⚙ Settings</button>
  <button id="pwr">⏻ Power</button>
</nav>
</div>
<div id="toast"></div>
<script>
const NS="http://www.w3.org/2000/svg";
const PARTS=[
 {id:"wheels",n:"1. Caster Wheels",c:"#94a3b8",s:`<g fill="url(#dark)" stroke="#000" stroke-width="1"><circle cx="75" cy="608" r="12"/><circle cx="150" cy="614" r="12"/><circle cx="250" cy="614" r="12"/><circle cx="325" cy="608" r="12"/></g><g fill="#94a3b8"><circle cx="75" cy="608" r="4"/><circle cx="150" cy="614" r="4"/><circle cx="250" cy="614" r="4"/><circle cx="325" cy="608" r="4"/></g>`},
 {id:"base",n:"2. Base Frame",c:"#cbd5e1",s:`<path d="M60 584 L200 570 L340 584 L330 598 L200 602 L70 598Z" fill="url(#metal)" stroke="#64748b"/>`},
 {id:"pole",n:"3. Main Pole",c:"#e2e8f0",s:`<rect x="190" y="250" width="20" height="325" rx="3" fill="url(#metal)" stroke="#64748b"/>`},
 {id:"shelf1",n:"4. Bottom Shelf",c:"#f1f5f9",s:`<rect x="80" y="510" width="240" height="14" rx="4" fill="url(#white)" stroke="#94a3b8"/>`},
 {id:"printer",n:"5. Printer",c:"#64748b",s:`<rect x="105" y="462" width="190" height="48" rx="5" fill="url(#dark)"/><rect x="125" y="470" width="150" height="6" rx="2" fill="#0b0f14"/><rect x="135" y="455" width="130" height="9" fill="#f8fafc"/><circle cx="280" cy="496" r="3" fill="#4ade80"/>`},
 {id:"shelf2",n:"6. Middle Shelf",c:"#f1f5f9",s:`<rect x="80" y="440" width="240" height="14" rx="4" fill="url(#white)" stroke="#94a3b8"/>`},
 {id:"pc",n:"7. Computer CPU",c:"#475569",s:`<rect x="232" y="368" width="78" height="72" rx="5" fill="url(#dark)"/><rect x="242" y="378" width="58" height="5" fill="#0b0f14"/><circle cx="295" cy="428" r="4" fill="#38bdf8"/>`},
 {id:"amp",n:"8. EEG Amplifier",c:"#38bdf8",s:`<rect x="88" y="378" width="132" height="62" rx="6" fill="url(#white)" stroke="#0284c7" stroke-width="2"/><rect x="96" y="386" width="40" height="14" rx="2" fill="#0c4a6e"/><text x="100" y="397" font-size="8" fill="#7dd3fc" font-family="monospace">EEG-20</text><g fill="#22c55e">${Array.from({length:20},(_,i)=>`<circle cx="${100+(i%10)*11}" cy="${412+Math.floor(i/10)*12}" r="3"/>`).join("")}</g>`},
 {id:"tray",n:"9. Keyboard Tray",c:"#e2e8f0",s:`<rect x="70" y="330" width="260" height="12" rx="4" fill="url(#white)" stroke="#94a3b8"/>`},
 {id:"handle",n:"10. Handle",c:"#cbd5e1",s:`<path d="M62 336 Q50 336 50 350 L50 356 L350 356 L350 350 Q350 336 338 336" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>`},
 {id:"kbd",n:"11. Keyboard",c:"#1e293b",s:`<rect x="100" y="314" width="170" height="16" rx="3" fill="url(#dark)"/><g fill="#64748b">${Array.from({length:30},(_,i)=>`<rect x="${104+(i%15)*11}" y="${317+Math.floor(i/15)*6}" width="9" height="4" rx="1"/>`).join("")}</g>`},
 {id:"mouse",n:"12. Mouse",c:"#334155",s:`<ellipse cx="300" cy="322" rx="10" ry="7" fill="url(#dark)"/><line x1="300" y1="315" x2="300" y2="322" stroke="#64748b"/>`},
 {id:"arm",n:"13. Monitor Arm",c:"#cbd5e1",s:`<rect x="194" y="226" width="12" height="30" fill="url(#metal)" stroke="#64748b"/><rect x="170" y="250" width="60" height="8" rx="3" fill="url(#metal)" stroke="#64748b"/>`},
 {id:"monitor",n:"14. Monitor",c:"#0ea5e9",s:`<rect x="72" y="92" width="256" height="140" rx="8" fill="url(#dark)" stroke="#0b0f14" stroke-width="2"/><rect x="82" y="102" width="236" height="118" fill="#0b1724"/><circle cx="200" cy="226" r="2" fill="#38bdf8"/>`},
 {id:"campole",n:"15. Camera Stand",c:"#cbd5e1",s:`<rect x="336" y="60" width="7" height="310" fill="url(#metal)" stroke="#64748b"/><rect x="310" y="365" width="34" height="8" fill="url(#metal)"/>`},
 {id:"camera",n:"16. Video Camera",c:"#f8fafc",s:`<path d="M318 60 Q318 38 339 38 Q360 38 360 60Z" fill="url(#white)" stroke="#94a3b8"/><circle cx="339" cy="56" r="9" fill="#0b0f14"/><circle cx="339" cy="56" r="4" fill="#1e40af"/><circle cx="336" cy="53" r="1.5" fill="#fff"/>`},
 {id:"photic",n:"17. Photic Stimulator",c:"#facc15",s:`<path d="M62 300 Q30 200 70 80" fill="none" stroke="#64748b" stroke-width="4"/><rect x="28" y="56" width="92" height="28" rx="6" fill="url(#white)" stroke="#94a3b8"/><rect x="36" y="62" width="76" height="16" rx="3" fill="#fef9c3" stroke="#ca8a04"/>`},
 {id:"headbox",n:"18. Electrode Headbox",c:"#22d3ee",s:`<rect x="22" y="468" width="56" height="56" rx="6" fill="url(#blue)" stroke="#075985"/><g fill="#e0f2fe">${Array.from({length:20},(_,i)=>`<circle cx="${30+(i%5)*10}" cy="${478+Math.floor(i/5)*10}" r="2.5"/>`).join("")}</g>`},
 {id:"cap",n:"19. Electrode Cap",c:"#f472b6",s:`<ellipse cx="50" cy="398" rx="32" ry="36" fill="#fde2d0" stroke="#c08a6a"/><path d="M18 392 Q50 352 82 392" fill="#1e3a8a" opacity=".85"/><g fill="#facc15" stroke="#854d0e" stroke-width=".6">${[[50,366],[36,372],[64,372],[26,384],[74,384],[40,384],[60,384],[50,378],[32,396],[68,396],[50,392]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`).join("")}</g>`},
 {id:"cables",n:"20. Electrode Cables",c:"#a3e635",s:`<g fill="none" stroke-width="1.4">${["#ef4444","#f59e0b","#22c55e","#3b82f6","#a855f7","#ec4899"].map((c,i)=>`<path d="M${30+i*8} 430 Q${20+i*4} 452 ${30+i*8} 470" stroke="${c}"/>`).join("")}</g><path d="M78 496 Q140 470 190 480" fill="none" stroke="#0f172a" stroke-width="3"/>`}
];
const TOTAL=PARTS.length;
let placed={},powered=false,raf=0,guide=true,mode="easy";
const $=id=>document.getElementById(id);
const svg=$("machine"),ghost=$("ghost"),partsG=$("parts"),scr=$("scr"),fx=$("fx"),tray=$("tray");
const BB={};
PARTS.forEach(p=>{
  const g=document.createElementNS(NS,"g");g.id="p_"+p.id;g.innerHTML=p.s;partsG.appendChild(g);
  const b=g.getBBox();BB[p.id]={x:b.x-4,y:b.y-4,w:b.width+8,h:b.height+8};g.style.display="none";
  const gh=document.createElementNS(NS,"g");gh.innerHTML=p.s;
  gh.querySelectorAll("*").forEach(e=>{if(e.tagName!="g"){e.setAttribute("fill","none");e.setAttribute("stroke","#7dd3fc");e.setAttribute("stroke-dasharray","3 3");e.setAttribute("stroke-width","1")}});
  gh.setAttribute("opacity",".35");ghost.appendChild(gh);
});
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1600)}
function shuffled(){return PARTS.filter(p=>!placed[p.id]).sort(()=>Math.random()-.5)}
function buildTray(list){tray.innerHTML="";list.forEach(p=>{const b=BB[p.id];const t=document.createElement("div");t.className="tile";t.dataset.id=p.id;t.style.setProperty("--c",p.c);
  t.innerHTML=`<svg viewBox="${b.x} ${b.y} ${b.w} ${b.h}">${svg.querySelector("defs").outerHTML}${p.s}</svg><span>${p.n}</span>`;tray.appendChild(t);bindDrag(t)})}
function update(){const n=Object.keys(placed).length;$("cnt").textContent=n;document.querySelector("#bar i").style.width=(n/TOTAL*100)+"%";
  ghost.style.display=guide?"":"none";[...ghost.children].forEach((g,i)=>g.style.display=placed[PARTS[i].id]?"none":"");
  const pw=$("pwr");if(n==TOTAL&&!powered)pw.classList.add("ready");
  $("lbl").textContent=n==TOTAL?(powered?"EEG recording in progress…":"Complete! Press Power"):"Drag parts onto the machine"}
function place(id){if(placed[id])return;placed[id]=1;const g=$("p_"+id);g.style.display="";g.animate([{opacity:0,transform:"translateY(-12px)"},{opacity:1,transform:"none"}],{duration:300});update();if(Object.keys(placed).length==TOTAL)toast("✅ All 20 parts placed")}
function toSvg(x,y){const pt=svg.createSVGPoint();pt.x=x;pt.y=y;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function bindDrag(t){t.addEventListener("pointerdown",e=>{
  const sx=e.clientX,sy=e.clientY;let clone=null;
  const mv=ev=>{if(!clone){if(Math.abs(ev.clientY-sy)<8&&Math.abs(ev.clientX-sx)>8){cleanup();return}if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;clone=t.cloneNode(true);clone.classList.add("drag");document.body.appendChild(clone);t.style.opacity=".3"}
    clone.style.left=ev.clientX+"px";clone.style.top=ev.clientY+"px"};
  const up=ev=>{cleanup();if(!clone)return;clone.remove();t.style.opacity="";
    const st=$("stage").getBoundingClientRect();if(ev.clientY>st.bottom||ev.clientY<st.top){return}
    const id=t.dataset.id,b=BB[id],p=toSvg(ev.clientX,ev.clientY),pad=30;
    const ok=mode=="easy"||(p.x>b.x-pad&&p.x<b.x+b.w+pad&&p.y>b.y-pad&&p.y<b.y+b.h+pad);
    if(ok){place(id);t.remove()}else toast("❌ Wrong spot — place it correctly")};
  const cleanup=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};
  addEventListener("pointermove",mv);addEventListener("pointerup",up)})}
/* EEG screen */
const CH=["Fp1","Fp2","F7","F3","Fz","F4","F8","T3","C3","Cz","C4","T4","T5","P3","Pz","P4","T6","O1","O2","A1"];
let traces=[],t0=0;
function buildScreen(){scr.innerHTML=`<rect x="82" y="102" width="236" height="118" fill="#06121d"/><text x="86" y="110" font-size="6" fill="#7dd3fc" font-family="monospace">EEG 20CH · 30mm/s · 7µV/mm</text><text x="300" y="110" font-size="6" fill="#f87171" font-family="monospace">●REC</text>`;
  traces=CH.map((c,i)=>{const y=114+i*5.2;const tx=document.createElementNS(NS,"text");tx.setAttribute("x",84);tx.setAttribute("y",y+1.5);tx.setAttribute("font-size","3.6");tx.setAttribute("fill","#94a3b8");tx.setAttribute("font-family","monospace");tx.textContent=c;scr.appendChild(tx);
    const pl=document.createElementNS(NS,"polyline");pl.setAttribute("fill","none");pl.setAttribute("stroke",i<10?"#4ade80":"#38bdf8");pl.setAttribute("stroke-width",".5");scr.appendChild(pl);return{pl,y,ph:Math.random()*9}});
  fx.innerHTML=`<rect id="flash" x="36" y="62" width="76" height="16" rx="3" fill="#fff"/><circle cx="339" cy="45" r="2" fill="#ef4444"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle><g fill="#4ade80">${Array.from({length:20},(_,i)=>`<circle cx="${100+(i%10)*11}" cy="${412+Math.floor(i/10)*12}" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="${.4+Math.random()}s" repeatCount="indefinite"/></circle>`).join("")}</g>`}
function drawScreen(ts){t0=ts/1000;traces.forEach((tr,i)=>{let pts="";for(let x=0;x<=216;x+=2){const t=t0*0.9+x/70;const v=Math.sin(t*2*Math.PI*1.6+tr.ph)*.9+Math.sin(t*2*Math.PI*4.3+tr.ph*2)*.6+Math.sin(t*20+tr.ph)*.4+(Math.random()-.5)*.6;pts+=`${98+x},${(tr.y+v*1.6).toFixed(2)} `}tr.pl.setAttribute("points",pts)});
  const f=$("flash");if(f)f.setAttribute("opacity",Math.sin(t0*20)>0?".95":".1");raf=requestAnimationFrame(drawScreen)}
$("pwr").onclick=()=>{if(Object.keys(placed).length<TOTAL){toast("Place all 20 parts first");return}
  powered=!powered;const b=$("pwr");b.classList.toggle("on",powered);b.classList.remove("ready");
  if(powered){buildScreen();scr.style.display="";fx.style.display="";raf=requestAnimationFrame(drawScreen);toast("⚡ EEG powered on")}else{cancelAnimationFrame(raf);scr.style.display="none";fx.style.display="none"}update()};
function reset(){placed={};powered=false;cancelAnimationFrame(raf);scr.style.display="none";fx.style.display="none";$("pwr").className="";PARTS.forEach(p=>$("p_"+p.id).style.display="none");buildTray(shuffled());update()}
$("bReset").onclick=reset;
$("bHint").onclick=()=>{const t=tray.querySelector(".tile");if(!t)return;const g=ghost.children[PARTS.findIndex(x=>x.id==t.dataset.id)];ghost.style.display="";g.setAttribute("opacity","1");g.querySelectorAll("*").forEach(e=>e.setAttribute("stroke","#facc15"));
  t.scrollIntoView({behavior:"smooth",inline:"center"});toast("💡 "+PARTS.find(x=>x.id==t.dataset.id).n);setTimeout(()=>{g.setAttribute("opacity",".35");g.querySelectorAll("*").forEach(e=>{if(e.tagName!="g")e.setAttribute("stroke","#7dd3fc")});update()},1500)};
const cc=$("cc");$("bCC").onclick=()=>cc.style.display=cc.style.display=="block"?"none":"block";
cc.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-bg]").forEach(x=>x.classList.toggle("act",x==b));$("stage").classList.toggle("light",b.dataset.bg=="light")});
cc.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("act",x==b));guide=b.dataset.g=="1";update()});
cc.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("act",x==b));mode=b.dataset.m});
$("auto").onclick=()=>{let i=0;const left=PARTS.filter(p=>!placed[p.id]);const iv=setInterval(()=>{if(i>=left.length){clearInterval(iv);return}place(left[i].id);const t=tray.querySelector(`[data-id="${left[i].id}"]`);t&&t.remove();i++},120)};
$("shuf").onclick=()=>buildTray(shuffled());
document.addEventListener("touchmove",e=>{if(!e.target.closest("#tray"))e.preventDefault()},{passive:false});
buildTray(shuffled());update();
</script>
</body>
</html>
