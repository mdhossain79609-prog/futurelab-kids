
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FutureLab Kids - Army Drive</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
 -webkit-touch-callout:none;
}

body{
 margin:0;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#87ceeb;
 touch-action:none;
}

canvas{
 display:block;
}

#title{
 position:absolute;
 top:9px;
 left:0;
 width:100%;
 text-align:center;
 color:white;
 font-size:19px;
 font-weight:bold;
 text-shadow:2px 2px 5px #222;
 pointer-events:none;
}

#status{
 position:absolute;
 top:39px;
 left:10px;
 padding:7px 10px;
 border-radius:10px;
 background:#0009;
 color:white;
 font-size:12px;
}

#controls{
 position:absolute;
 bottom:12px;
 left:0;
 width:100%;
 padding:0 12px;
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:5px;
}

.panel{
 display:flex;
 align-items:center;
 gap:8px;
}

button{
 color:white;
 font-weight:bold;
 border:2px solid #ffffff88;
 touch-action:none;
 user-select:none;
 -webkit-user-select:none;
 -webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;
}

#steering{
 width:108px;
 height:108px;
 border-radius:50%;
 background:radial-gradient(circle,#343434 42%,#111 45%,#777 58%,#222 63%);
 border:8px solid #171717;
 position:relative;
}

#steering:before{
 content:"";
 position:absolute;
 width:72%;
 height:9px;
 background:#aaa;
 top:43%;
 left:14%;
 border-radius:8px;
}

#steering:after{
 content:"";
 position:absolute;
 width:9px;
 height:48%;
 background:#aaa;
 top:10%;
 left:45%;
 border-radius:8px;
}

#steerCenter{
 position:absolute;
 width:25px;
 height:25px;
 border-radius:50%;
 background:#222;
 border:3px solid #aaa;
 left:calc(50% - 12px);
 top:calc(50% - 12px);
 z-index:2;
}

#pedals{
 display:flex;
 gap:7px;
 align-items:end;
}

.pedal{
 width:55px;
 height:85px;
 border-radius:12px 12px 18px 18px;
 background:linear-gradient(90deg,#222,#666,#222);
 box-shadow:0 5px 5px #0007;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 font-size:11px;
}

.pedal:active,.active{
 background:linear-gradient(90deg,#b36b12,#f4a623,#b36b12);
}

#brake{
 height:72px;
}

#rightPanel{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:7px;
}

.controlBtn{
 min-width:57px;
 height:43px;
 border-radius:12px;
 background:linear-gradient(#526a55,#1d3022);
 font-size:12px;
}

#startBtn{
 background:linear-gradient(#1a9b43,#075e24);
}

#gearBtn{
 background:linear-gradient(#315b9c,#132d55);
}

#fire{
 width:65px;
 height:65px;
 border-radius:50%;
 background:radial-gradient(circle,#ff7a36,#bb1717);
 font-size:13px;
 box-shadow:0 3px 10px #0008;
}

@media(max-width:390px){
 #steering{width:88px;height:88px}
 .pedal{width:47px;height:75px;font-size:10px}
 #fire{width:55px;height:55px}
 .controlBtn{min-width:48px;font-size:10px}
}
</style>
</head>

<body>

<div id="title">🌍 FUTURELAB KIDS — ARMY DRIVE</div>
<div id="status">🚙 ENGINE OFF | GEAR P</div>

<div id="controls">

 <div class="panel">
  <div id="steering">
   <div id="steerCenter"></div>
  </div>
 </div>

 <div id="pedals">
  <button class="pedal" id="brake">
   🛑<br>BRAKE
  </button>
  <button class="pedal" id="accelerator">
   ⬆️<br>ACCEL
  </button>
 </div>

 <div id="rightPanel">
  <button class="controlBtn" id="startBtn">🔑 START</button>
  <button class="controlBtn" id="gearBtn">GEAR: P</button>
  <button id="fire">🔥<br>FIRE</button>
 </div>

</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,45,180);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,400
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.insertBefore(renderer.domElement,document.body.firstChild);

scene.add(new THREE.HemisphereLight(0xffffff,0x526b43,2));

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(25,40,20);
sun.castShadow=true;
scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c});
const green=mat(0x426b35);
const brown=mat(0x76502f);
const roadMat=mat(0x34383b);
const yellow=mat(0xffd43b);
const black=mat(0x171a1b);
const army=mat(0x536b36);
const metal=mat(0x92999b);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 mat(0x4f9949)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-1;
scene.add(ground);

// Winding road
const points=[];
for(let i=0;i<=100;i++){
 const t=i/100;
 points.push(new THREE.Vector3(
  Math.sin(t*Math.PI*4)*13,
  Math.sin(t*Math.PI*2)*2,
  35-t*240
 ));
}
const path=new THREE.CatmullRomCurve3(points);
const roadPoints=path.getPoints(700);

const vertices=[],indices=[];
for(let i=0;i<roadPoints.length;i++){
 const p=roadPoints[i];
 const tangent=path.getTangent(i/(roadPoints.length-1));
 const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();

 vertices.push(
  p.x+side.x*6,p.y+.05,p.z+side.z*6,
  p.x-side.x*6,p.y+.05,p.z-side.z*6
 );

 if(i<roadPoints.length-1){
  const a=i*2;
  indices.push(a,a+1,a+2,a+1,a+3,a+2);
 }
}

const roadGeo=new THREE.BufferGeometry();
roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
roadGeo.setIndex(indices);
roadGeo.computeVertexNormals();
scene.add(new THREE.Mesh(roadGeo,roadMat));

// Road edges
for(const sideSign of [-1,1]){
 const pts=roadPoints.map((p,i)=>{
  const t=path.getTangent(i/(roadPoints.length-1));
  const v=new THREE.Vector3(-t.z,0,t.x).normalize();
  return new THREE.Vector3(
   p.x+v.x*sideSign*5.8,p.y+.13,
   p.z+v.z*sideSign*5.8
  );
 });
 scene.add(new THREE.Mesh(
  new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),500,.09,6,false),
  yellow
 ));
}

// Mountains
for(let i=0;i<55;i++){
 const side=i%2===0?-1:1;
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(7+Math.random()*9,15+Math.random()*24,5),
  mat(i%3===0?0x777c75:0x58754b)
 );
 mountain.position.set(
  side*(23+Math.random()*30),
  5+Math.random()*8,
  25-Math.random()*240
 );
 scene.add(mountain);
}

// Trees
function makeTree(x,z,s=1){
 const tree=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25*s,.4*s,2*s,8),brown
 );
 trunk.position.y=s;
 tree.add(trunk);

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(1.5*s,2.5*s,8),green
  );
  leaves.position.y=(2+i*.65)*s;
  tree.add(leaves);
 }
 tree.position.set(x,0,z);
 scene.add(tree);
}
for(let i=0;i<130;i++){
 const z=20-Math.random()*245;
 const side=Math.random()<.5?-1:1;
 makeTree(side*(10+Math.random()*17),z,.7+Math.random()*.8);
}

// Houses
function makeHouse(x,z){
 const h=new THREE.Group();
 const base=new THREE.Mesh(
  new THREE.BoxGeometry(4,3.2,4),
  mat(0xe9d5b0)
 );
 base.position.y=1.6;
 h.add(base);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(3.2,2.2,4),
  mat(0x9d4434)
 );
 roof.position.y=4.2;
 roof.rotation.y=Math.PI/4;
 h.add(roof);

 h.position.set(x,0,z);
 scene.add(h);
}
for(let i=0;i<12;i++){
 makeHouse((i%2===0?-1:1)*(17+Math.random()*7),-15-i*17);
}

// Jeep
const jeep=new THREE.Group();
const frontAxle=new THREE.Group();
frontAxle.position.z=-1.25;
jeep.add(frontAxle);

function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

box(jeep,3.3,.8,5,army,0,1.15,0);  
box(frontAxle,2.8,.55,1.8,army,0,1.75,-.25);
 box(frontAxle,1.6,.65,.12,black,0,1.35,-1.32);

for(const x of [-1.1,1.1]){
 const lamp=new THREE.Mesh(
  new THREE.SphereGeometry(.22,12,12),
  mat(0xfff1a0)
 );
 lamp.position.set(x,1.45,-1.37); 
 frontAxle.add(lamp);
}


// Wheel assemblies
function makeWheel(x,z,front){
 const pivot=new THREE.Group();
 pivot.position.set(x,.75,z);

 const wheel=new THREE.Mesh(
  new THREE.CylinderGeometry(.65,.65,.42,20),
  black
 );
 wheel.rotation.z=Math.PI/2;
 pivot.add(wheel);

 const hub=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.25,.44,12),
  metal
 );
 hub.rotation.z=Math.PI/2;
 pivot.add(hub);

 if(front){
  frontAxle.add(pivot);
 }else{
  jeep.add(pivot);
 }
}

// Front and rear wheels
for(const x of [-1.7,1.7]){
 makeWheel(x,-.45,true);
 makeWheel(x,1.7,false);
}


// Soldier
const soldier=new THREE.Group();
const uniform=mat(0x4d6035);
const skin=mat(0xd49b70);

box(soldier,.85,1.15,.45,uniform,0,2.35,0);
box(soldier,.34,.85,.4,uniform,-.25,1.35,0);
box(soldier,.34,.85,.4,uniform,.25,1.35,0);
box(soldier,.25,.9,.28,uniform,-.62,2.45,-.05);
box(soldier,.25,.9,.28,uniform,.62,2.45,-.05);

const head=new THREE.Group();
const face=new THREE.Mesh(
 new THREE.SphereGeometry(.38,20,20),skin
);
face.position.y=3.3;
head.add(face);

const helmet=new THREE.Mesh(
 new THREE.SphereGeometry(.42,20,12,0,Math.PI*2,0,Math.PI/2),
 green
);
helmet.position.y=3.52;
head.add(helmet);
soldier.add(head);

const gun=new THREE.Group();
box(gun,.18,.18,1.35,black,0,0,0);
const barrel=new THREE.Mesh(
 new THREE.CylinderGeometry(.055,.055,.8,10),metal
);
barrel.rotation.x=Math.PI/2;
barrel.position.z=-.95;
gun.add(barrel);
gun.position.set(0,2.85,-.55);
soldier.add(gun);

jeep.add(soldier);
soldier.position.set(0,0,-.25);

jeep.position.set(0,0,25);
scene.add(jeep);

// Game controls
let engineOn=false;
let gearIndex=0;
const gears=['P','R','N','D'];
let speed=0;
let progress=0;
let steering=0;
let acceleratorPressed=false;
let brakePressed=false;

const status=document.getElementById('status');
const startBtn=document.getElementById('startBtn');
const gearBtn=document.getElementById('gearBtn');
const steeringWheel=document.getElementById('steering');

function updateStatus(){
 status.textContent=
 '🚙 '+(engineOn?'ENGINE ON':'ENGINE OFF')+
 ' | GEAR '+gears[gearIndex]+
 ' | SPEED '+Math.round(speed*500);
}

startBtn.addEventListener('click',()=>{
 engineOn=!engineOn;
 startBtn.textContent=engineOn?'⏻ STOP':'🔑 START';
 if(!engineOn)speed=0;
 updateStatus();
});

gearBtn.addEventListener('click',()=>{
 gearIndex=(gearIndex+1)%gears.length;
 gearBtn.textContent='GEAR: '+gears[gearIndex];
 if(gears[gearIndex]!=='D'&&gears[gearIndex]!=='R'){
  speed=0;
 }
 updateStatus();
});

// Accelerator and brake
function pedal(id,which){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  if(which==='accelerator')acceleratorPressed=true;
  else brakePressed=true;
  el.classList.add('active');
 });
 function release(){
  acceleratorPressed=false;
  brakePressed=false;
  el.classList.remove('active');
 }
 el.addEventListener('pointerup',release);
 el.addEventListener('pointercancel',release);
 el.addEventListener('lostpointercapture',release);
}
pedal('accelerator','accelerator');
pedal('brake','brake');

// Rotating steering wheel
let steeringPointer=null;
let previousAngle=0;
let wheelRotation=0;

steeringWheel.addEventListener('pointerdown',e=>{
 e.preventDefault();
 steeringPointer=e.pointerId;
 steeringWheel.setPointerCapture(e.pointerId);
 const r=steeringWheel.getBoundingClientRect();
 previousAngle=Math.atan2(
  e.clientY-(r.top+r.height/2),
  e.clientX-(r.left+r.width/2)
 );
});

steeringWheel.addEventListener('pointermove',e=>{
 if(steeringPointer!==e.pointerId)return;
 const r=steeringWheel.getBoundingClientRect();
 const angle=Math.atan2(
  e.clientY-(r.top+r.height/2),
  e.clientX-(r.left+r.width/2)
 );
 let diff=angle-previousAngle;
 if(diff>Math.PI)diff-=Math.PI*2;
 if(diff< -Math.PI)diff+=Math.PI*2;
 wheelRotation+=diff;
 previousAngle=angle;
 steering=Math.max(-.65,Math.min(.65,wheelRotation*.65));
 steeringWheel.style.transform='rotate('+wheelRotation*180/Math.PI+'deg)';
});

function releaseSteering(){
 steeringPointer=null;
}
steeringWheel.addEventListener('pointerup',releaseSteering);
steeringWheel.addEventListener('pointercancel',releaseSteering);

// Fire sound
let audioContext=null;
function playFireSound(){
 try{
  if(!audioContext){
   audioContext=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioContext.state==='suspended')audioContext.resume();

  const duration=.20;
  const length=Math.floor(audioContext.sampleRate*duration);
  const buffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
   const fade=1-i/length;
   data[i]=(Math.random()*2-1)*fade;
  }

  const noise=audioContext.createBufferSource();
  noise.buffer=buffer;

  const gain=audioContext.createGain();
  gain.gain.setValueAtTime(.75,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.01,audioContext.currentTime+duration);

  const filter=audioContext.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.value=1600;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);
  noise.start();
  noise.stop(audioContext.currentTime+duration);

  const osc=audioContext.createOscillator();
  const boom=audioContext.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(130,audioContext.currentTime);
  osc.frequency.exponentialRampToValueAtTime(45,audioContext.currentTime+.16);
  boom.gain.setValueAtTime(.5,audioContext.currentTime);
  boom.gain.exponentialRampToValueAtTime(.01,audioContext.currentTime+.17);
  osc.connect(boom);
  boom.connect(audioContext.destination);
  osc.start();
  osc.stop(audioContext.currentTime+.18);
 }catch(e){
  console.log('Audio unavailable');
 }
}

// Fictional game firing effect
const bullets=[];
const fireButton=document.getElementById('fire');

function fire(){
 playFireSound();

 const b=new THREE.Mesh(
  new THREE.SphereGeometry(.12,8,8),
  mat(0xffe15a)
 );
 const direction=new THREE.Vector3(0,0,-1);
 direction.applyQuaternion(jeep.quaternion);
 b.position.copy(jeep.position).add(new THREE.Vector3(0,3,0));
 b.userData.velocity=direction.multiplyScalar(1.7);
 scene.add(b);
 bullets.push(b);

 const flash=new THREE.PointLight(0xffaa33,8,7);
 flash.position.copy(b.position);
 scene.add(flash);
 setTimeout(()=>scene.remove(flash),100);
}

fireButton.addEventListener('pointerdown',e=>{
 e.preventDefault();
 fire();
});

// Animation
function animate(){
 requestAnimationFrame(animate);

 if(engineOn){
  if(gears[gearIndex]==='D'){
   speed=Math.min(speed+.0015,.20);
  }else if(gears[gearIndex]==='R'){
   speed=Math.min(speed+.001,.08);
  }else{
   speed=0;
  }

  if(acceleratorPressed&&gears[gearIndex]==='D'){
   speed=Math.min(speed+.002,.25);
  }
  if(brakePressed){
   speed=Math.max(speed-.009,0);
  }
 }else{
  speed=Math.max(speed-.006,0);
 }

 const direction=gears[gearIndex]==='R'?-1:1;
 if(gears[gearIndex]==='D'||gears[gearIndex]==='R'){
  progress+=speed*.0018*direction;
 }
 if(progress>.94)progress=0;
 if(progress<0)progress=.94;

 const p=path.getPointAt(progress);
 const tangent=path.getTangent(progress);
 const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();

 const lateral=steering*2.8;

 jeep.position.set(
  p.x+side.x*lateral,
  p.y,
  p.z+side.z*lateral
 );

 // Body follows road, not steering wheel
 jeep.rotation.y=Math.atan2(-tangent.x,-tangent.z);

 // Front wheels turn with steering
 frontAxle.rotation.y=-steering*.45;

 // Soldier head animation
 head.rotation.y=Math.sin(Date.now()*.001)*.3;
 head.rotation.x=Math.sin(Date.now()*.0015)*.08;

 // Camera follow
 const behind=new THREE.Vector3(0,5,10);
 behind.applyQuaternion(jeep.quaternion);
 camera.position.lerp(
  jeep.position.clone().add(behind),.07
 );
 camera.lookAt(jeep.position.x,2.2,jeep.position.z-2);

 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];
  b.position.add(b.userData.velocity);
  if(b.position.distanceTo(jeep.position)>75){
   scene.remove(b);
   bullets.splice(i,1);
  }
 }

 updateStatus();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
