<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Build and drive a 3x wide mega bus using 20 colorful parts.">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🚌 Build & Drive Mega Bus</title>
<style>
:root{--ink:#0f172a;--paper:#fff;--muted:#f1f5f9;--soft:#64748b;--control:#475569;--active:#0284c7;--shadow:#0003}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
main{display:flex;flex-direction:column;height:100dvh;height:100vh}
@supports(height:100dvh){main{height:100dvh}}
header{display:flex;align-items:center;gap:8px;padding:6px 12px 4px;flex-shrink:0}
h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(1.05rem,4vw,1.6rem);font-weight:800;
background:linear-gradient(90deg,#0284c7,#8b5cf6,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;border:0}
#count{background:var(--muted);color:var(--ink)}
#reset{background:#1e293b;color:#fff;cursor:pointer;transition:background 0.2s}
#reset:hover{background:#334155}

/* Bus Assembly Board */
#boardWrap{flex:0 0 34%;min-height:140px;max-height:260px;padding:0 8px 4px;position:relative}
#board{position:absolute;inset:0 8px 4px;border:2px dashed #93c5fd;border-radius:12px;overflow:hidden;
background:linear-gradient(180deg,#cfe8fb,#f3f9fd);transition:background .5s}
#board.night{background:linear-gradient(180deg,#0b1026,#1e2a55)}
#board svg{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--soft);text-align:center;padding:12px;font-size:13px}

/* Parts Tray: Scaled up to cover the space seamlessly */
#tray{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(2,1fr);gap:6px;padding:6px 8px;background:#f8fafc;box-shadow:0 -4px 12px #0001;border-radius:14px 14px 0 0;flex:1;min-height:0;align-content:stretch}
@media(max-width:720px){
  #tray{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:4px;padding:4px 6px}
}
.slot{height:100%;min-height:clamp(46px,7.5vh,72px);border-radius:8px;background:#fff;border:1px solid #e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:transform .15s,box-shadow .15s}
.slot:hover{transform:translateY(-1px);box-shadow:0 3px 6px #0002}
.slot svg{width:94%;height:72%;filter:drop-shadow(0 2px 2px #0004);cursor:grab}
.slot span{font-size:clamp(9px,1.8vw,10.5px);font-weight:700;color:var(--soft);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis;padding:0 2px}
.slot.gone>*{visibility:hidden}

/* Cockpit & Controls Console */
#controls{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px 8px;background:#fff;border-top:2px solid #e2e8f0;box-shadow:0 -4px 12px #0001;z-index:20;max-width:100vw;overflow:hidden}

/* Left Section: Gear on Top + Function Buttons Below */
.ctrl-left{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.gear-box{display:flex;align-items:center;gap:6px;background:#1e293b;padding:3px 8px;border-radius:6px;width:fit-content}
.gear-tag{font-size:9px;color:#94a3b8;font-weight:800;letter-spacing:0.5px}
.gear-row{display:flex;gap:3px}
.gbtn{padding:3px 8px;font-size:10px;font-weight:800;border-radius:4px;border:0;background:#334155;color:#e2e8f0;cursor:pointer;transition:all 0.15s}
.gbtn.active{background:#0284c7;color:#fff;box-shadow:0 0 6px #38bdf8}
.gbtn[data-g="R"].active{background:#ef4444;box-shadow:0 0 6px #f87171}

.btns{display:flex;gap:5px}
.cbtn{width:clamp(38px,8.2vw,48px);height:clamp(36px,7.8vw,46px);border-radius:8px;border:0;color:#fff;font-weight:800;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 2px 0 var(--shadow);line-height:1.1;cursor:pointer}
.cbtn b{font-size:16px}
.cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
#bColor{background:linear-gradient(135deg,#f43f5e,#f59e0b,#22c55e,#3b82f6)}
#bLight{background:linear-gradient(135deg,#facc15,#f97316)}
#bSound{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
#bStart{background:linear-gradient(135deg,#22c55e,#15803d)}
#bStart.on{background:linear-gradient(135deg,#ef4444,#991b1b)}

/* Right Cockpit Section: Steering Wheel + Pedals */
.drive-cockpit{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Round Steering Wheel with Center Horn */
.wheel-wrap{display:flex;flex-direction:column;align-items:center;cursor:grab}
.mini-wheel{width:clamp(46px,9.5vw,56px);height:clamp(46px,9.5vw,56px);border-radius:50%;border:6px solid #1e293b;border-top-color:#0284c7;background:#0f172a;position:relative;box-shadow:0 2px 6px #0004;transition:transform 0.05s ease-out}
.mini-wheel::before{content:'';position:absolute;top:50%;left:0;width:100%;height:3px;background:#475569;transform:translateY(-50%)}
.mini-wheel::after{content:'';position:absolute;top:50%;left:50%;width:3px;height:50%;background:#475569;transform:translateX(-50%)}
.mini-horn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#0284c7;color:#fff;font-size:9px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.ctrl-label{font-size:9px;font-weight:800;color:#64748b;margin-top:2px}

/* Brake & Gas Pedals */
.pedals-wrap{display:flex;gap:5px;align-items:flex-end}
.pedal-box{display:flex;flex-direction:column;align-items:center;gap:1px}
.pedal{height:clamp(38px,8vw,48px);background:linear-gradient(180deg,#475569,#1e293b);border:2px solid #64748b;border-radius:5px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:3px 0;cursor:pointer;box-shadow:0 2px 5px #0004;transform-origin:bottom;transition:transform 0.08s ease}
.pedal.pressed{transform:scaleY(0.85) translateY(3px);border-color:#38bdf8}
.p-rib{width:80%;height:2.5px;background:#0f172a;border-radius:2px}
.pedal.brake{width:clamp(28px,6.5vw,36px);background:linear-gradient(180deg,#7f1d1d,#450a0a);border-color:#b91c1c}
.pedal.gas{width:clamp(24px,5.5vw,30px)}
.pedal-text{font-size:9px;font-weight:800;color:#334155}

#drag{position:fixed;pointer-events:none;z-index:50;filter:drop-shadow(0 6px 6px #0005)}
#msg{position:fixed;left:50%;top:50px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes blink2{0%,49%{opacity:.15}50%,100%{opacity:1}}
.bl1{animation:blink .8s infinite}.bl2{animation:blink2 .8s infinite}
</style>
</head>
<body>
<main>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<header>
  <h1>🚌 Build Mega Bus</h1>
  <span id="count" class="pill">0 / 20</span>
  <button id="reset" class="pill">Reset</button>
</header>
<div id="boardWrap"><div id="board">
  <svg id="scene" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="beam" cx="0" cy="0.5" r="1"><stop offset="0" stop-color="#fff7b0" stop-opacity=".95"/><stop offset="1" stop-color="#fff7b0" stop-opacity="0"/></radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g id="mover"><g id="facer"><g id="tilter"><g id="bus"></g><g id="lights"></g></g></g></g>
  </svg>
  <div id="hint">Drag and drop all 20 parts below to build the Mega Bus</div>
</div></div>
<section id="tray"></section>
<div id="controls">
  <!-- Left Side: Gear on Top, 4 Action Buttons Below -->
  <div class="ctrl-left">
    <!-- Gear Box (R Reverse, D Forward) -->
    <div class="gear-box">
      <span class="gear-tag">GEAR</span>
      <div class="gear-row">
        <button class="gbtn" data-g="R">R Rev</button>
        <button class="gbtn active" data-g="D">D Drive</button>
      </div>
    </div>
    <!-- 4 Action Buttons -->
    <div class="btns">
      <button class="cbtn" id="bColor"><b>🎨</b>Color</button>
      <button class="cbtn" id="bLight"><b>💡</b>Lights</button>
      <button class="cbtn" id="bSound"><b>🔊</b>Sound</button>
      <button class="cbtn" id="bStart"><b>▶</b>Start</button>
    </div>
  </div>

  <!-- Right Side Cockpit: Round Steering Wheel & Brake/Gas Pedals -->
  <div class="drive-cockpit">
    <!-- Round Steering Wheel -->
    <div class="wheel-wrap" id="wheelBox">
      <div class="mini-wheel" id="wheelEl">
        <div class="mini-horn" id="hornBtn">📢</div>
      </div>
      <span class="ctrl-label">Steering</span>
    </div>
    <!-- Two Pedals: Brake & Gas -->
    <div class="pedals-wrap">
      <div class="pedal-box">
        <div class="pedal brake" id="pBrake">
          <div class="p-rib"></div>
          <div class="p-rib"></div>
        </div>
        <span class="pedal-text">Brake</span>
      </div>
      <div class="pedal-box">
        <div class="pedal gas" id="pGas">
          <div class="p-rib"></div>
          <div class="p-rib"></div>
          <div class="p-rib"></div>
        </div>
        <span class="pedal-text">Gas</span>
      </div>
    </div>
  </div>
</div>
</main>
<div id="msg"></div>
<script>
// ---------- 3x Wide Mega Bus 20 Parts Configuration ----------
const BUS_RULES={parts:20,minSpeed:60,maxSpeed:260,speedStep:40};
function adjustedSpeed(current,change){return Math.max(BUS_RULES.minSpeed,Math.min(BUS_RULES.maxSpeed,current+change));}
const VB={x:20,y:10,w:1100,h:310};
const S='stroke="#1e293b" stroke-width="2.5"';
const g=c=>`url(#g-${c})`;
const sh=(x,y,w,h)=>`<rect x="${x+w*.05}" y="${y+h*.05}" width="${w*.9}" height="${Math.max(4,h*.08)}" rx="4" fill="#fff" opacity=".4"/>`;
const wheel=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${g('dark')}" ${S}/><circle cx="${x}" cy="${y}" r="${r-9}" fill="${g('silver')}" stroke="#475569" stroke-width="2"/><g class="wheel" data-c="${x},${y}"><path d="M${x-r+7},${y} H${x+r-7} M${x},${y-r+7} V${y+r-7}" stroke="#1e293b" stroke-width="4"/></g><circle cx="${x}" cy="${y}" r="7" fill="${g('gold')}"/>`;
const PARTS=[
  // 1. Mega Bus Main Chassis Body
  {id:1,n:"Mega Chassis",b:[140,42,820,192],a:`<rect x="145" y="45" width="810" height="184" rx="20" fill="${g('blue')}" ${S}/>${sh(145,45,810,184)}<rect x="145" y="195" width="810" height="34" rx="4" fill="${g('dark')}" opacity=".35"/>`},
  // 2. Front Double Height Windshield
  {id:2,n:"Windshield",b:[138,48,98,124],a:`<path d="M232 48 L155 58 Q144 68 144 95 L144 168 L232 168 Z" fill="${g('cyan')}" ${S}/><path d="M160 70 L212 128" stroke="#fff" stroke-width="8" opacity=".65"/><line x1="144" y1="108" x2="232" y2="108" stroke="#1e293b" stroke-width="2.5"/>`},
  // 3. High Roof & Frame
  {id:3,n:"Roof & Frame",b:[140,26,820,24],a:`<rect x="144" y="28" width="812" height="20" rx="9" fill="${g('indigo')}" ${S}/>${sh(144,28,812,20)}`},
  // 4. Mega Roof AC Unit
  {id:4,n:"Roof AC",b:[360,8,340,24],a:`<rect x="370" y="10" width="320" height="20" rx="6" fill="${g('silver')}" ${S}/><rect x="390" y="14" width="75" height="12" rx="3" fill="${g('dark')}"/><rect x="490" y="14" width="75" height="12" rx="3" fill="${g('dark')}"/><rect x="590" y="14" width="75" height="12" rx="3" fill="${g('dark')}"/>`},
  // 5. Heavy Front Grille & Bumper
  {id:5,n:"Grille & Bumper",b:[122,178,78,54],a:`<rect x="125" y="180" width="72" height="48" rx="10" fill="${g('silver')}" ${S}/><line x1="134" y1="192" x2="190" y2="192" stroke="#1e293b" stroke-width="3.5"/><line x1="134" y1="204" x2="190" y2="204" stroke="#1e293b" stroke-width="3.5"/><line x1="134" y1="216" x2="190" y2="216" stroke="#1e293b" stroke-width="3.5"/><circle cx="161" cy="204" r="8" fill="${g('gold')}"/>`},
  // 6. Dual Projector Headlights
  {id:6,n:"Dual Headlights",b:[126,134,30,42],a:`<rect x="128" y="136" width="26" height="38" rx="7" fill="${g('gold')}" ${S}/>${sh(128,136,26,38)}<circle cx="141" cy="146" r="6" fill="#fff"/><circle cx="141" cy="164" r="6" fill="#fff"/>`},
  // 7. Driver Cabin Door
  {id:7,n:"Driver Door",b:[232,48,64,180],a:`<rect x="235" y="50" width="58" height="176" rx="6" fill="${g('orange')}" ${S}/><rect x="241" y="56" width="46" height="52" rx="4" fill="${g('cyan')}" ${S}/><rect x="241" y="114" width="46" height="42" rx="4" fill="${g('cyan')}" ${S}/><rect x="284" y="165" width="5" height="16" rx="2" fill="${g('gold')}"/>`},
  // 8. Passenger Double Folding Door
  {id:8,n:"Passenger Door",b:[520,48,70,180],a:`<rect x="524" y="50" width="62" height="176" rx="6" fill="${g('teal')}" ${S}/><rect x="529" y="56" width="23" height="95" rx="4" fill="${g('cyan')}" ${S}/><rect x="557" y="56" width="23" height="95" rx="4" fill="${g('cyan')}" ${S}/><line x1="555" y1="50" x2="555" y2="226" stroke="#1e293b" stroke-width="2.5"/>`},
  // 9. Upper Deck Window 1
  {id:9,n:"Upper Window 1",b:[294,52,112,54],a:`<rect x="298" y="54" width="104" height="50" rx="6" fill="${g('blue')}" ${S}/><line x1="350" y1="54" x2="350" y2="104" stroke="#1e293b" stroke-width="2"/><path d="M304 92 L332 62 M356 92 L384 62" stroke="#fff" stroke-width="5" opacity=".55"/>`},
  // 10. Upper Deck Window 2
  {id:10,n:"Upper Window 2",b:[404,52,116,54],a:`<rect x="408" y="54" width="108" height="50" rx="6" fill="${g('blue')}" ${S}/><line x1="462" y1="54" x2="462" y2="104" stroke="#1e293b" stroke-width="2"/><path d="M414 92 L442 62 M468 92 L496 62" stroke="#fff" stroke-width="5" opacity=".55"/>`},
  // 11. Upper Deck Window 3
  {id:11,n:"Upper Window 3",b:[588,52,134,54],a:`<rect x="592" y="54" width="126" height="50" rx="6" fill="${g('blue')}" ${S}/><line x1="655" y1="54" x2="655" y2="104" stroke="#1e293b" stroke-width="2"/><path d="M598 92 L626 62 M662 92 L690 62" stroke="#fff" stroke-width="5" opacity=".55"/>`},
  // 12. Upper Deck Window 4
  {id:12,n:"Upper Window 4",b:[724,52,134,54],a:`<rect x="728" y="54" width="126" height="50" rx="6" fill="${g('blue')}" ${S}/><line x1="791" y1="54" x2="791" y2="104" stroke="#1e293b" stroke-width="2"/><path d="M734 92 L762 62 M798 92 L826 62" stroke="#fff" stroke-width="5" opacity=".55"/>`},
  // 13. Lower Deck Window 1
  {id:13,n:"Lower Window 1",b:[294,114,228,54],a:`<rect x="298" y="116" width="218" height="48" rx="6" fill="${g('cyan')}" ${S}/><line x1="407" y1="116" x2="407" y2="164" stroke="#1e293b" stroke-width="2"/><path d="M306 152 L340 124 M415 152 L450 124" stroke="#fff" stroke-width="5" opacity=".55"/>`},
  // 14. Lower Deck Window 2
  {id:14,n:"Lower Window 2",b:[588,114,270,54],a:`<rect x="592" y="116" width="262" height="48" rx="6" fill="${g('cyan')}" ${S}/><line x1="723" y1="116" x2="723" y2="164" stroke="#1e293b" stroke-width="2"/><path d="M600 152 L635 124 M731 152 L766 124" stroke="#fff" stroke-width="5" opacity=".55"/>`},
  // 15. Rear Aerodynamic Windshield
  {id:15,n:"Rear Glass",b:[858,48,102,128],a:`<path d="M862 50 H940 Q954 62 954 98 L954 172 H862 Z" fill="${g('cyan')}" ${S}/><path d="M876 70 L934 135" stroke="#fff" stroke-width="7" opacity=".55"/>`},
  // 16. Digital Route Display
  {id:16,n:"Route Display",b:[170,30,150,22],a:`<rect x="175" y="32" width="140" height="18" rx="4" fill="${g('dark')}" ${S}/><text x="245" y="45" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle" font-family="sans-serif">MEGA EXPRESS</text>`},
  // 17. Aerodynamic Side Mirrors
  {id:17,n:"Side Mirrors",b:[112,68,34,75],a:`<path d="M142 75 L118 72 L116 138 L142 110" fill="${g('silver')}" ${S}/><ellipse cx="118" cy="105" rx="5" ry="24" fill="${g('cyan')}"/>`},
  // 18. Speed Racing Stripes
  {id:18,n:"Speed Stripes",b:[148,168,794,22],a:`<path d="M152 176 Q400 166 600 178 T945 174" stroke="${g('yellow')}" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M160 184 Q400 174 600 186 T940 182" stroke="${g('red')}" stroke-width="5" stroke-linecap="round" fill="none"/>`},
  // 19. Front Heavy Duty Wheel
  {id:19,n:"Front Wheel",b:[222,210,76,76],a:wheel(260,248,34)},
  // 20. Dual Rear Heavy Wheels & Exhaust
  {id:20,n:"Dual Rear Wheels",b:[702,210,186,76],a:wheel(740,248,34)+wheel(835,248,34)+`<rect x="948" y="160" width="16" height="18" rx="3" fill="${g('red')}" ${S}/><circle cx="952" cy="215" r="6" fill="${g('dark')}" ${S}/>`}
];
const BASE={red:"#ef4444",blue:"#3b82f6",cyan:"#22d3ee",orange:"#f97316",yellow:"#facc15",green:"#22c55e",steel:"#64748b",purple:"#a855f7",pink:"#ec4899",gold:"#f59e0b",teal:"#14b8a6",lime:"#84cc16",indigo:"#6366f1",dark:"#334155",silver:"#94a3b8",coral:"#fb7185"};
const THEMES=[
 {name:"Rainbow Volvo",map:{}},
 {name:"Double Decker Red",map:{blue:"#dc2626",indigo:"#991b1b",orange:"#f8fafc",yellow:"#facc15",teal:"#b91c1c"}},
 {name:"Green Express",map:{blue:"#15803d",indigo:"#14532d",orange:"#22c55e",yellow:"#84cc16",teal:"#166534"}},
 {name:"Royal Blue VIP",map:{blue:"#1d4ed8",indigo:"#1e3a8a",orange:"#38bdf8",yellow:"#facc15",teal:"#2563eb"}},
 {name:"School Bus Yellow",map:{blue:"#f59e0b",indigo:"#b45309",orange:"#1e293b",yellow:"#1e293b",teal:"#d97706"}},
 {name:"Silver Premium",map:{blue:"#64748b",indigo:"#334155",orange:"#94a3b8",yellow:"#38bdf8",teal:"#475569"}},
];
const defs=document.getElementById('defs');
function paint(t){
  const m={...BASE,...THEMES[t].map};
  defs.innerHTML=Object.entries(m).map(([k,c])=>`<linearGradient id="g-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#ffffff',.55)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,'#000000',.35)}"/></linearGradient>`).join('');
}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
paint(0);
const TRAY=[19,3,1,16,8,12,5,20,10,4,17,11,6,14,2,9,18,7,13,15];
const $=id=>document.getElementById(id);
const scene=$('scene'),plane=$('bus'),board=$('board'),tray=$('tray');
scene.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
let placed=new Set(),drag=null,dragEl=null;
function fit(){const r=board.getBoundingClientRect();const s=Math.min(r.width/VB.w,r.height/VB.h);return{r,s,ox:(r.width-VB.w*s)/2,oy:(r.height-VB.h*s)/2}}
function buildTray(){
  tray.innerHTML='';
  TRAY.forEach(id=>{const p=PARTS.find(q=>q.id===id);const d=document.createElement('div');d.className='slot'+(placed.has(id)?' gone':'');d.dataset.id=id;
    d.innerHTML=`<svg viewBox="${p.b.join(' ')}">${p.a}</svg><span>${p.n}</span>`;
    d.querySelector('svg').addEventListener('pointerdown',e=>startDrag(e,id));tray.appendChild(d);});
}
function renderBus(){
  let h='';PARTS.forEach(p=>{if(placed.has(p.id))h+=p.a;});
  plane.innerHTML=h;
  $('count').textContent=placed.size+' / 20';
  $('hint').style.display=placed.size?'none':'flex';
  updateLights();
}
function startDrag(e,id){
  if(drag||placed.has(id))return; e.preventDefault();const p=PARTS.find(q=>q.id===id);const {s}=fit();
  drag={id,s,x:e.clientX,y:e.clientY};dragEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  dragEl.id='drag';dragEl.setAttribute('viewBox',p.b.join(' '));dragEl.setAttribute('width',p.b[2]*s);dragEl.setAttribute('height',p.b[3]*s);
  dragEl.innerHTML=p.a;document.body.appendChild(dragEl);
  tray.querySelector(`[data-id="${id}"]`).classList.add('gone');moveDrag(e);
}
function moveDrag(e){if(!drag)return;const p=PARTS.find(q=>q.id===drag.id);dragEl.style.left=(e.clientX-p.b[2]*drag.s/2)+'px';dragEl.style.top=(e.clientY-p.b[3]*drag.s/2)+'px';drag.x=e.clientX;drag.y=e.clientY}
window.addEventListener('pointermove',e=>{if(drag){e.preventDefault();moveDrag(e)}},{passive:false});
function endDrag(){
  if(!drag)return;const {r}=fit();
  if(drag.x>=r.left&&drag.x<=r.right&&drag.y>=r.top&&drag.y<=r.bottom){placed.add(drag.id);renderBus()}
  else tray.querySelector(`[data-id="${drag.id}"]`).classList.remove('gone');
  dragEl.remove();dragEl=null;drag=null;
}
window.addEventListener('pointerup',e=>{if(drag)moveDrag(e);endDrag()});window.addEventListener('pointercancel',cancelDrag);
function cancelDrag(){if(!drag)return;dragEl.remove();dragEl=null;drag=null;buildTray()}

// ---------- Function Buttons (Color, Light, Sound, Start) ----------
const msg=t=>{const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.opacity=0,1200)};
let theme=0;
$('bColor').onclick=()=>{theme=(theme+1)%THEMES.length;cancelDrag();paint(theme);buildTray();msg('🎨 '+THEMES[theme].name)};
const LIGHTS=["Lights Off","Hazard Flashers","Headlights Beam","Neon Glow","Night Mode"];
let light=0;
$('bLight').onclick=()=>{light=(light+1)%LIGHTS.length;updateLights();msg('💡 '+LIGHTS[light])};
function updateLights(){
 const L=$('lights');board.classList.toggle('night',light===4);
 plane.style.filter=light===3?'drop-shadow(0 0 10px #22d3ee)':'';
 let h='';
 if(light===1||light===4)h='<circle class="bl1" cx="141" cy="155" r="10" fill="#fff7b0"/><circle class="bl2" cx="956" cy="168" r="8" fill="#ef4444"/>';
 if(light===2||light===4)h+='<polygon points="140,155 -50,90 -50,250" fill="url(#beam)"/>';
 L.innerHTML=placed.has(6)?h:'';
}

// ---------- Cockpit Controls: Gear, Round Steering & Pedals ----------
let started=false,gear='D',isGas=false,isBrake=false;
let steerAngle=0,speed=0,wheelAngle=0,face=-1;
const pos={x:0,y:0};
$('bStart').onclick=()=>{
 if(placed.size<BUS_RULES.parts){msg('Assemble all 20 parts first!');return}
 started=!started;ensureAudio();$('bStart').classList.toggle('on',started);
 $('bStart').innerHTML=started?'<b>■</b>Stop':'<b>▶</b>Start';
 if(!started){speed=0;isGas=false;isBrake=false;}
 updSound();msg(started?'Bus Started':'Bus Stopped');
};

// Gear selection (D = Forward, R = Reverse)
document.querySelectorAll('.gbtn').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.gbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  gear=btn.dataset.g;
  face = gear === 'D' ? -1 : 1;
  msg(gear==='D'?'Gear: D (Drive)':'Gear: R (Reverse)');
 };
});

// Pedals system (Gas & Brake)
const pGas=$('pGas'),pBrake=$('pBrake');
function setGas(s){if(!started&&s){msg('Press Start first!');return}isGas=s;pGas.classList.toggle('pressed',s);}
function setBrake(s){isBrake=s;pBrake.classList.toggle('pressed',s);}
pGas.addEventListener('pointerdown',e=>{e.preventDefault();setGas(true)});
pBrake.addEventListener('pointerdown',e=>{e.preventDefault();setBrake(true)});
window.addEventListener('pointerup',()=>{setGas(false);setBrake(false)});

// Round Steering Wheel dragging & turning
const wheelBox=$('wheelBox'),wheelEl=$('wheelEl');
let isWheelDrag=false,startWX=0;
wheelBox.addEventListener('pointerdown',e=>{isWheelDrag=true;startWX=e.clientX;wheelBox.setPointerCapture(e.pointerId)});
window.addEventListener('pointermove',e=>{
 if(!isWheelDrag)return;
 const dx=e.clientX-startWX;
 steerAngle=Math.max(-65,Math.min(65,steerAngle+dx*0.5));
 startWX=e.clientX;
 wheelEl.style.transform=`rotate(${steerAngle*1.6}deg)`;
});
window.addEventListener('pointerup',()=>{isWheelDrag=false});

// Horn button in center of steering
$('hornBtn').onclick=(e)=>{e.stopPropagation();ensureAudio();horn()};

// Keyboard controls (W/Up = Gas, S/Down = Brake, A/Left = Left, D/Right = Right, H = Horn)
window.addEventListener('keydown',e=>{
 if(!started)return;
 if(e.key==='w'||e.key==='ArrowUp')setGas(true);
 if(e.key==='s'||e.key==='ArrowDown')setBrake(true);
 if(e.key==='a'||e.key==='ArrowLeft'){steerAngle=Math.max(-65,steerAngle-8);wheelEl.style.transform=`rotate(${steerAngle*1.6}deg)`}
 if(e.key==='d'||e.key==='ArrowRight'){steerAngle=Math.min(65,steerAngle+8);wheelEl.style.transform=`rotate(${steerAngle*1.6}deg)`}
 if(e.key==='h'||e.key==='H'){ensureAudio();horn()}
});
window.addEventListener('keyup',e=>{
 if(e.key==='w'||e.key==='ArrowUp')setGas(false);
 if(e.key==='s'||e.key==='ArrowDown')setBrake(false);
});

// Driving Animation Loop
let last=performance.now();
function loop(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 if(started){
  if(isGas) speed=Math.min(speed+120*dt, 220);
  else speed=Math.max(speed-60*dt, 0);
  if(isBrake) speed=Math.max(speed-280*dt, 0);
 }else{
  speed=0;
 }
 if(!isWheelDrag&&Math.abs(steerAngle)>0.5){
  steerAngle*=0.94;
  wheelEl.style.transform=`rotate(${steerAngle*1.6}deg)`;
 }
 pos.x += speed * face * dt;
 if(pos.x>1150)pos.x=-1150;if(pos.x<-1150)pos.x=1150;
 wheelAngle += speed * face * dt * 2.5;
 plane.querySelectorAll('.wheel').forEach(w=>w.setAttribute('transform',`rotate(${wheelAngle} ${w.dataset.c.replace(',',' ')})`));
 $('mover').setAttribute('transform',`translate(${pos.x} 0)`);
 $('facer').setAttribute('transform',`translate(550 160) scale(${-face} 1) translate(-550 -160)`);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$('reset').onclick=()=>{
 cancelDrag();placed=new Set();started=false;speed=0;pos.x=0;face=-1;wheelAngle=0;steerAngle=0;
 wheelEl.style.transform='rotate(0deg)';
 $('bStart').classList.remove('on');$('bStart').innerHTML='<b>▶</b>Start';
 buildTray();renderBus();updSound();
};
buildTray();renderBus();

// ---------- Web Audio Sound Engine ----------
let snd=true,actx=null,J=null;
function ensureAudio(){
 if(actx){actx.resume();return}
 const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
 actx=new Audio();const master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
 const engine=actx.createOscillator();engine.type='sawtooth';engine.frequency.value=48;
 const eg=actx.createGain();eg.gain.value=.16;engine.connect(eg);eg.connect(master);engine.start();
 J={master,engine};actx.resume();
}
function horn(){
 if(!actx||!snd)return;const t=actx.currentTime,gain=actx.createGain();gain.connect(actx.destination);
 gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.18,t+.04);gain.gain.setValueAtTime(.18,t+.5);gain.gain.exponentialRampToValueAtTime(.001,t+.9);
 [196,247,294].forEach(f=>{const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(gain);o.start(t);o.stop(t+.95)});
 setTimeout(()=>gain.disconnect(),1100);
}
function updSound(){
 if(!actx||!J)return;const t=actx.currentTime;
 J.master.gain.setTargetAtTime(snd&&started?.42:0,t,.12);
 J.engine.frequency.setTargetAtTime(45+speed*.24+(isGas?15:0),t,.14);
}
$('bSound').onclick=()=>{ensureAudio();snd=!snd;$('bSound').innerHTML=snd?'<b>🔊</b>Sound':'<b>🔇</b>Mute';updSound()};
setInterval(updSound,40);
</script>
</body>
</html>
