<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rocket Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#070b16;color:#f8fafc;user-select:none;-webkit-user-select:none;touch-action:none}
main{display:flex;flex-direction:column;width:100%;height:100%;max-width:1400px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#141c30;border-bottom:1px solid #2b3755}
h1{flex:1;font-size:clamp(1rem,4.4vw,1.5rem);font-weight:900;background:linear-gradient(90deg,#fbbf24,#f43f5e,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.pill{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;border:0;cursor:pointer}
#count{background:#26304a;color:#fbbf24;border:1px solid #3b4768}
#reset{background:#ef4444;color:#fff}
#boardWrap{flex:0 0 46%;min-height:0;padding:6px 8px;position:relative}
#board{position:absolute;inset:6px 8px;border:2px dashed #fbbf24aa;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#1b2547 0%,#0a0f22 55%,#03050c 100%);box-shadow:inset 0 0 50px #000a}
#scene{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-weight:700;font-size:13px;color:#94a3b8;pointer-events:none}
#zoomBox{position:absolute;top:8px;right:8px;z-index:50;display:flex;flex-direction:column;gap:5px}
.zbtn{width:38px;height:38px;border-radius:10px;border:1px solid #3b4768;background:#141c30e6;color:#fbbf24;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px #000a;touch-action:manipulation}
.zbtn:active{transform:scale(.92)}
.zbtn:disabled{opacity:.3}
#tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px;background:#0f1628;border-top:2px solid #2b3755;flex:1;min-height:0;overflow-y:auto;align-content:start}
@media(min-width:900px){#tray{grid-template-columns:repeat(12,1fr)}}
@media(max-width:480px){#tray{grid-template-columns:repeat(4,1fr)}}
.slot{height:66px;border-radius:12px;background:linear-gradient(180deg,#18223a,#0c1222);border:1px solid #2b3755;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.slot svg{width:100%;height:68%;pointer-events:none;filter:drop-shadow(0 3px 4px #000b)}
.slot span{font-size:10px;font-weight:700;color:#a5b4cc;pointer-events:none;max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.gone{opacity:.12;pointer-events:none}
#controls{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px 10px;background:#070b16;border-top:1px solid #1b2440}
.btns{display:flex;gap:5px}
.cbtn{width:clamp(46px,13vw,64px);height:clamp(46px,13vw,64px);border-radius:14px;border:0;color:#fff;font-weight:800;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #0009;cursor:pointer}
.cbtn b{font-size:18px}.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0009}
#bColor{background:linear-gradient(135deg,#f43f5e,#f59e0b,#10b981,#3b82f6)}
#bLight{background:linear-gradient(135deg,#eab308,#f97316)}
#bSound{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
#bStart{background:linear-gradient(135deg,#22c55e,#15803d)}
#bStart.on{background:linear-gradient(135deg,#ef4444,#991b1b)}
#remote{display:grid;grid-template-columns:repeat(3,clamp(32px,9vw,42px));grid-template-rows:repeat(2,clamp(32px,9vw,42px));gap:4px;padding:5px;border-radius:16px;background:#141c30;border:1px solid #2b3755}
.r{border:0;border-radius:9px;background:#2b3755;color:#fff;font-size:16px;font-weight:800;cursor:pointer;touch-action:none}
.r.act{background:#fbbf24;color:#111}
.cbtn:disabled,.r:disabled{opacity:.35}
#drag{position:fixed;pointer-events:none;z-index:9999;filter:drop-shadow(0 12px 18px #000c)}
#msg{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:#0284c7;color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10000;white-space:nowrap}
#msg.bad{background:#dc2626}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
.bl{animation:blink .7s infinite}.bl2{animation:blink .7s .35s infinite}
</style>
</head>
<body>
<main>
<header>
  <h1>🚀 Rocket Builder</h1>
  <span id="count" class="pill">0 / 12</span>
  <button id="reset" class="pill">Reset</button>
</header>
<div id="boardWrap"><div id="board">
  <svg id="scene" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid meet">
    <defs id="defs"></defs>
    <g id="stars"></g>
    <g id="pad"><rect x="60" y="392" width="180" height="14" rx="4" fill="url(#g-pad)" stroke="#0b1120" stroke-width="2"/><rect x="70" y="406" width="12" height="14" fill="#334155"/><rect x="218" y="406" width="12" height="14" fill="#334155"/></g>
    <g id="mover"><g id="spinner">
      <g id="ghost" opacity=".13"></g>
      <g id="flame"></g>
      <g id="rocket"></g>
      <g id="lights"></g>
    </g></g>
  </svg>
  <div id="hint">Drag each part to its exact place on the rocket</div>
</div>
<div id="zoomBox">
  <button class="zbtn" id="zIn" aria-label="Zoom in">+</button>
  <button class="zbtn" id="zOut" aria-label="Zoom out">−</button>
</div></div>
<section id="tray"></section>
<div id="controls">
  <div class="btns">
    <button class="cbtn" id="bColor"><b>🎨</b>Color</button>
    <button class="cbtn" id="bLight"><b>💡</b>Light</button>
    <button class="cbtn" id="bSound"><b>🔊</b>Sound</button>
    <button class="cbtn" id="bStart"><b>🚀</b>Launch</button>
  </div>
  <div id="remote">
    <button class="r" data-k="spin">⟳</button><button class="r" data-k="up">▲</button><button class="r" data-k="boost">🔥</button>
    <button class="r" data-k="left">◀</button><button class="r" data-k="down">▼</button><button class="r" data-k="right">▶</button>
  </div>
</div>
</main>
<div id="msg"></div>
<script>
(()=>{
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(drag||e.target.closest('#board'))e.preventDefault()},{passive:false});

const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const S='stroke="#0b1120" stroke-width="2" stroke-linejoin="round"';
const g=c=>`url(#g-${c})`;

/* colour themes: [body, accent, fin, trim] */
const THEMES=[
 {body:['#cbd5e1','#ffffff','#64748b'],acc:['#b91c1c','#f87171','#7f1d1d'],fin:['#1d4ed8','#60a5fa','#1e3a8a'],trim:['#a16207','#fde047','#713f12']},
 {body:['#f1f5f9','#ffffff','#94a3b8'],acc:['#0e7490','#67e8f9','#164e63'],fin:['#ea580c','#fdba74','#7c2d12'],trim:['#475569','#cbd5e1','#1e293b']},
 {body:['#fde68a','#fffbeb','#b45309'],acc:['#7c3aed','#c4b5fd','#4c1d95'],fin:['#16a34a','#86efac','#14532d'],trim:['#be123c','#fda4af','#881337']},
 {body:['#334155','#94a3b8','#0f172a'],acc:['#e11d48','#fb7185','#881337'],fin:['#f59e0b','#fde68a','#92400e'],trim:['#22d3ee','#cffafe','#0e7490']},
];
let theme=0;
function buildDefs(){
  const t=THEMES[theme];
  const cyl=(id,[m,hi,dk])=>`<linearGradient id="g-${id}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${dk}"/><stop offset=".35" stop-color="${hi}"/><stop offset=".6" stop-color="${m}"/><stop offset="1" stop-color="${dk}"/></linearGradient>`;
  $('defs').innerHTML=cyl('body',t.body)+cyl('acc',t.acc)+cyl('fin',t.fin)+cyl('trim',t.trim)+
   cyl('metal',['#64748b','#e2e8f0','#1e293b'])+cyl('pad',['#475569','#94a3b8','#1e293b'])+
   `<radialGradient id="g-glass" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".35" stop-color="#38bdf8"/><stop offset="1" stop-color="#0c4a6e"/></radialGradient>
    <radialGradient id="g-glassOn" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <linearGradient id="g-fire" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#fde047"/><stop offset=".6" stop-color="#f97316"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
}
const shine=(x,y,w,h)=>`<rect x="${x+w*.22}" y="${y+3}" width="${w*.1}" height="${h-6}" rx="${w*.05}" fill="#fff" opacity=".4"/>`;

/* Each part: id, name, bbox [x,y,w,h] (its ONLY valid spot), art */
const PARTS=[
 {id:1,n:"Nose Cone",b:[120,40,60,70],a:`<path d="M150 40 C172 62 180 88 180 110 L120 110 C120 88 128 62 150 40Z" fill="${g('acc')}" ${S}/><path d="M146 52 C138 70 134 88 134 104" stroke="#fff" stroke-width="4" opacity=".45" fill="none" stroke-linecap="round"/>`},
 {id:2,n:"Tip Antenna",b:[146,18,8,24],a:`<rect x="148" y="22" width="4" height="20" fill="${g('metal')}" stroke="#0b1120" stroke-width="1.5"/><circle cx="150" cy="21" r="4" fill="#ef4444" stroke="#0b1120" stroke-width="1.5"/>`},
 {id:3,n:"Upper Body",b:[120,110,60,70],a:`<rect x="120" y="110" width="60" height="70" fill="${g('body')}" ${S}/>${shine(120,110,60,70)}`},
 {id:4,n:"Window",b:[134,124,32,32],a:`<circle cx="150" cy="140" r="16" fill="${g('trim')}" ${S}/><circle class="win" cx="150" cy="140" r="10.5" fill="${g('glass')}" stroke="#0b1120" stroke-width="1.5"/><circle cx="146" cy="136" r="3" fill="#fff" opacity=".8"/>`},
 {id:5,n:"Color Band",b:[118,180,64,16],a:`<rect x="118" y="180" width="64" height="16" rx="2" fill="${g('acc')}" ${S}/>`},
 {id:6,n:"Middle Body",b:[120,196,60,84],a:`<rect x="120" y="196" width="60" height="84" fill="${g('body')}" ${S}/>${shine(120,196,60,84)}<text x="150" y="246" text-anchor="middle" font-size="13" font-weight="900" fill="#0b1120" opacity=".75" transform="rotate(-90 150 242)">BD-1</text>`},
 {id:7,n:"Lower Body",b:[116,280,68,60],a:`<path d="M120 280 L180 280 L184 340 L116 340Z" fill="${g('trim')}" ${S}/>${shine(118,280,64,60)}`},
 {id:8,n:"Left Fin",b:[80,270,40,90],a:`<path d="M120 270 L120 340 L82 360 L86 318Z" fill="${g('fin')}" ${S}/>`},
 {id:9,n:"Right Fin",b:[180,270,40,90],a:`<path d="M180 270 L180 340 L218 360 L214 318Z" fill="${g('fin')}" ${S}/>`},
 {id:10,n:"Center Fin",b:[144,300,12,64],a:`<path d="M146 300 L154 300 L156 364 L144 364Z" fill="${g('fin')}" ${S}/>`},
 {id:11,n:"Main Engine",b:[126,340,48,30],a:`<path d="M134 340 L166 340 L174 370 L126 370Z" fill="${g('metal')}" ${S}/><rect x="126" y="366" width="48" height="5" rx="2" fill="#1e293b"/>`},
 {id:12,n:"Booster L",b:[92,200,22,140],a:`<path d="M103 200 C112 212 114 224 114 236 L114 330 L92 330 L92 236 C92 224 94 212 103 200Z" fill="${g('body')}" ${S}/><rect x="92" y="300" width="22" height="8" fill="${g('acc')}"/><path d="M95 330 L111 330 L114 342 L92 342Z" fill="${g('metal')}" ${S}/>`},
 {id:13,n:"Booster R",b:[186,200,22,140],a:`<path d="M197 200 C206 212 208 224 208 236 L208 330 L186 330 L186 236 C186 224 188 212 197 200Z" fill="${g('body')}" ${S}/><rect x="186" y="300" width="22" height="8" fill="${g('acc')}"/><path d="M189 330 L205 330 L208 342 L186 342Z" fill="${g('metal')}" ${S}/>`},
];
/* layering order on the rocket (back to front) */
const ORDER=[12,13,8,9,2,1,3,5,6,7,11,10,4];
const TOTAL=PARTS.length;
$('count').textContent=`0 / ${TOTAL}`;
let placed=new Set();

function render(){
  buildDefs();
  $('ghost').innerHTML=ORDER.map(id=>PARTS.find(p=>p.id===id).a).join('').replace(/url\(#g-[a-z]+\)/gi,'#94a3b8');
  $('rocket').innerHTML=ORDER.filter(id=>placed.has(id)).map(id=>PARTS.find(p=>p.id===id).a).join('');
  $('count').textContent=`${placed.size} / ${TOTAL}`;
  $('hint').style.display=placed.size?'none':'block';
  [...$('tray').children].forEach(s=>s.classList.toggle('gone',placed.has(+s.dataset.id)));
  lightsRender();
}
function thumb(p){const [x,y,w,h]=p.b,pd=6;return `<svg viewBox="${x-pd} ${y-pd} ${w+pd*2} ${h+pd*2}" preserveAspectRatio="xMidYMid meet">${p.a}</svg>`}
function buildTray(){
  const tray=$('tray');tray.innerHTML='';
  [...PARTS].sort(()=>Math.random()-.5).forEach(p=>{
    const d=document.createElement('div');d.className='slot';d.dataset.id=p.id;
    d.innerHTML=thumb(p)+`<span>${p.n}</span>`;
    d.addEventListener('pointerdown',e=>startDrag(e,p));
    tray.appendChild(d);
  });
}

/* ---------- drag & strict snapping ---------- */
let drag=null;
function scale(){const m=$('scene').getScreenCTM();return m?m.a:1}
function startDrag(e,p){
  if(placed.has(p.id)||flying)return;
  e.preventDefault();
  const k=scale(),[x,y,w,h]=p.b,pd=4;
  const el=document.createElement('div');el.id='drag';
  el.innerHTML=`<svg width="${(w+pd*2)*k}" height="${(h+pd*2)*k}" viewBox="${x-pd} ${y-pd} ${w+pd*2} ${h+pd*2}">${p.a}</svg>`;
  document.body.appendChild(el);
  drag={p,el,ox:(w/2+pd)*k,oy:(h/2+pd)*k};
  moveDrag(e);
  window.addEventListener('pointermove',moveDrag);
  window.addEventListener('pointerup',endDrag,{once:true});
  window.addEventListener('pointercancel',endDrag,{once:true});
}
function moveDrag(e){if(!drag)return;drag.el.style.left=(e.clientX-drag.ox)+'px';drag.el.style.top=(e.clientY-drag.oy)+'px'}
function target(p){
  const m=$('rocket').getScreenCTM(),[x,y,w,h]=p.b,pt=$('scene').createSVGPoint();
  pt.x=x+w/2;pt.y=y+h/2;const r=pt.matrixTransform(m);return [r.x,r.y];
}
function endDrag(e){
  window.removeEventListener('pointermove',moveDrag);
  if(!drag)return;
  const {p,el}=drag;drag=null;el.remove();
  const [tx,ty]=target(p);
  const tol=Math.max(22,26*scale());          /* tight radius: only its own spot */
  const dist=Math.hypot(e.clientX-tx,e.clientY-ty);
  if(dist<=tol){
    placed.add(p.id);render();beep(660,.08);
    toast(placed.size===TOTAL?'🎉 Rocket complete! Press Launch':`✔ ${p.n} fitted`);
  }else{
    beep(160,.15);toast(`✖ ${p.n} doesn't fit there`,true);
  }
}

/* ---------- toast ---------- */
let tt;function toast(t,bad){const m=$('msg');m.textContent=t;m.className=bad?'bad':'';m.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>m.style.opacity=0,1400)}

/* ---------- lights ---------- */
let light=0;
function lightsRender(){
  const L=$('lights');let h='';
  if(light&&placed.has(2))h+=`<circle cx="150" cy="21" r="5" fill="#ff4d4d" filter="url(#glow)" class="bl"/>`;
  if(light&&placed.has(12))h+=`<circle cx="103" cy="250" r="3.5" fill="#22c55e" filter="url(#glow)" class="bl2"/>`;
  if(light&&placed.has(13))h+=`<circle cx="197" cy="250" r="3.5" fill="#22c55e" filter="url(#glow)" class="bl"/>`;
  L.innerHTML=h;
  document.querySelectorAll('#rocket .win').forEach(w=>{w.setAttribute('fill',light?'url(#g-glassOn)':'url(#g-glass)');w.setAttribute('filter',light?'url(#glow)':'')});
}
$('bColor').onclick=()=>{theme=(theme+1)%THEMES.length;render();beep(520,.06)};
$('bLight').onclick=()=>{light=light?0:1;lightsRender();beep(880,.05)};

/* ---------- sound ---------- */
let ac,sound=true,rumble;
function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();return ac}
function beep(f,d){if(!sound)return;try{const a=ctx(),o=a.createOscillator(),v=a.createGain();o.frequency.value=f;o.type='triangle';v.gain.setValueAtTime(.15,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch{}}
function startRumble(){if(!sound||rumble)return;try{const a=ctx(),len=a.sampleRate*2,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=buf;s.loop=true;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const v=a.createGain();v.gain.value=.25;s.connect(f).connect(v).connect(a.destination);s.start();rumble={s,v}}catch{}}
function stopRumble(){if(rumble){rumble.s.stop();rumble=null}}
$('bSound').onclick=()=>{sound=!sound;$('bSound').querySelector('b').textContent=sound?'🔊':'🔇';if(!sound)stopRumble();else if(flying)startRumble()};

/* ---------- stars ---------- */
const stars=[];
(function(){let h='';for(let i=0;i<70;i++){const s={x:Math.random()*300,y:Math.random()*420,r:Math.random()*1.4+.3};stars.push(s);h+=`<circle r="${s.r}" fill="#fff" opacity="${.3+Math.random()*.7}"/>`}$('stars').innerHTML=h})();
function drawStars(){[...$('stars').children].forEach((c,i)=>{c.setAttribute('cx',stars[i].x);c.setAttribute('cy',stars[i].y)})}
drawStars();

/* ---------- flight ---------- */
let flying=false,pos={x:0,y:0},vel={x:0,y:0},rot=0,spin=0,keys={},boost=0,last=0;
  
/* ROCKET BUILDER COMPLETION SYSTEM */

let flightControlUsed = false;
let rocketCompleted = false;

function checkRocketCompletion(){

    if(
        placed.size === TOTAL &&
        flying &&
        flightControlUsed &&
        !rocketCompleted
    ){

        if(
            window.FutureLabProgress &&
            window.FutureLabProgress.complete("rocket-builder.html")
        ){

            rocketCompleted = true;
            toast("🏆 Rocket Builder Completed! Satellite Unlocked!");

        }else{

            toast("Progress system not connected!",true);

        }
    }
}

function setRemote(){document.querySelectorAll('.r').forEach(b=>b.disabled=!flying)}
setRemote();
$('bStart').onclick=()=>{
  if(!flying&&placed.size<TOTAL){toast(`Fit all ${TOTAL} parts first (${placed.size}/${TOTAL})`,true);return}
  flying=!flying;$('bStart').classList.toggle('on',flying);
  $('bStart').innerHTML=flying?'<b>■</b>Stop':'<b>🚀</b>Launch';
  setRemote();
  if(flying){startRumble();toast('3… 2… 1… Liftoff!')}else{stopRumble();pos={x:0,y:0};vel={x:0,y:0};rot=0;spin=0;$('flame').innerHTML='';$('pad').style.opacity=1;apply()}
};
document.querySelectorAll('.r').forEach(b=>{
  
const k=b.dataset.k,on=e=>{
    e.preventDefault();

    if(!flying)return;

    keys[k]=1;
    b.classList.add('act');

    if(k==='spin')spin=360;

    if(["up","down","left","right","boost"].includes(k)){
        flightControlUsed=true;
        checkRocketCompletion();
    }

},off=()=>{
    keys[k]=0;
    b.classList.remove('act');
};

  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',' ':'boost'};
addEventListener('keydown',e=>{if(KM[e.key]&&flying){keys[KM[e.key]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=0});

function apply(){
  $('mover').setAttribute('transform',`translate(${pos.x} ${pos.y})`);
  $('spinner').setAttribute('transform',`rotate(${rot} 150 220)`);
}
function loop(t){
  const dt=Math.min((t-last)/1000||0,.05);last=t;
  if(flying){
    const A=420;
    if(keys.left)vel.x-=A*dt;if(keys.right)vel.x+=A*dt;
    if(keys.up)vel.y-=A*dt;if(keys.down)vel.y+=A*dt;
    boost=keys.boost?Math.min(1,boost+dt*3):Math.max(0,boost-dt*2);
    vel.x*=Math.exp(-3*dt);vel.y*=Math.exp(-3*dt);
    pos.x=Math.max(-110,Math.min(110,pos.x+vel.x*dt));
    pos.y=Math.max(-150,Math.min(20,pos.y+vel.y*dt-(pos.y>-60?40*dt:0)));
    const tilt=Math.max(-25,Math.min(25,vel.x*.12));
    if(spin>0){const s=Math.min(spin,720*dt);spin-=s;rot+=s}else rot+=(tilt-((rot%360+540)%360-180))*Math.min(1,dt*6);
    const sp=(90+boost*260)*dt;
    stars.forEach(s=>{s.y+=sp*(s.r);if(s.y>420){s.y=0;s.x=Math.random()*300}});drawStars();
    const L=60+boost*50+Math.random()*14,w=18+Math.random()*4;
    let f=`<path d="M${150-w} 370 Q150 ${370+L*1.2} ${150+w} 370Z" fill="url(#g-fire)" filter="url(#glow)"/>`;
    [103,197].forEach(cx=>{const l=L*.6;f+=`<path d="M${cx-9} 342 Q${cx} ${342+l*1.2} ${cx+9} 342Z" fill="url(#g-fire)" filter="url(#glow)"/>`});
    $('flame').innerHTML=f;
    $('pad').style.opacity=Math.max(0,1+pos.y/60);
    if(rumble)rumble.v.gain.value=.2+boost*.25;
    apply();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- zoom ---------- */
let zoom=1;
function applyZoom(){
  $('board').style.transform=`scale(${zoom})`;
  $('board').style.transformOrigin='center center';
  $('zIn').disabled=zoom>=3;$('zOut').disabled=zoom<=0.6;
}
$('zIn').onclick=()=>{zoom=Math.min(3,+(zoom+0.2).toFixed(1));applyZoom();beep(740,.05)};
$('zOut').onclick=()=>{zoom=Math.max(0.6,+(zoom-0.2).toFixed(1));applyZoom();beep(520,.05)};
applyZoom();

$('reset').onclick=()=>{if(flying)$('bStart').click();placed.clear();buildTray();render();toast('Reset')};
buildTray();render();
})();
 <script src="./builder-progress.js"></script>
</script>
