<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>৩ডি স্পোর্টস কার ল্যাব</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #060911;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      touch-action: none;
    }

    /* স্ক্রিন কন্টেইনার */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* ওপরের হেডার বার ও গাড়ি খোলার বাটন */
    #top-bar {
      flex-shrink: 0;
      background: linear-gradient(180deg, #0f172a 0%, rgba(15, 23, 42, 0.85) 100%);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      z-index: 25;
    }
    .header-text {
      text-align: left;
    }
    .header-text h1 {
      font-size: 15px;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    #step-hint {
      font-size: 11px;
      color: #fbbf24;
      font-weight: 600;
      margin-top: 1px;
    }
    #disassemble-btn {
      background: #334155;
      border: 1px solid #f97316;
      color: #fdba74;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    #disassemble-btn:active {
      transform: scale(0.95);
      background: #ea580c;
      color: #fff;
    }

    /* মূল ক্যানভাস কন্টেইনার */
    #workshop-canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* নিচের কন্ট্রোল বাটন বার */
    #bottom-bar {
      flex-shrink: 0;
      background: #0b1120;
      border-top: 1px solid #1e293b;
      padding: 6px 8px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      gap: 6px;
      justify-content: space-between;
      z-index: 25;
    }
    .btn {
      flex: 1;
      padding: 7px 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .btn span.icon { font-size: 14px; }
    .btn.drive-btn {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border-color: #34d399;
      color: #fff;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    /* পপআপ ডায়ালগ */
    .popup-tray {
      position: absolute;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 14px;
      padding: 8px 12px;
      display: none;
      gap: 10px;
      z-index: 40;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
    }
    .popup-tray.show { display: flex; }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
    }
    .opt-chip {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
    }

    /* ড্রাইভিং স্ক্রিন */
    #drive-screen {
      background: #050b14;
      flex-direction: row;
    }
    #road-container {
      flex: 1.3;
      height: 100%;
      position: relative;
    }
    #cockpit-container {
      flex: 1;
      height: 100%;
      background: #0f172a;
      border-left: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 8px;
    }
    #wheel {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 12px solid #334155;
      background: #1e293b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7), inset 0 0 12px #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      position: relative;
    }
    #wheel-bar {
      position: absolute;
      width: 100%;
      height: 14px;
      background: #475569;
    }
    #horn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #fff;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
    }
    .pedal-box {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      align-items: flex-end;
    }
    .pedal {
      width: 50px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      box-shadow: inset 0 0 8px #000, 0 3px 6px rgba(0,0,0,0.5);
    }
    #p-brake { height: 70px; background: #991b1b; border: 2px solid #ef4444; }
    #p-gas { height: 100px; background: #166534; border: 2px solid #22c55e; }
    .c-btn {
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- স্ক্রিন ১: কার ওয়ার্কশপ -->
  <div id="workshop-screen" class="screen active">
    <div id="top-bar">
      <div class="header-text">
        <h1>🏎️ ৩ডি স্পোর্টস কার ওয়ার্কশপ</h1>
        <div id="step-hint">👉 ধাপ ১: নিচে থেকে 'চেসিস ফ্রেম'টি প্ল্যাটফর্মে বসান</div>
      </div>
      <button id="disassemble-btn" onclick="undoAssemble()">
        <span>🔧</span> পার্টস খুলুন
      </button>
    </div>

    <div id="workshop-canvas-wrap">
      <canvas id="wCanvas"></canvas>
    </div>

    <!-- কালার পপআপ -->
    <div id="color-pop" class="popup-tray">
      <div class="color-swatch" style="background:#ef4444;" onclick="pickCarColor('#ef4444')"></div>
      <div class="color-swatch" style="background:#2563eb;" onclick="pickCarColor('#2563eb')"></div>
      <div class="color-swatch" style="background:#eab308;" onclick="pickCarColor('#eab308')"></div>
      <div class="color-swatch" style="background:#10b981;" onclick="pickCarColor('#10b981')"></div>
      <div class="color-swatch" style="background:#a855f7;" onclick="pickCarColor('#a855f7')"></div>
      <div class="color-swatch" style="background:#1e293b;" onclick="pickCarColor('#1e293b')"></div>
    </div>

    <!-- লাইটিং পপআপ -->
    <div id="light-pop" class="popup-tray">
      <div class="opt-chip" onclick="pickLighting('cyan')">💙 সায়ান নিয়ন</div>
      <div class="opt-chip" onclick="pickLighting('magenta')">💜 ম্যাজেন্টা</div>
      <div class="opt-chip" onclick="pickLighting('lime')">💚 নিয়ন গ্রিন</div>
      <div class="opt-chip" onclick="pickLighting('gold')">🔥 গোল্ডেন ফ্লেম</div>
    </div>

    <!-- সাউন্ড পপআপ -->
    <div id="music-pop" class="popup-tray">
      <div class="opt-chip" onclick="playLoudAudio('engine')">🔥 টার্বো রেভ</div>
      <div class="opt-chip" onclick="playLoudAudio('beat')">🎧 ড্রাইভ বিট</div>
      <div class="opt-chip" onclick="playLoudAudio('siren')">🚨 রেসিং সাইরেন</div>
    </div>

    <!-- নিচের ফিক্সড কন্ট্রোল বার -->
    <div id="bottom-bar">
      <button class="btn" onclick="togglePopup('color-pop')"><span class="icon">🎨</span>কালার</button>
      <button class="btn" onclick="togglePopup('light-pop')"><span class="icon">💡</span>নিয়ন লাইট</button>
      <button class="btn" onclick="togglePopup('music-pop')"><span class="icon">🔊</span>সাউন্ড</button>
      <button class="btn drive-btn" onclick="openDriveTrack()"><span class="icon">🏎️</span>টেস্ট ড্রাইভ</button>
    </div>
  </div>

  <!-- স্ক্রিন ২: আঁকাবাঁকা টেস্ট ট্র্যাক ও ককপিট -->
  <div id="drive-screen" class="screen">
    <div id="road-container">
      <canvas id="roadCanvas"></canvas>
    </div>

    <div id="cockpit-container">
      <div style="display:flex; justify-content:space-between; width:100%;">
        <button class="c-btn" onclick="openWorkshop()">⬅ ওয়ার্কশপ</button>
        <button class="c-btn" id="gear-btn" onclick="toggleGear()">গিয়ার: D1</button>
      </div>

      <!-- গোল স্টিয়ারিং -->
      <div id="wheel">
        <div id="wheel-bar"></div>
        <div id="horn" onclick="playHorn()">HORN</div>
      </div>

      <button class="c-btn" id="ignition-btn" style="background:#ea580c; border-color:#f97316;" onclick="toggleEngine()">🔥 ইঞ্জিন স্টার্ট</button>

      <!-- স্পোর্টস প্যাডেলস -->
      <div class="pedal-box">
        <div class="pedal" id="p-brake">ব্রেক</div>
        <div class="pedal" id="p-gas">এক্সেল</div>
      </div>
    </div>
  </div>

  <script>
    // --- অডিও সিন্থেসাইজার (শতভাগ অফলাইন ও স্পষ্ট সাউন্ড) ---
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const aCtx = new AudioContextClass();
    let engineOsc = null;

    function playTone(freq, type, dur, vol = 0.5) {
      try {
        if (aCtx.state === 'suspended') aCtx.resume();
        const o = aCtx.createOscillator();
        const g = aCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, aCtx.currentTime);
        g.gain.setValueAtTime(vol, aCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, aCtx.currentTime + dur);
        o.connect(g);
        g.connect(aCtx.destination);
        o.start();
        o.stop(aCtx.currentTime + dur);
      } catch (e) {}
    }

    function playSnap() {
      playTone(520, 'triangle', 0.1, 0.7);
      setTimeout(() => playTone(840, 'sine', 0.2, 0.8), 70);
    }

    function playDetachSound() {
      playTone(600, 'sawtooth', 0.1, 0.5);
      setTimeout(() => playTone(300, 'sine', 0.15, 0.6), 60);
    }

    function playHorn() {
      playTone(440, 'sawtooth', 0.35, 0.9);
      playTone(554, 'sawtooth', 0.35, 0.9);
    }

    function playLoudAudio(type) {
      hidePopups();
      if (type === 'engine') {
        [80, 110, 160, 240, 320].forEach((f, i) => setTimeout(() => playTone(f, 'sawtooth', 0.35, 0.8), i * 110));
      } else if (type === 'beat') {
        [120, 260, 120, 380].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.2, 0.7), i * 150));
      } else {
        [650, 850, 650, 850].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25, 0.9), i * 140));
      }
    }

    // --- পার্টস ও ধারাবাহিকতা ---
    const STEPS = [
      { id: 'chassis', name: '১. চেসিস ফ্রেম', hint: "👉 ধাপ ১: নিচে থেকে 'চেসিস ফ্রেম'টি প্ল্যাটফর্মে বসান" },
      { id: 'wheels', name: '২. স্পোর্টস চাকা ও রিম', hint: "👉 ধাপ ২: চমৎকার অ্যালয় রিমসহ 'স্পোর্টস চাকা' জোড়া লাগান" },
      { id: 'engine', name: '৩. টুইন টার্বো ইঞ্জিন', hint: "👉 ধাপ ৩: শক্তিশালী 'টার্বো ইঞ্জিন'টি মাঝখানে বসান" },
      { id: 'cockpit', name: '৪. রেসিং সিট ও স্টিয়ারিং', hint: "👉 ধাপ ৪: ভেতরের 'ককপিট ও স্টিয়ারিং' অংশটি ড্র্যাগ করুন" },
      { id: 'body', name: '৫. স্পোর্টস অ্যারো বডি', hint: "👉 ধাপ ৫: পুরো গাড়ির ওপর চকচকে 'স্পোর্টস বডি' সেট করুন" },
      { id: 'spoiler', name: '৬. হেডলাইট ও জিটি উইং', hint: "👉 ধাপ ৬: সর্বশেষ 'স্পোর্টস স্পয়লার ও এলইডি' লাগিয়ে গাড়ি পূর্ণ করুন" }
    ];

    let currentStepIndex = 0;
    let carColor = '#ef4444';
    let underglowColor = '#00f0ff';
    let underglowGlow = 'rgba(0, 240, 255, 0.85)';

    const wWrap = document.getElementById('workshop-canvas-wrap');
    const wCanvas = document.getElementById('wCanvas');
    const wCtx = wCanvas.getContext('2d');
    let W = 0, H = 0;
    let stageX = 0, stageY = 0;

    let parts = [
      { id: 'chassis', name: 'চেসিস ফ্রেম', x: 0, y: 0, sx: 0, sy: 0, snapped: false },
      { id: 'wheels', name: 'স্পোর্টস চাকা', x: 0, y: 0, sx: 0, sy: 0, snapped: false },
      { id: 'engine', name: 'টার্বো ইঞ্জিন', x: 0, y: 0, sx: 0, sy: 0, snapped: false },
      { id: 'cockpit', name: 'রেসিং ককপিট', x: 0, y: 0, sx: 0, sy: 0, snapped: false },
      { id: 'body', name: 'স্পোর্টস বডি', x: 0, y: 0, sx: 0, sy: 0, snapped: false },
      { id: 'spoiler', name: 'জিটি স্পয়লার', x: 0, y: 0, sx: 0, sy: 0, snapped: false }
    ];

    function resizeCanvas() {
      W = wCanvas.width = wWrap.clientWidth;
      H = wCanvas.height = wWrap.clientHeight;
      stageX = W / 2;
      // ১. গাড়ি রাখার জায়গা উপরে শিফট করা হয়েছে (H এর ২৯% এ)
      stageY = H * 0.29;

      // নিচে পার্টস রাখার সুবিন্যস্ত ও আলাদা স্লট (২ সারিতে ৩টি করে পৃথক ঘর)
      const trayTop = H * 0.58;
      const colW = W / 3;
      parts.forEach((p, idx) => {
        const row = Math.floor(idx / 3);
        const col = idx % 3;
        const px = colW * col + colW / 2;
        const py = trayTop + row * (H * 0.18) + 24;
        p.sx = px;
        p.sy = py;
        if (!p.snapped && !dragTarget) {
          p.x = px;
          p.y = py;
        }
      });
    }

    function updateStepHint() {
      const hintEl = document.getElementById('step-hint');
      const disBtn = document.getElementById('disassemble-btn');
      if (currentStepIndex < STEPS.length) {
        hintEl.innerText = STEPS[currentStepIndex].hint;
        hintEl.style.color = '#fbbf24';
      } else {
        hintEl.innerHTML = "🎉 <strong style='color:#34d399;'>দারুণ! স্পোর্টস কার সম্পূর্ণ! এবার 'টেস্ট ড্রাইভ' দিন!</strong>";
      }
      // যদি অন্তত ১টি পার্ট লাগানো থাকে তবেই খোলা যাবে
      disBtn.style.opacity = currentStepIndex > 0 ? '1' : '0.5';
    }

    // --- গাড়ি খোলার লজিক (Disassembly / Undo) ---
    function undoAssemble() {
      if (currentStepIndex === 0) return;
      currentStepIndex--;
      const targetStep = STEPS[currentStepIndex];
      const partToDetach = parts.find(p => p.id === targetStep.id);
      if (partToDetach) {
        partToDetach.snapped = false;
        partToDetach.x = partToDetach.sx;
        partToDetach.y = partToDetach.sy;
        playDetachSound();
        updateStepHint();
      }
    }

    // --- পার্টসগুলোর স্পষ্ট, নিখুঁত ও সহজে চেনা যায় এমন গ্রাফিক্স ---
    function drawPartIcon(ctx, p, isGhost = false) {
      ctx.save();
      if (isGhost) {
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = '#38bdf8';
        ctx.setLineDash([4, 4]);
      }

      switch (p.id) {
        case 'chassis': // মজবুত মেটাল ফ্রেম + হলুদ শক-অ্যাবজরবার ও এক্সেল
          // ফ্রেম বিম
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(-90, -5, 180, 10);
          ctx.fillStyle = '#475569';
          ctx.fillRect(-75, -12, 150, 7);
          ctx.fillRect(-65, 5, 130, 5);

          // হলুদ সাসপেনশন স্প্রিং (Shock Absorber Springs)
          [-60, 60].forEach(sx => {
            ctx.fillStyle = '#eab308';
            ctx.fillRect(sx - 4, -14, 8, 18);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            for(let y = -12; y <= 2; y += 4) {
              ctx.beginPath();
              ctx.moveTo(sx - 4, y);
              ctx.lineTo(sx + 4, y + 2);
              ctx.stroke();
            }
          });
          break;

        case 'wheels': // খাঁজকাটা কালো রাবার টায়ার + উজ্জ্বল স্টার-অ্যালয় রিম + লাল ব্রেক ক্যালিপার
          [-60, 60].forEach(wx => {
            // রাবার টায়ার
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.arc(wx, 0, 24, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            ctx.stroke();

            // টায়ারের খাঁজ (Tread Lines)
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
              ctx.beginPath();
              ctx.moveTo(wx + Math.cos(a) * 19, Math.sin(a) * 19);
              ctx.lineTo(wx + Math.cos(a) * 24, Math.sin(a) * 24);
              ctx.stroke();
            }

            // স্টার অ্যালয় রিম
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.arc(wx, 0, 14, 0, Math.PI * 2);
            ctx.fill();

            // লাল রেসিং ব্রেক ক্যালিপার
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.arc(wx - 4, -5, 6, 0, Math.PI * 2);
            ctx.fill();

            // রিম স্পোকস ও সেন্টার ক্যাপ
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(wx, 0, 5, 0, Math.PI * 2);
            ctx.fill();
          });
          break;

        case 'engine': // টুইন-টার্বো ভি৮ ইঞ্জিন ব্লক + ক্রোম এয়ার ফিল্টার ও সিলিন্ডার হেড
          // সিলিন্ডার ব্লক
          ctx.fillStyle = '#dc2626'; // রেসিং রেড ইঞ্জিন কভার
          ctx.fillRect(-24, -20, 48, 26);
          // মেটালিক হেড
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-28, -25, 56, 6);
          // টুইন ক্রোম টার্বো ফিল্টার (Twin Turbo Air Filters)
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(-16, -11, 7, 0, Math.PI * 2);
          ctx.arc(16, -11, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(-6, -18, 12, 12);
          break;

        case 'cockpit': // লাল রেসিং বাকেট সিট + ৩-স্পোক স্টিয়ারিং হুইল
          // স্পোর্টস সিট
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.moveTo(-18, 12);
          ctx.lineTo(4, 12);
          ctx.lineTo(0, -22);
          ctx.lineTo(-14, -22);
          ctx.closePath();
          ctx.fill();
          // হারনেস বেল্ট
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-10, -20);
          ctx.lineTo(-6, 8);
          ctx.stroke();
          // স্পোর্টস স্টিয়ারিং
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(18, -6, 10, 0, Math.PI * 2);
          ctx.stroke();
          // স্টিয়ারিং স্পোকস
          ctx.fillStyle = '#fff';
          ctx.fillRect(16, -8, 4, 4);
          break;

        case 'body': // প্রিমিয়াম অ্যারোডাইনামিক স্পোর্টস কার বডি ও গ্লাস
          // স্পোর্টস কার বডি প্রোফাইল
          ctx.fillStyle = carColor;
          ctx.beginPath();
          ctx.moveTo(-108, 12);
          ctx.lineTo(108, 12);  // ফ্রন্ট স্প্লিটার
          ctx.lineTo(104, -2);
          ctx.lineTo(72, -12);  // হুড
          ctx.lineTo(36, -35);  // উইন্ডশীল্ড
          ctx.lineTo(-36, -35); // রুফ
          ctx.lineTo(-78, -12); // রিয়ার গ্লাস
          ctx.lineTo(-105, -8); // ট্রাঙ্ক
          ctx.closePath();
          ctx.fill();

          // স্পোর্টস হোয়াইট রেসিং স্ট্রাইপ
          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(-25, -34, 50, 3);

          // ডার্ক ব্লু স্মোকড উইন্ডশীল্ড
          ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
          ctx.beginPath();
          ctx.moveTo(32, -32);
          ctx.lineTo(-32, -32);
          ctx.lineTo(-60, -14);
          ctx.lineTo(54, -14);
          ctx.closePath();
          ctx.fill();

          // সাইড মিরর
          ctx.fillStyle = carColor;
          ctx.fillRect(18, -18, 8, 4);
          break;

        case 'spoiler': // কার্বন জিটি উইং ও ক্রিস্টাল এলইডি হেডলাইট
          // রেসিং স্পয়লার
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-110, -34, 32, 6); // আপার উইং
          ctx.fillRect(-102, -28, 4, 18); // স্ট্যান্ড
          ctx.fillRect(-92, -28, 4, 18);
          // ক্রিস্টাল এলইডি হেডলাইট
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(102, -4, 5, 0, Math.PI * 2);
          ctx.fill();
          // রিয়ার স্পোর্টস টেললাইট
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(-106, -2, 5, 0, Math.PI * 2);
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    // --- ওয়ার্কশপ রেন্ডারিং ---
    function renderWorkshop() {
      wCtx.clearRect(0, 0, W, H);

      // ১. উপর থেকে আসা উজ্জ্বল স্পটলাইট বিম (Spotlight on Showroom)
      wCtx.save();
      const spotGrad = wCtx.createRadialGradient(stageX, 0, 10, stageX, stageY + 30, W * 0.45);
      spotGrad.addColorStop(0, 'rgba(56, 189, 248, 0.2)');
      spotGrad.addColorStop(1, 'rgba(6, 9, 17, 0)');
      wCtx.fillStyle = spotGrad;
      wCtx.beginPath();
      wCtx.moveTo(stageX - 40, 0);
      wCtx.lineTo(stageX + 40, 0);
      wCtx.lineTo(stageX + W * 0.42, stageY + 50);
      wCtx.lineTo(stageX - W * 0.42, stageY + 50);
      wCtx.closePath();
      wCtx.fill();

      // ২. উজ্জ্বল হাই-টেক শো-রুম প্ল্যাটফর্ম (Clean, Visible Turntable Platform)
      wCtx.fillStyle = '#111827';
      wCtx.beginPath();
      wCtx.ellipse(stageX, stageY + 36, W * 0.42, 28, 0, 0, Math.PI * 2);
      wCtx.fill();

      // প্ল্যাটফর্মের নিয়ন বর্ডার
      wCtx.strokeStyle = '#38bdf8';
      wCtx.lineWidth = 2.5;
      wCtx.stroke();

      // প্ল্যাটফর্মের সেন্ট্রাল গ্রিড লাইন
      wCtx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      wCtx.lineWidth = 1;
      wCtx.beginPath();
      wCtx.ellipse(stageX, stageY + 36, W * 0.26, 17, 0, 0, Math.PI * 2);
      wCtx.stroke();

      // গাড়ির নিচের জীবন্ত নিয়ন আন্ডারগ্লো লাইটিং
      const glowGrad = wCtx.createRadialGradient(stageX, stageY + 30, 10, stageX, stageY + 30, 120);
      glowGrad.addColorStop(0, underglowGlow);
      glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      wCtx.fillStyle = glowGrad;
      wCtx.beginPath();
      wCtx.ellipse(stageX, stageY + 30, 130, 22, 0, 0, Math.PI * 2);
      wCtx.fill();
      wCtx.restore();

      // ৩. প্ল্যাটফর্মে জোড়া লাগা পার্টসগুলো ক্রমানুসারে দৃশ্যমান করা
      wCtx.save();
      wCtx.translate(stageX, stageY);

      // পরবর্তী যে পার্টসটি বসাতে হবে তার হালকা ঘোস্ট গাইড
      if (currentStepIndex < STEPS.length) {
        const nextPart = parts.find(p => p.id === STEPS[currentStepIndex].id);
        if (nextPart) drawPartIcon(wCtx, nextPart, true);
      }

      // অ্যাসেম্বল হওয়া পার্টসগুলো রেন্ডার:
      const hasChassis = parts.find(p => p.id === 'chassis').snapped;
      const hasWheels = parts.find(p => p.id === 'wheels').snapped;
      const hasEngine = parts.find(p => p.id === 'engine').snapped;
      const hasCockpit = parts.find(p => p.id === 'cockpit').snapped;
      const hasBody = parts.find(p => p.id === 'body').snapped;
      const hasSpoiler = parts.find(p => p.id === 'spoiler').snapped;

      if (hasChassis) drawPartIcon(wCtx, { id: 'chassis' });
      if (hasEngine && !hasBody) drawPartIcon(wCtx, { id: 'engine' });
      if (hasCockpit && !hasBody) drawPartIcon(wCtx, { id: 'cockpit' });
      if (hasBody) drawPartIcon(wCtx, { id: 'body' });
      if (hasWheels) drawPartIcon(wCtx, { id: 'wheels' }); // আসল বড় স্পোর্টস চাকা
      if (hasSpoiler) drawPartIcon(wCtx, { id: 'spoiler' });

      wCtx.restore();

      // ৪. নিচের ওয়ার্কশপ শেলফ কন্টেইনার
      wCtx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      wCtx.fillRect(6, H * 0.54, W - 12, H * 0.44);
      wCtx.strokeStyle = '#1e293b';
      wCtx.lineWidth = 1;
      wCtx.strokeRect(6, H * 0.54, W - 12, H * 0.44);

      // ৫. পার্টসগুলোর সুষম ও স্পষ্ট ডিসপ্লে (Clear Slots)
      parts.forEach((p) => {
        if (!p.snapped) {
          const isCurrentStep = (STEPS[currentStepIndex] && STEPS[currentStepIndex].id === p.id);
          wCtx.save();
          wCtx.translate(p.x, p.y);

          // ব্যাকগ্রাউন্ড কার্ড
          wCtx.fillStyle = isCurrentStep ? 'rgba(56, 189, 248, 0.18)' : '#1e293b';
          wCtx.strokeStyle = isCurrentStep ? '#38bdf8' : '#334155';
          wCtx.lineWidth = isCurrentStep ? 2 : 1;
          wCtx.beginPath();
          wCtx.roundRect(-46, -30, 92, 60, 10);
          wCtx.fill();
          wCtx.stroke();

          // পার্টসের সুস্পষ্ট আইকন
          wCtx.save();
          wCtx.scale(0.42, 0.42);
          drawPartIcon(wCtx, p);
          wCtx.restore();

          // নাম
          wCtx.fillStyle = isCurrentStep ? '#38bdf8' : '#cbd5e1';
          wCtx.font = 'bold 11px sans-serif';
          wCtx.textAlign = 'center';
          wCtx.fillText(p.name, 0, 24);

          // তীর ও নোটিফিকেশন ডট
          if (isCurrentStep) {
            wCtx.fillStyle = '#fbbf24';
            wCtx.beginPath();
            wCtx.arc(0, -34, 4, 0, Math.PI * 2);
            wCtx.fill();
          }

          wCtx.restore();
        }
      });

      requestAnimationFrame(renderWorkshop);
    }

    // --- টাচ ও ড্র্যাগ-ড্রপ হ্যান্ডলার ---
    let dragTarget = null;
    let dragOffset = { x: 0, y: 0 };

    function getCoords(e) {
      const rect = wCanvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    wCanvas.addEventListener('touchstart', (e) => {
      const pos = getCoords(e);

      // যদি ওপরের গাড়ির প্ল্যাটফর্মে সরাসরি ট্যাপ করা হয়, তবে গাড়ি খোলা যাবে
      if (Math.hypot(pos.x - stageX, pos.y - stageY) < 70 && currentStepIndex > 0) {
        undoAssemble();
        return;
      }

      // ট্রের পার্টস ড্র্যাগ শুরু
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        if (!p.snapped && Math.hypot(pos.x - p.x, pos.y - p.y) < 46) {
          // ধারাবাহিকতা পরীক্ষা
          if (STEPS[currentStepIndex] && STEPS[currentStepIndex].id !== p.id) {
            document.getElementById('step-hint').innerText = "⚠️ আগে " + STEPS[currentStepIndex].name + " লাগান!";
            document.getElementById('step-hint').style.color = '#f87171';
            playTone(220, 'sawtooth', 0.15, 0.5);
            return;
          }
          dragTarget = p;
          dragOffset.x = pos.x - p.x;
          dragOffset.y = pos.y - p.y;
          break;
        }
      }
    }, { passive: false });

    wCanvas.addEventListener('touchmove', (e) => {
      if (!dragTarget) return;
      e.preventDefault();
      const pos = getCoords(e);
      dragTarget.x = pos.x - dragOffset.x;
      dragTarget.y = pos.y - dragOffset.y;
    }, { passive: false });

    wCanvas.addEventListener('touchend', () => {
      if (!dragTarget) return;
      // প্ল্যাটফর্মের কাছে আনলে স্বয়ংক্রিয় লক হবে
      const dist = Math.hypot(dragTarget.x - stageX, dragTarget.y - stageY);
      if (dist < 90) {
        dragTarget.snapped = true;
        dragTarget.x = stageX;
        dragTarget.y = stageY;
        playSnap();
        currentStepIndex++;
        updateStepHint();
      } else {
        // ভুল জায়গায় দিলে নিজের নির্ধারিত স্লটে ফিরে যাবে
        dragTarget.x = dragTarget.sx;
        dragTarget.y = dragTarget.sy;
      }
      dragTarget = null;
    });

    // --- পপআপ মেনু ও কালার/নিয়ন লজিক ---
    function hidePopups() {
      document.querySelectorAll('.popup-tray').forEach(p => p.classList.remove('show'));
    }

    function togglePopup(id) {
      const el = document.getElementById(id);
      const isShown = el.classList.contains('show');
      hidePopups();
      if (!isShown) el.classList.add('show');
    }

    function pickCarColor(color) {
      carColor = color;
      hidePopups();
    }

    function pickLighting(mode) {
      hidePopups();
      if (mode === 'cyan') {
        underglowColor = '#00f0ff';
        underglowGlow = 'rgba(0, 240, 255, 0.85)';
      } else if (mode === 'magenta') {
        underglowColor = '#ff007f';
        underglowGlow = 'rgba(255, 0, 127, 0.85)';
      } else if (mode === 'lime') {
        underglowColor = '#39ff14';
        underglowGlow = 'rgba(57, 255, 20, 0.85)';
      } else {
        underglowColor = '#ffaa00';
        underglowGlow = 'rgba(255, 170, 0, 0.85)';
      }
    }

    // --- পেজ সুইচ ---
    function openDriveTrack() {
      document.getElementById('workshop-screen').classList.remove('active');
      document.getElementById('drive-screen').classList.add('active');
      initDriveRoad();
    }

    function openWorkshop() {
      document.getElementById('drive-screen').classList.remove('active');
      document.getElementById('workshop-screen').classList.add('active');
      stopEngine();
    }

    // --- টেস্ট ড্রাইভ রোড লজিক ---
    const rCanvas = document.getElementById('roadCanvas');
    const rCtx = rCanvas.getContext('2d');
    let rW, rH, rCarX, rCarY, speed = 0, targetSpeed = 0, roadY = 0, steerAngle = 0;
    let isRunning = false, gear = 1;

    function initDriveRoad() {
      rW = rCanvas.width = rCanvas.parentElement.clientWidth;
      rH = rCanvas.height = rCanvas.parentElement.clientHeight;
      rCarX = rW / 2;
      rCarY = rH * 0.72;
      loopRoad();
    }

    function toggleEngine() {
      isRunning = !isRunning;
      const b = document.getElementById('ignition-btn');
      if (isRunning) {
        b.innerText = "🛑 বন্ধ করুন";
        b.style.background = "#dc2626";
        targetSpeed = 4;
        startMotorSound();
      } else {
        b.innerText = "🔥 ইঞ্জিন স্টার্ট";
        b.style.background = "#ea580c";
        targetSpeed = 0;
        stopEngine();
      }
    }

    function toggleGear() {
      gear = gear === 1 ? 2 : 1;
      document.getElementById('gear-btn').innerText = gear === 1 ? "গিয়ার: D1" : "গিয়ার: S-টার্বো";
    }

    function startMotorSound() {
      try {
        if (aCtx.state === 'suspended') aCtx.resume();
        engineOsc = aCtx.createOscillator();
        const g = aCtx.createGain();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.setValueAtTime(65, aCtx.currentTime);
        g.gain.setValueAtTime(0.12, aCtx.currentTime);
        engineOsc.connect(g);
        g.connect(aCtx.destination);
        engineOsc.start();
      } catch(e) {}
    }

    function stopEngine() {
      if (engineOsc) {
        try { engineOsc.stop(); } catch(e) {}
        engineOsc = null;
      }
      speed = targetSpeed = 0;
    }

    // প্যাডেলস
    const gasBtn = document.getElementById('p-gas');
    const brakeBtn = document.getElementById('p-brake');

    gasBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (isRunning) targetSpeed = 9 * (gear === 1 ? 1 : 1.7);
    });
    gasBtn.addEventListener('touchend', () => {
      if (isRunning) targetSpeed = 4;
    });

    brakeBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      targetSpeed = 0;
    });

    // স্টিয়ারিং
    const wheelEl = document.getElementById('wheel');
    wheelEl.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = wheelEl.getBoundingClientRect();
      const dx = e.touches[0].clientX - (rect.left + rect.width / 2);
      steerAngle = Math.max(-50, Math.min(50, dx * 0.9));
      wheelEl.style.transform = `rotate(${steerAngle}deg)`;
      rCarX += steerAngle * 0.05;
      rCarX = Math.max(rW * 0.22, Math.min(rW * 0.78, rCarX));
    });

    wheelEl.addEventListener('touchend', () => {
      steerAngle = 0;
      wheelEl.style.transform = `rotate(0deg)`;
    });

    function loopRoad() {
      rCtx.clearRect(0, 0, rW, rH);
      speed += (targetSpeed - speed) * 0.08;
      roadY += speed;

      // ঘাস ও সাইড ট্র্যাক
      rCtx.fillStyle = '#064e3b';
      rCtx.fillRect(0, 0, rW, rH);

      // আঁকাবাঁকা সড়ক
      rCtx.fillStyle = '#1e293b';
      rCtx.beginPath();
      rCtx.moveTo(rW * 0.15, 0);
      rCtx.lineTo(rW * 0.85, 0);
      rCtx.lineTo(rW * 0.85, rH);
      rCtx.lineTo(rW * 0.15, rH);
      rCtx.fill();

      // ডিভাইডার লাইন
      rCtx.strokeStyle = '#f8fafc';
      rCtx.lineWidth = 4;
      rCtx.setLineDash([22, 22]);
      rCtx.lineDashOffset = -roadY;
      rCtx.beginPath();
      rCtx.moveTo(rW / 2, 0);
      rCtx.lineTo(rW / 2, rH);
      rCtx.stroke();
      rCtx.setLineDash([]);

      // স্পোর্টস কার টেস্ট ড্রাইভ ভিউ
      rCtx.save();
      rCtx.translate(rCarX, rCarY);
      rCtx.rotate((steerAngle * Math.PI / 180) * 0.4);

      // আন্ডারগ্লো
      rCtx.shadowColor = underglowColor;
      rCtx.shadowBlur = 16;

      // বডি
      rCtx.fillStyle = carColor;
      rCtx.beginPath();
      rCtx.roundRect(-24, -46, 48, 92, 10);
      rCtx.fill();

      // গ্লাস
      rCtx.fillStyle = '#0284c7';
      rCtx.fillRect(-18, -26, 36, 24);

      // জিটি স্পয়লার
      rCtx.fillStyle = '#0f172a';
      rCtx.fillRect(-26, 40, 52, 7);

      // হেডলাইট বিম
      if (isRunning) {
        rCtx.fillStyle = 'rgba(254, 240, 138, 0.4)';
        rCtx.beginPath();
        rCtx.moveTo(-18, -46);
        rCtx.lineTo(-42, -130);
        rCtx.lineTo(42, -130);
        rCtx.lineTo(18, -46);
        rCtx.closePath();
        rCtx.fill();
      }

      rCtx.restore();

      if (document.getElementById('drive-screen').classList.contains('active')) {
        requestAnimationFrame(loopRoad);
      }
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      if (document.getElementById('drive-screen').classList.contains('active')) initDriveRoad();
    });

    resizeCanvas();
    updateStepHint();
    renderWorkshop();
  </script>
</body>
</html>
