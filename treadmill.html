<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no,viewport-fit=cover">
<meta name="description" content="Build a 3D treadmill from 20 colorful parts, then start it and run.">
<title>Treadmill Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b0f19;color:#f8fafc;user-select:none;-webkit-user-select:none;touch-action:none}
main{display:flex;flex-direction:column;width:100%;height:100%;max-width:1400px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;background:#1e293b;border-bottom:1px solid #334155;flex-shrink:0;z-index:20}
h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(1rem,4.2vw,1.5rem);font-weight:900;
background:linear-gradient(90deg,#22d3ee,#a3e635,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;border:0;cursor:pointer;transition:transform .15s}
.pill:active{transform:scale(.95)}
#count{background:#334155;color:#22d3ee;border:1px solid #475569}
#reset{background:#ef4444;color:#fff;box-shadow:0 2px 8px #ef444455}

#boardWrap{flex:0 0 40%;min-height:0;padding:4px 8px;position:relative;z-index:1}
#board{position:absolute;inset:4px 8px;border:2px dashed #22d3ee;border-radius:18px;overflow:hidden;
background:radial-gradient(circle at 50% 25%,#243247 0%,#0c1220 70%,#070b14 100%);transition:background .5s;box-shadow:inset 0 0 40px #00000088;touch-action:none}
#board.night{background:radial-gradient(circle at 50% 30%,#060814 0%,#020408 100%)}
#board svg#scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(13px,3vw,16px);color:#64748b;text-align:center;padding:16px;pointer-events:none}
#ghost{opacity:.09}

#zoomHud{position:absolute;right:8px;top:8px;display:flex;align-items:center;gap:3px;background:#0f172ae6;border:1px solid #334155;border-radius:999px;padding:3px 8px;z-index:40;box-shadow:0 4px 12px #0008;touch-action:auto}
.zbtn{width:24px;height:24px;border-radius:50%;border:0;background:#334155;color:#fff;font-weight:900;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zbtn:active{background:#22d3ee;color:#0f172a}
#zoomVal{font-size:11px;font-weight:800;color:#22d3ee;min-width:34px;text-align:center}
#stats{position:absolute;left:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px;z-index:40;pointer-events:none;max-width:calc(100% - 16px)}
#stats b{background:#0f172ae6;border:1px solid #334155;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:800;color:#e2e8f0;white-space:nowrap}
#stats b i{font-style:normal;color:#22d3ee}

#tray{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:8px 8px;background:#131d2e;border-top:2px solid #334155;flex:1;min-height:0;align-content:center;z-index:10;touch-action:none;overflow-y:auto}
@media(max-width:768px){
  #tray{grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;align-content:start}
}
.slot{height:clamp(50px,9vh,70px);border-radius:10px;background:linear-gradient(180deg,#16213a,#0f172a);border:1px solid #334155;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:grab;touch-action:none;-webkit-touch-callout:none;transition:border-color .15s}
.slot:active{border-color:#22d3ee}
.slot svg{width:100%;height:65%;filter:drop-shadow(0 2px 4px #000a);pointer-events:none}
.slot span{font-size:10px;font-weight:700;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%;margin-top:2px;pointer-events:none}
.slot.gone{opacity:.15;pointer-events:none;border-color:#1e293b}

#controls{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px 8px;background:#0b0f19;border-top:1px solid #1e293b;flex-shrink:0;z-index:20;touch-action:none}
.btns{display:flex;gap:5px;flex-shrink:1;min-width:0}
.cbtn{width:clamp(42px,11.5vw,66px);height:clamp(46px,13vw,66px);border-radius:14px;border:0;color:#fff;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #0008;cursor:pointer;line-height:1.1;touch-action:none}
.cbtn b{font-size:18px}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
#bColor{background:linear-gradient(135deg,#f43f5e,#f59e0b,#10b981,#3b82f6)}
#bLight{background:linear-gradient(135deg,#eab308,#f97316)}
#bSound{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
#bStart{background:linear-gradient(135deg,#22c55e,#15803d)}
#bStart.on{background:linear-gradient(135deg,#ef4444,#991b1b)}

#remote{display:grid;grid-template-columns:repeat(4,clamp(30px,8.5vw,42px));grid-template-rows:repeat(2,clamp(30px,8.5vw,42px));gap:4px;padding:5px;flex-shrink:0;border-radius:16px;background:#1e293b;border:1px solid #334155;box-shadow:0 4px 0 #0008;touch-action:none}
.r{border:0;border-radius:9px;background:#334155;color:#f8fafc;font-size:15px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:none}
.r i{font-style:normal;font-size:8px;font-weight:800;color:#94a3b8;margin-top:1px}
.r:active,.r.act{background:#22d3ee;color:#0f172a}.r:active i,.r.act i{color:#0f172a}
.r.pre{background:#0e7490;font-size:13px}
.r.run{background:#16a34a;color:#fff}.r.run.act{background:#facc15;color:#0f172a}

#drag{position:fixed;pointer-events:none;z-index:9999;filter:drop-shadow(0 10px 20px #000c)}
#msg{position:fixed;left:50%;top:65px;transform:translateX(-50%);background:#0e7490;color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.3px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10000;box-shadow:0 8px 24px #0008;white-space:nowrap}
#measure{position:absolute;left:-9999px;top:0;width:10px;height:10px;visibility:hidden}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes blink2{0%,49%{opacity:.15}50%,100%{opacity:1}}
.bl1{animation:blink .8s infinite}.bl2{animation:blink2 .8s infinite}
</style>
</head>
<body>
<main>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<svg id="measure"><g id="measureG"></g></svg>
<header>
  <h1>🏃 Treadmill Builder</h1>
  <span id="count" class="pill">0 / 20</span>
  <button id="reset" class="pill">Reset</button>
</header>
<div id="boardWrap">
  <div id="board">
    <div id="zoomHud">
      <button class="zbtn" id="zOut" title="Zoom Out">−</button>
      <span id="zoomVal">100%</span>
      <button class="zbtn" id="zIn" title="Zoom In">+</button>
      <button class="zbtn" id="zReset" title="Reset Zoom">↺</button>
    </div>
    <svg id="scene" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="floorShadow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#000" stop-opacity=".55"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1e293b" stop-opacity=".0"/>
          <stop offset="1" stop-color="#1e293b" stop-opacity=".9"/>
        </linearGradient>
      </defs>
      <g id="camera">
        <rect x="-400" y="300" width="1500" height="120" fill="url(#floorG)"/>
        <ellipse cx="350" cy="302" rx="320" ry="16" fill="url(#floorShadow)"/>
        <g id="tilter">
          <g id="ghost"></g>
          <g id="plane"></g>
          <g id="runner"></g>
          <g id="lights"></g>
        </g>
      </g>
    </svg>
    <div id="hint">Drag the 20 parts below here to build the treadmill</div>
    <div id="stats"></div>
  </div>
</div>
<section id="tray"></section>
<div id="controls">
  <div class="btns">
    <button class="cbtn" id="bColor"><b>🎨</b>Color</button>
    <button class="cbtn" id="bLight"><b>💡</b>Light</button>
    <button class="cbtn" id="bSound"><b>🔊</b>Sound</button>
    <button class="cbtn" id="bStart"><b>▶</b>Start</button>
  </div>
  <div id="remote" title="Treadmill Console">
    <button class="r" data-k="spdDown" title="Speed Down">−<i>SPEED</i></button>
    <button class="r" data-k="spdUp" title="Speed Up">+<i>SPEED</i></button>
    <button class="r" data-k="incUp" title="Incline Up">▲<i>INCLINE</i></button>
    <button class="r" data-k="incDown" title="Incline Down">▼<i>INCLINE</i></button>
    <button class="r pre" data-k="p3" title="Walk 3 km/h">3<i>WALK</i></button>
    <button class="r pre" data-k="p6" title="Jog 6 km/h">6<i>JOG</i></button>
    <button class="r pre" data-k="p10" title="Run 10 km/h">10<i>RUN</i></button>
    <button class="r run act" data-k="runner" title="Show / hide runner">🏃<i>RUNNER</i></button>
  </div>
</div>
</main>
<div id="msg"></div>

<script>
// ---------- Mobile gesture guards ----------
document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e => {
  if (e.target.closest('#board') || drag) e.preventDefault();
}, {passive:false});
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 280) e.preventDefault();
  lastTap = now;
}, {passive:false});

// ---------- 3D drawing helpers ----------
const TOTAL = 20;
const VB = {x:30, y:-10, w:690, h:325};
const S = 'stroke="#0a0f1c" stroke-width="1.6" stroke-linejoin="round"';
const g = (c, v='') => `url(#g-${c}${v})`;
const DEPTH = d => [d*.8, -d*.5];
const P = a => a.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function hull(pts){
  pts = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
// Box with front, top and side faces
function box(x,y,w,h,c,d=14,rx=2){
  const [ox,oy] = DEPTH(d);
  return `<polygon points="${P([[x+w,y],[x+w+ox,y+oy],[x+w+ox,y+h+oy],[x+w,y+h]])}" fill="${g(c,'S')}" ${S}/>`+
    `<polygon points="${P([[x,y],[x+ox,y+oy],[x+w+ox,y+oy],[x+w,y]])}" fill="${g(c,'T')}" ${S}/>`+
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${g(c)}" ${S}/>`+
    (h>5 ? `<rect x="${x+w*.05}" y="${y+h*.14}" width="${w*.9}" height="${Math.max(1.2,h*.12)}" rx="1" fill="#fff" opacity=".3"/>` : '');
}
// Any convex shape extruded into depth
function ext(pts,c,d=14){
  const [ox,oy] = DEPTH(d);
  const back = pts.map(p => [p[0]+ox, p[1]+oy]);
  return `<polygon points="${P(hull(pts.concat(back)))}" fill="${g(c,'S')}" ${S}/><polygon points="${P(pts)}" fill="${g(c)}" ${S}/>`;
}
function beam(x1,y1,x2,y2,w,c,d=10){
  const L = Math.hypot(x2-x1,y2-y1), nx = -(y2-y1)/L*w/2, ny = (x2-x1)/L*w/2;
  return ext([[x1+nx,y1+ny],[x2+nx,y2+ny],[x2-nx,y2-ny],[x1-nx,y1-ny]], c, d);
}
// Cylinder seen from the side (wheel / roller)
function disc(cx,cy,r,c,d=12){
  const [ox,oy] = DEPTH(d), L = Math.hypot(ox,oy), nx = -oy/L*r, ny = ox/L*r;
  return `<circle cx="${cx+ox}" cy="${cy+oy}" r="${r}" fill="${g(c,'S')}" ${S}/>`+
    `<polygon points="${P([[cx+nx,cy+ny],[cx+ox+nx,cy+oy+ny],[cx+ox-nx,cy+oy-ny],[cx-nx,cy-ny]])}" fill="${g(c,'S')}"/>`+
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${g(c,'R')}" ${S}/>`;
}
const spokes = (cx,cy,r,anim) => `<g data-anim="${anim}" data-c="${cx},${cy}"><path d="M${cx-r*.78},${cy}H${cx+r*.78}M${cx},${cy-r*.78}V${cy+r*.78}" stroke="#0a0f1c" stroke-width="${Math.max(1.5,r*.2)}" stroke-linecap="round"/></g><circle cx="${cx}" cy="${cy}" r="${r*.26}" fill="#e2e8f0" ${S}/>`;
const blades = (cx,cy,r) => `<g data-anim="fan" data-c="${cx},${cy}">${[0,72,144,216,288].map(a=>`<ellipse cx="${cx}" cy="${cy-r*.5}" rx="${r*.22}" ry="${r*.48}" fill="#e2e8f0" opacity=".9" transform="rotate(${a} ${cx} ${cy})"/>`).join('')}</g><circle cx="${cx}" cy="${cy}" r="${r*.22}" fill="#0f172a"/>`;

// ---------- 20 Treadmill Parts (render order = depth order) ----------
const PARTS = [
 {id:11, n:"Rear Upright", a: beam(590,256,624,96,14,'dark',12)},
 {id:16, n:"Rear Handrail", a: beam(616,142,488,150,9,'silver',8)+`<circle cx="488" cy="150" r="5" fill="${g('dark','R')}" ${S}/>`},
 {id:1,  n:"Base Frame", a: box(70,262,500,18,'steel',22,3)},
 {id:8,  n:"Rubber Feet", a: box(64,280,44,14,'dark',22,4)+box(300,280,34,12,'dark',22,4)},
 {id:9,  n:"Transport Wheels", a: disc(590,286,13,'dark',20)+spokes(590,286,13,'wheel')},
 {id:2,  n:"Deck Board", a: box(84,248,470,14,'orange',22,3)},
 {id:5,  n:"Rear Roller", a: disc(92,247,11,'silver',22)+spokes(92,247,11,'roll')},
 {id:4,  n:"Front Roller", a: disc(546,247,11,'silver',22)+spokes(546,247,11,'roll')},
 {id:3,  n:"Running Belt", a: box(92,238,456,9,'black',22,3)+
   `<line data-anim="belt" x1="104" y1="232" x2="560" y2="232" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 15" opacity=".8"/>`+
   `<line data-anim="belt" x1="96" y1="242.5" x2="546" y2="242.5" stroke="#64748b" stroke-width="2" stroke-dasharray="10 12"/>`},
 {id:7,  n:"Side Step Trim", a: box(98,251,410,7,'lime',3,2)},
 {id:6,  n:"Motor Hood", a: box(516,224,74,42,'red',24,9)+[0,1,2,3].map(i=>`<rect x="${528+i*13}" y="242" width="7" height="14" rx="2" fill="#0a0f1c" opacity=".55"/>`).join('')},
 {id:10, n:"Upright Post", a: beam(568,250,602,100,16,'steel',14)},
 {id:15, n:"Handrail", a: beam(596,148,466,158,10,'silver',10)+`<circle cx="466" cy="158" r="6" fill="${g('dark','R')}" ${S}/>`},
 {id:17, n:"Heart-Rate Grips", a: `<g transform="rotate(-4.4 500 156)">`+box(484,151,44,11,'pink',8,5)+`<rect x="494" y="152.5" width="8" height="8" rx="1" fill="${g('silver')}" ${S}/><rect x="510" y="152.5" width="8" height="8" rx="1" fill="${g('silver')}" ${S}/></g>`},
 {id:12, n:"Console Panel", a: ext([[566,96],[670,70],[680,104],[576,130]],'indigo',18)},
 {id:13, n:"LCD Display", a: `<g transform="rotate(-14 624 100)"><rect x="592" y="89" width="64" height="22" rx="3" fill="#06281f" ${S}/><text data-lcd="spd" x="607" y="105" font-size="12" font-weight="900" fill="#4ade80" font-family="monospace" text-anchor="middle">0.0</text><text data-lcd="time" x="640" y="104" font-size="8" font-weight="800" fill="#4ade80" font-family="monospace" text-anchor="middle">00:00</text><rect x="594" y="91" width="60" height="3" rx="1" fill="#fff" opacity=".18"/></g>`},
 {id:14, n:"Control Buttons", a: [[582,121,'red'],[594,118,'green'],[656,103,'blue'],[668,100,'yellow']].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="4.6" fill="${g(c,'R')}" ${S}/>`).join('')},
 {id:20, n:"Cooling Fan", a: disc(626,66,11,'teal',8)+blades(626,66,11)},
 {id:18, n:"Safety Key", a: `<path d="M664 112 Q672 150 640 168" stroke="#facc15" stroke-width="2" fill="none"/><rect x="657" y="104" width="14" height="10" rx="3" fill="${g('yellow')}" ${S}/><circle cx="640" cy="168" r="4" fill="${g('red','R')}" ${S}/>`},
 {id:19, n:"Cup Holder", a: box(674,96,22,18,'lime',10,4)+`<ellipse cx="690" cy="92" rx="9" ry="3" fill="#0a0f1c" opacity=".55"/>`},
];

// ---------- Colors & Themes ----------
const BASE = {red:"#ef4444",blue:"#38bdf8",cyan:"#22d3ee",orange:"#f97316",yellow:"#facc15",green:"#22c55e",steel:"#64748b",purple:"#a855f7",pink:"#ec4899",gold:"#f59e0b",teal:"#14b8a6",lime:"#84cc16",indigo:"#6366f1",dark:"#1e293b",silver:"#cbd5e1",coral:"#fb7185",black:"#111827"};
const THEMES = [
 {name:"Rainbow Run", map:{}},
 {name:"Pro Black Red", map:{orange:"#27272a",steel:"#3f3f46",indigo:"#18181b",lime:"#dc2626",red:"#dc2626",teal:"#dc2626",pink:"#b91c1c",coral:"#ef4444"}},
 {name:"Ocean Blue", map:{orange:"#1e3a8a",steel:"#1d4ed8",indigo:"#0c4a6e",lime:"#38bdf8",red:"#0ea5e9",teal:"#22d3ee",pink:"#2563eb",coral:"#38bdf8"}},
 {name:"Fitness Lime", map:{orange:"#365314",steel:"#4d7c0f",indigo:"#1a2e05",lime:"#a3e635",red:"#84cc16",teal:"#bef264",pink:"#65a30d",coral:"#a3e635"}},
 {name:"Rose Gold", map:{orange:"#b45309",steel:"#d6a77a",indigo:"#7c2d12",lime:"#fda4af",red:"#e11d48",teal:"#f9a8d4",pink:"#fb7185",coral:"#f472b6"}},
 {name:"Arctic White", map:{orange:"#e2e8f0",steel:"#f1f5f9",indigo:"#94a3b8",lime:"#38bdf8",red:"#f8fafc",teal:"#0ea5e9",pink:"#0284c7",coral:"#0ea5e9"}},
];
const defs = document.getElementById('defs');
let curMap = {...BASE};
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function paint(t){
  curMap = {...BASE, ...THEMES[t].map};
  defs.innerHTML = Object.entries(curMap).map(([k,c]) =>
    `<linearGradient id="g-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#ffffff',.5)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,'#000000',.4)}"/></linearGradient>`+
    `<linearGradient id="g-${k}T" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${mix(c,'#ffffff',.6)}"/><stop offset="1" stop-color="${mix(c,'#ffffff',.22)}"/></linearGradient>`+
    `<linearGradient id="g-${k}S" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mix(c,'#000000',.32)}"/><stop offset="1" stop-color="${mix(c,'#000000',.6)}"/></linearGradient>`+
    `<radialGradient id="g-${k}R" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${mix(c,'#ffffff',.65)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,'#000000',.5)}"/></radialGradient>`
  ).join('');
}
paint(0);

// Measure each part so tray icons and drag previews fit exactly
const measureG = document.getElementById('measureG');
PARTS.forEach(p => { measureG.innerHTML = p.a; const b = measureG.getBBox(); p.b = [b.x-3, b.y-3, b.width+6, b.height+6]; });
measureG.innerHTML = '';

const TRAY = [10,17,3,8,12,15,1,9,20,4,13,16,11,6,19,7,2,14,5,18];
const $ = id => document.getElementById(id);
const scene=$('scene'), plane=$('plane'), board=$('board'), tray=$('tray'), ghost=$('ghost');
scene.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);

// ---------- Zoom (board only) ----------
let zoom=1, panX=0, panY=0;
function updateCamera(){
  zoom = Math.max(0.8, Math.min(3.5, zoom));
  const cx = VB.x+VB.w/2, cy = VB.y+VB.h/2;
  $('camera').setAttribute('transform', `translate(${panX} ${panY}) translate(${cx} ${cy}) scale(${zoom}) translate(${-cx} ${-cy})`);
  $('zoomVal').textContent = Math.round(zoom*100)+'%';
}
$('zIn').onclick = () => { zoom=Math.min(3.5,zoom+0.25); updateCamera(); msg('Zoom: '+Math.round(zoom*100)+'%'); };
$('zOut').onclick = () => { zoom=Math.max(0.8,zoom-0.25); updateCamera(); msg('Zoom: '+Math.round(zoom*100)+'%'); };
$('zReset').onclick = () => { zoom=1; panX=0; panY=0; updateCamera(); msg('Zoom Reset'); };
board.addEventListener('wheel', e => { e.preventDefault(); zoom += e.deltaY<0 ? 0.15 : -0.15; updateCamera(); }, {passive:false});
let boardTouches = new Map(), initialDist = null, initialZoom = 1;
board.addEventListener('touchstart', e => {
  if (drag) return;
  for (const t of e.changedTouches) boardTouches.set(t.identifier, {x:t.clientX, y:t.clientY});
  if (boardTouches.size === 2){ const p=[...boardTouches.values()]; initialDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); initialZoom=zoom; }
}, {passive:true});
board.addEventListener('touchmove', e => {
  if (drag) return;
  for (const t of e.changedTouches) boardTouches.set(t.identifier, {x:t.clientX, y:t.clientY});
  if (boardTouches.size === 2 && initialDist){ e.preventDefault(); const p=[...boardTouches.values()]; zoom=initialZoom*Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/initialDist; updateCamera(); }
}, {passive:false});
const clearBoardTouch = e => { for (const t of e.changedTouches) boardTouches.delete(t.identifier); if (boardTouches.size<2) initialDist=null; };
board.addEventListener('touchend', clearBoardTouch);
board.addEventListener('touchcancel', clearBoardTouch);

function fit(){ const r=board.getBoundingClientRect(); const s=Math.min(r.width/VB.w, r.height/VB.h); return {r,s}; }

// ---------- Drag & Drop Parts ----------
let placed = new Set();
let drag = null, dragEl = null;
function buildTray(){
  tray.innerHTML = '';
  TRAY.forEach(id => {
    const p = PARTS.find(q => q.id===id);
    const d = document.createElement('div');
    d.className = 'slot'+(placed.has(id)?' gone':'');
    d.dataset.id = id;
    d.innerHTML = `<svg viewBox="${p.b.join(' ')}">${p.a}</svg><span>${p.n}</span>`;
    d.addEventListener('touchstart', e => { if (placed.has(id)||drag) return; e.preventDefault(); const t=e.changedTouches[0]; initDrag(id,t.clientX,t.clientY,t.identifier); }, {passive:false});
    d.addEventListener('mousedown', e => { if (e.button!==0||placed.has(id)||drag) return; e.preventDefault(); initDrag(id,e.clientX,e.clientY,null); });
    tray.appendChild(d);
  });
}
function initDrag(id, x, y, touchId){
  const p = PARTS.find(q => q.id===id);
  const {s} = fit();
  drag = {id, x, y, touchId};
  let w = Math.max(48, p.b[2]*s*zoom*1.15), h = Math.max(48, p.b[3]*s*zoom*1.15);
  const k = Math.min(1, 280/w, 220/h); w*=k; h*=k;
  dragEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
  dragEl.id = 'drag';
  dragEl.setAttribute('viewBox', p.b.join(' '));
  dragEl.setAttribute('width', w); dragEl.setAttribute('height', h);
  dragEl.innerHTML = p.a;
  document.body.appendChild(dragEl);
  const slot = tray.querySelector(`[data-id="${id}"]`); if (slot) slot.classList.add('gone');
  moveDrag(x, y);
}
function moveDrag(x, y){
  if (!drag||!dragEl) return;
  drag.x=x; drag.y=y;
  dragEl.style.left = (x - parseFloat(dragEl.getAttribute('width'))/2)+'px';
  dragEl.style.top  = (y - parseFloat(dragEl.getAttribute('height'))/2)+'px';
}
const touchOf = e => drag && drag.touchId!==null ? [...e.changedTouches].find(t => t.identifier===drag.touchId) : null;
window.addEventListener('touchmove', e => { const t=touchOf(e); if (t){ e.preventDefault(); moveDrag(t.clientX,t.clientY); } }, {passive:false});
window.addEventListener('touchend', e => { const t=touchOf(e); if (t) finishDrag(t.clientX,t.clientY); });
window.addEventListener('touchcancel', e => { const t=touchOf(e); if (t) finishDrag(t.clientX,t.clientY); });
window.addEventListener('mousemove', e => { if (drag && drag.touchId===null){ e.preventDefault(); moveDrag(e.clientX,e.clientY); } });
window.addEventListener('mouseup', e => { if (drag && drag.touchId===null) finishDrag(e.clientX,e.clientY); });
function finishDrag(x, y){
  if (!drag) return;
  const p = PARTS.find(q => q.id===drag.id);
  const {r} = fit();
  if (x>=r.left && x<=r.right && y>=r.top && y<=r.bottom){ placed.add(drag.id); renderMachine(); msg('Fitted: '+p.n); }
  else { const slot = tray.querySelector(`[data-id="${drag.id}"]`); if (slot) slot.classList.remove('gone'); }
  if (dragEl){ dragEl.remove(); dragEl=null; }
  drag = null;
}
function renderMachine(){
  plane.innerHTML = PARTS.filter(p => placed.has(p.id)).map(p => `<g data-pid="${p.id}">${p.a}</g>`).join('');
  ghost.innerHTML = placed.size<TOTAL ? PARTS.filter(p => !placed.has(p.id)).map(p => p.a).join('') : '';
  $('count').textContent = placed.size+' / '+TOTAL;
  $('hint').style.display = placed.size ? 'none' : 'flex';
  updateLights();
}

const msg = t => { const m=$('msg'); m.textContent=t; m.style.opacity=1; clearTimeout(msg.t); msg.t=setTimeout(()=>m.style.opacity=0,1400); };

// ---------- 1 Color ----------
let theme = 0;
$('bColor').onclick = () => { theme=(theme+1)%THEMES.length; paint(theme); buildTray(); msg('🎨 '+THEMES[theme].name); };

// ---------- 2 Light ----------
const LIGHTS = ["Lights Off","Console Glow","LED Deck Strip","Neon Aura","Night Gym"];
let light = 0;
$('bLight').onclick = () => { light=(light+1)%LIGHTS.length; updateLights(); msg('💡 '+LIGHTS[light]); };
function updateLights(){
  let h = '';
  board.classList.toggle('night', light===4);
  plane.style.filter = light===3 ? 'drop-shadow(0 0 9px hsl('+(Date.now()/10%360)+',100%,60%))' : '';
  if ((light===1||light===4) && placed.has(12)){
    h += `<polygon points="566,96 670,70 680,104 576,130" fill="#22d3ee" opacity=".35" filter="url(#glow)"/>`+
         `<circle class="bl1" cx="582" cy="121" r="4" fill="#fff"/><circle class="bl2" cx="668" cy="100" r="4" fill="#fff"/>`;
  }
  if ((light===2||light===4) && placed.has(2)){
    h += `<rect x="92" y="261" width="456" height="3" rx="1.5" fill="#22d3ee" filter="url(#glow)"/>`+
         `<ellipse cx="320" cy="300" rx="250" ry="8" fill="#22d3ee" opacity=".25" filter="url(#glow)"/>`;
  }
  $('lights').innerHTML = h;
}
setInterval(() => { if (light===3) updateLights(); }, 60);

// ---------- 3 Start & Console ----------
const RULES = {minSpeed:0.5, maxSpeed:18, step:0.5, maxIncline:12};
let started=false, target=0, speed=0, incline=0, incNow=0, runnerOn=true;
let beltPos=0, roll=0, fanRot=0, elapsed=0, dist=0, kcal=0, phi=0, lastStep=0;
$('bStart').onclick = () => {
  if (placed.size<TOTAL){ msg('Assemble all '+TOTAL+' parts first!'); return; }
  started = !started;
  $('bStart').classList.toggle('on', started);
  $('bStart').innerHTML = started ? '<b>■</b>Stop' : '<b>▶</b>Start';
  if (started){ target = Math.max(target, 3); ensureAudio(); } else { target = 0; }
  msg(started ? '🏃 Treadmill Running!' : 'Treadmill Stopping');
};
function setSpeed(v){ target = Math.round(Math.max(RULES.minSpeed, Math.min(RULES.maxSpeed, v))*10)/10; msg('Speed: '+target.toFixed(1)+' km/h'); }
function setIncline(v){ incline = Math.max(0, Math.min(RULES.maxIncline, v)); msg('Incline: '+incline+'%'); }
const ACTIONS = {
  spdUp:   () => setSpeed(target+RULES.step),
  spdDown: () => setSpeed(target-RULES.step),
  incUp:   () => setIncline(incline+1),
  incDown: () => setIncline(incline-1),
  p3: () => setSpeed(3), p6: () => setSpeed(6), p10: () => setSpeed(10),
};
document.querySelectorAll('.r').forEach(b => {
  const k = b.dataset.k;
  if (k==='runner'){
    b.onclick = () => { runnerOn=!runnerOn; b.classList.toggle('act', runnerOn); msg(runnerOn?'Runner: On':'Runner: Off'); };
    return;
  }
  let rep = null;
  const stop = () => { clearInterval(rep); clearTimeout(rep); rep=null; b.classList.remove('act'); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!started){ msg('Press Start first!'); return; }
    b.classList.add('act'); ACTIONS[k]();
    if (k.startsWith('spd')||k.startsWith('inc')) rep = setTimeout(() => { rep = setInterval(ACTIONS[k], 140); }, 380);
  });
  b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
});
const KEY = {ArrowUp:'spdUp',KeyW:'spdUp',ArrowDown:'spdDown',KeyS:'spdDown',ArrowRight:'incUp',KeyD:'incUp',ArrowLeft:'incDown',KeyA:'incDown'};
addEventListener('keydown', e => { if (KEY[e.code] && started) ACTIONS[KEY[e.code]](); if (e.code==='Space'){ e.preventDefault(); $('bStart').click(); } });

// ---------- Runner ----------
const runnerEl = $('runner');
function drawRunner(t){
  const walk = speed < 6.5, amp = walk ? .38+speed*.03 : .62, bob = Math.abs(Math.sin(phi))*(walk?1.5:4);
  const hx = 360, hy = 158 - bob, lean = walk ? .04 : .14;
  const sx = hx + Math.sin(lean)*50, sy = hy - Math.cos(lean)*50;
  const skin = '#f2c29b', shirt = curMap.coral, shorts = '#1f2937', shoe = '#f8fafc';
  const leg = (p, shade) => {
    const a = Math.sin(p)*amp, knee = .15 + (walk?.6:1.25)*Math.max(0, Math.sin(p - 1.2));
    const kx = hx + Math.sin(a)*40, ky = hy + Math.cos(a)*40;
    const fx = kx + Math.sin(a-knee)*40, fy = ky + Math.cos(a-knee)*40;
    return `<path d="M${hx},${hy} L${kx.toFixed(1)},${ky.toFixed(1)} L${fx.toFixed(1)},${fy.toFixed(1)}" stroke="${shade?mix(skin,'#000000',.25):skin}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`+
      `<path d="M${(fx-3).toFixed(1)},${(fy+1).toFixed(1)} l13,0" stroke="${shade?'#cbd5e1':shoe}" stroke-width="7" stroke-linecap="round"/>`+
      `<path d="M${hx},${hy} L${(hx+Math.sin(a)*18).toFixed(1)},${(hy+Math.cos(a)*18).toFixed(1)}" stroke="${shorts}" stroke-width="12" stroke-linecap="round"/>`;
  };
  const arm = (p, shade) => {
    const a = -Math.sin(p)*amp*.95;
    const ex = sx + Math.sin(a)*24, ey = sy + Math.cos(a)*24;
    const wx = ex + Math.sin(a+1.5)*22, wy = ey + Math.cos(a+1.5)*22;
    return `<path d="M${sx.toFixed(1)},${sy.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)} L${wx.toFixed(1)},${wy.toFixed(1)}" stroke="${shade?mix(skin,'#000000',.25):skin}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  };
  runnerEl.innerHTML =
    leg(phi+Math.PI, true) + arm(phi+Math.PI, true) +
    `<path d="M${hx},${hy} L${sx.toFixed(1)},${sy.toFixed(1)}" stroke="${shirt}" stroke-width="20" stroke-linecap="round"/>`+
    `<path d="M${hx-4},${hy-14} L${(sx-4).toFixed(1)},${(sy+4).toFixed(1)}" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".35"/>`+
    `<circle cx="${(sx+5).toFixed(1)}" cy="${(sy-17).toFixed(1)}" r="12" fill="${skin}" stroke="#0a0f1c" stroke-width="1.4"/>`+
    `<path d="M${(sx-7).toFixed(1)},${(sy-20).toFixed(1)} q10,-14 24,-2" stroke="#1f2937" stroke-width="6" stroke-linecap="round" fill="none"/>`+
    leg(phi, false) + arm(phi, false);
}

// ---------- Animation Loop ----------
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
let last = performance.now();
function loop(t){
  const dt = Math.min(.05, (t-last)/1000); last = t;
  const tgt = started ? target : 0;
  speed += (tgt-speed)*Math.min(1, dt*2.2);
  if (!started && speed<0.03) speed = 0;
  incNow += ((started?incline:0)-incNow)*Math.min(1, dt*2);
  beltPos += speed*dt*24;
  roll += speed*dt*140;
  fanRot += (started?1:0)*dt*1100;
  if (speed>0.3){ elapsed+=dt; dist+=speed*dt/3600; kcal+=speed*dt/3600*62*(1+incNow*.06); }

  plane.querySelectorAll('[data-anim]').forEach(el => {
    const k = el.dataset.anim;
    if (k==='belt') el.setAttribute('stroke-dashoffset', beltPos.toFixed(1));
    else if (k==='roll'){ const c=el.dataset.c.split(','); el.setAttribute('transform', `rotate(${-roll} ${c[0]} ${c[1]})`); }
    else if (k==='fan'){ const c=el.dataset.c.split(','); el.setAttribute('transform', `rotate(${fanRot} ${c[0]} ${c[1]})`); }
  });
  plane.querySelectorAll('[data-lcd="spd"]').forEach(el => el.textContent = speed.toFixed(1));
  plane.querySelectorAll('[data-lcd="time"]').forEach(el => el.textContent = fmt(elapsed));
  $('tilter').setAttribute('transform', `rotate(${(-incNow*.85).toFixed(2)} 90 296)`);

  if (started && runnerOn && speed>0.4){
    const f = speed<6.5 ? .9+speed*.08 : 1.25+speed*.05;
    const prev = Math.sin(phi);
    phi += dt*Math.PI*2*f;
    if (Math.sign(Math.sin(phi)) !== Math.sign(prev)) step();
    drawRunner(t);
  } else if (runnerEl.innerHTML) runnerEl.innerHTML = '';

  $('stats').innerHTML = placed.size===TOTAL
    ? `<b>⚡ <i>${speed.toFixed(1)}</i> km/h</b><b>⛰ <i>${Math.round(incNow)}</i>%</b><b>⏱ <i>${fmt(elapsed)}</i></b><b>📏 <i>${dist.toFixed(2)}</i> km</b><b>🔥 <i>${Math.round(kcal)}</i> kcal</b>`
    : '';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$('reset').onclick = () => {
  placed=new Set(); started=false; target=speed=0; incline=incNow=0; elapsed=dist=kcal=0; phi=0;
  $('bStart').classList.remove('on'); $('bStart').innerHTML='<b>▶</b>Start';
  buildTray(); renderMachine(); msg('Workspace Reset');
};
buildTray();
renderMachine();
updateCamera();

// ---------- Sound: motor hum, belt whoosh, footsteps ----------
let snd=true, actx=null, J=null;
function ensureAudio(){
  if (actx){ actx.resume(); return; }
  const A = window.AudioContext||window.webkitAudioContext; if (!A) return;
  actx = new A();
  const master = actx.createGain(); master.gain.value=0; master.connect(actx.destination);
  const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
  const ng = actx.createGain(); ng.gain.value=.35; src.connect(lp); lp.connect(ng); ng.connect(master);
  const motor = actx.createOscillator(); motor.type='sawtooth'; motor.frequency.value=50;
  const mlp = actx.createBiquadFilter(); mlp.type='lowpass'; mlp.frequency.value=420;
  const mg = actx.createGain(); mg.gain.value=.16; motor.connect(mlp); mlp.connect(mg); mg.connect(master);
  const whine = actx.createOscillator(); whine.type='sine'; whine.frequency.value=900;
  const wg = actx.createGain(); wg.gain.value=.025; whine.connect(wg); wg.connect(master);
  src.start(); motor.start(); whine.start();
  J = {master, lp, motor, whine};
}
function step(){
  if (!actx||!snd) return;
  const now = actx.currentTime; if (now-lastStep<.12) return; lastStep = now;
  const o = actx.createOscillator(), gg = actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(130,now); o.frequency.exponentialRampToValueAtTime(45,now+.12);
  gg.gain.setValueAtTime(.0001,now); gg.gain.exponentialRampToValueAtTime(.35,now+.01); gg.gain.exponentialRampToValueAtTime(.0001,now+.16);
  o.connect(gg); gg.connect(actx.destination); o.start(now); o.stop(now+.18);
}
function updSound(){
  if (!actx||!J) return;
  const t = actx.currentTime, v = (snd && speed>0.05) ? .5 : 0;
  J.master.gain.setTargetAtTime(v, t, .25);
  J.motor.frequency.setTargetAtTime(45+speed*9, t, .3);
  J.whine.frequency.setTargetAtTime(700+speed*120, t, .3);
  J.lp.frequency.setTargetAtTime(220+speed*90, t, .3);
}
$('bSound').onclick = () => { ensureAudio(); snd=!snd; $('bSound').innerHTML = snd?'<b>🔊</b>Sound':'<b>🔇</b>Muted'; updSound(); msg(snd?'Sound Enabled':'Sound Muted'); };
document.addEventListener('click', () => { if (started) ensureAudio(); updSound(); }, true);
setInterval(updSound, 120);
</script>
</body>
