<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ultrasound Machine Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#0d1b2a;color:#e8f1ff}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 14px 6px;background:linear-gradient(90deg,#0b3d5c,#126e82,#0b3d5c);box-shadow:0 2px 12px #0008;text-align:center}
header h1{font-size:19px;letter-spacing:2px;font-weight:800;text-transform:uppercase;background:linear-gradient(90deg,#9ff3ff,#fff,#9ff3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
header small{font-size:11px;letter-spacing:3px;color:#bfe9f2}
#bar{height:6px;background:#ffffff22;border-radius:4px;margin:6px 0 0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#4ade80);transition:width .3s}
#stage{flex:1;position:relative;min-height:0;background:radial-gradient(ellipse at 50% 40%,#1e3a52,#0d1b2a 75%)}
#stage.light{background:radial-gradient(ellipse at 50% 40%,#ffffff,#d9e4ee 80%)}
#machine{width:100%;height:100%;display:block}
#tray{height:128px;background:#0a1622;border-top:2px solid #22d3ee55;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px;touch-action:pan-x}
.tile{flex:0 0 92px;height:108px;border-radius:12px;background:#13283b;border:2px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;box-shadow:0 0 10px var(--c) inset}
.tile svg{width:76px;height:72px;pointer-events:none}
.tile span{font-size:10px;font-weight:700;color:#fff;margin-top:3px;text-align:center;line-height:1.1;pointer-events:none}
nav{display:flex;gap:6px;padding:8px;background:#06101a}
nav button{flex:1;padding:11px 4px;border:0;border-radius:12px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(180deg,#1f4e6e,#123247);box-shadow:0 3px 0 #061a28,0 0 0 1px #2dd4ff44 inset;letter-spacing:.5px}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #061a28}
#pwr{background:linear-gradient(180deg,#555,#333)}
#pwr.ready{background:linear-gradient(180deg,#22c55e,#15803d);animation:pulse 1.2s infinite}
#pwr.on{background:linear-gradient(180deg,#ef4444,#b91c1c)}
@keyframes pulse{50%{box-shadow:0 0 18px #4ade80}}
#drag{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 12px #000a) drop-shadow(0 0 6px var(--c));display:none}
#ring{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px #22d3ee;pointer-events:none;z-index:49;display:none}
#cc{position:fixed;right:10px;bottom:70px;width:250px;background:#0f2233f2;border:1px solid #22d3ee66;border-radius:16px;padding:14px;z-index:40;display:none;box-shadow:0 10px 30px #000a}
#cc h3{font-size:14px;letter-spacing:2px;margin-bottom:10px;color:#7dd3fc}
#cc label{font-size:12px;display:block;margin:8px 0 4px;color:#cbd5e1}
.sw{display:flex;gap:8px}
.sw b{width:34px;height:34px;border-radius:50%;border:3px solid #fff3}
.sw b.act{border-color:#22d3ee}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{flex:1;padding:8px;border:0;border-radius:10px;background:#1e3a52;color:#fff;font-weight:700;font-size:12px}
.row button.act{background:#0891b2}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#16a34a;padding:10px 18px;border-radius:20px;font-weight:800;display:none;z-index:60;box-shadow:0 4px 16px #0008}
.placed{animation:pop .35s}
@keyframes pop{0%{opacity:.3}60%{opacity:1;filter:brightness(1.6)}100%{filter:none}}
</style>
</head>
<body>
<div id="app">
<header><h1>Digital Ultrasound Machine</h1><small>DRAG &amp; ASSEMBLE · 20 PARTS</small><div id="bar"><i></i></div></header>
<div id="stage"><svg id="machine" viewBox="40 20 360 580" preserveAspectRatio="xMidYMid meet"></svg></div>
<div id="tray"></div>
<nav>
<button id="bReset">↺ Reset</button>
<button id="bHint">◎ Hint</button>
<button id="bCC">⚙ Control</button>
<button id="pwr">⏻ Power</button>
</nav>
</div>
<div id="drag"></div><div id="ring"></div><div id="toast"></div>
<div id="cc">
<h3>CONTROL CENTER</h3>
<label>Machine Color</label>
<div class="sw" id="colors"></div>
<label>Background</label>
<div class="row"><button data-bg="dark" class="act">Dark</button><button data-bg="light">Light</button></div>
<label>Placement Guide</label>
<div class="row"><button data-g="1" class="act">On</button><button data-g="0">Off</button></div>
<label>Assembly</label>
<div class="row"><button id="auto">Auto Build</button><button id="shuf">Shuffle</button></div>
<label>Scan Mode (when ON)</label>
<div class="row"><button data-m="b" class="act">B-Mode</button><button data-m="c">Color</button></div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const COLORS={White:["#ffffff","#e4e9ee","#b9c3cc"],Grey:["#d7dbe0","#aeb5bd","#7f8892"],Sky:["#e8f6ff","#b8dcf2","#7fb2d4"],Mint:["#effcf7","#c2eadb","#86c7ad"]};
const DEFS=`<defs>
<linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="var(--b2)"/><stop offset=".35" stop-color="var(--b1)"/><stop offset="1" stop-color="var(--b3)"/></linearGradient>
<linearGradient id="bodyV" y1="0" y2="1" x1="0" x2="0"><stop offset="0" stop-color="var(--b1)"/><stop offset="1" stop-color="var(--b3)"/></linearGradient>
<linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#8a939c"/><stop offset=".5" stop-color="#d9dee3"/><stop offset="1" stop-color="#6b737b"/></linearGradient>
<linearGradient id="dark" y1="0" y2="1" x1="0" x2="0"><stop offset="0" stop-color="#5a6470"/><stop offset="1" stop-color="#2c333b"/></linearGradient>
<linearGradient id="teal" x1="0" x2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset=".5" stop-color="#b8f5f2"/><stop offset="1" stop-color="#2fa3a8"/></linearGradient>
<radialGradient id="glass" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#2b3540"/><stop offset="1" stop-color="#05080b"/></radialGradient>
<radialGradient id="tire" cx=".4" cy=".35"><stop offset="0" stop-color="#666"/><stop offset="1" stop-color="#111"/></radialGradient>
<radialGradient id="scan" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#999" stop-opacity=".5"/><stop offset="1" stop-color="#222" stop-opacity=".2"/></radialGradient>
</defs>`;
// z order = array order
const PARTS=[
{id:"vent",n:"Rear Vent",c:"#f97316",s:`<rect x="112" y="440" width="96" height="44" rx="6" fill="url(#dark)"/>${[0,1,2,3,4,5].map(i=>`<rect x="118" y="${446+i*6.3}" width="84" height="3" rx="1.5" fill="#1a1f25"/>`).join("")}`},
{id:"legs",n:"Base Legs",c:"#a855f7",s:`<g stroke="url(#metal)" stroke-width="24" stroke-linecap="round" fill="none"><path d="M230 520 L75 500"/><path d="M230 520 L125 570"/><path d="M230 520 L325 572"/><path d="M230 520 L368 508"/><path d="M230 520 L262 482"/></g><g stroke="#ffffff88" stroke-width="5" stroke-linecap="round"><path d="M225 512 L80 494"/><path d="M235 512 L362 500"/></g>`},
{id:"hub",n:"Base Hub",c:"#eab308",s:`<ellipse cx="230" cy="522" rx="54" ry="20" fill="url(#metal)"/><ellipse cx="230" cy="516" rx="40" ry="12" fill="#e6eaee"/><ellipse cx="230" cy="516" rx="14" ry="5" fill="#7a838c"/>`},
{id:"wheelL",n:"Wheels Left",c:"#ef4444",s:[[72,512],[122,582]].map(([x,y])=>`<rect x="${x-9}" y="${y-22}" width="18" height="14" rx="3" fill="#9aa3ab"/><circle cx="${x}" cy="${y}" r="13" fill="url(#tire)"/><circle cx="${x}" cy="${y}" r="5" fill="#ccc"/>`).join("")},
{id:"wheelR",n:"Wheels Right",c:"#ec4899",s:[[328,584],[370,520],[264,492]].map(([x,y])=>`<rect x="${x-9}" y="${y-22}" width="18" height="14" rx="3" fill="#9aa3ab"/><circle cx="${x}" cy="${y}" r="13" fill="url(#tire)"/><circle cx="${x}" cy="${y}" r="5" fill="#ccc"/>`).join("")},
{id:"cab",n:"Main Cabinet",c:"#3b82f6",s:`<path d="M108 300 Q108 262 150 258 L262 252 Q292 252 294 285 L296 448 Q296 470 270 472 L132 476 Q108 476 108 452Z" fill="url(#body)" stroke="#9aa6b2" stroke-width="1.5"/><path d="M118 290 Q120 270 152 268 L200 266" stroke="#fff" stroke-width="4" fill="none" opacity=".8"/>`},
{id:"bay",n:"Side Bay",c:"#14b8a6",s:`<path d="M212 300 L282 296 L284 456 L214 462Z" fill="url(#bodyV)" stroke="#9aa6b2"/><rect x="232" y="350" width="34" height="60" rx="10" fill="none" stroke="#a7b1bb" stroke-width="3"/>`},
{id:"front",n:"Front Panel",c:"#22c55e",s:`<path d="M126 315 L204 310 L206 450 L128 454Z" fill="url(#bodyV)" stroke="#a3adb7"/><rect x="138" y="372" width="24" height="44" rx="4" fill="#eef2f5" stroke="#b3bcc5"/><circle cx="150" cy="384" r="3" fill="#334"/><circle cx="150" cy="394" r="3" fill="#334"/><circle cx="150" cy="404" r="3" fill="#22c55e"/><rect x="172" y="370" width="22" height="58" rx="10" fill="none" stroke="#b3bcc5" stroke-width="2.5"/><rect x="132" y="322" width="66" height="8" rx="3" fill="#cfd6dd"/>`},
{id:"probeL",n:"Probe Holders L",c:"#06b6d4",s:[[128,268],[152,276],[176,284]].map(([x,y])=>`<path d="M${x-12} ${y} L${x+12} ${y} L${x+8} ${y+30} L${x-8} ${y+30}Z" fill="url(#teal)"/><ellipse cx="${x}" cy="${y}" rx="12" ry="5" fill="#d8fffc" stroke="#2fa3a8"/>`).join("")},
{id:"col",n:"Column",c:"#8b5cf6",s:`<path d="M200 182 L240 180 L244 262 L198 264Z" fill="url(#body)" stroke="#9aa6b2"/><rect x="206" y="190" width="30" height="6" rx="3" fill="#fff9"/>`},
{id:"deck",n:"Console Deck",c:"#f59e0b",s:`<path d="M140 240 L320 210 Q340 208 350 222 L378 278 Q382 292 366 296 L196 318 Q180 320 172 306Z" fill="url(#body)" stroke="#97a3af" stroke-width="1.5"/><path d="M172 306 L196 318 L366 296 L366 304 L196 328 L170 314Z" fill="#a9b3bd"/>`},
{id:"kbd",n:"Keyboard",c:"#0ea5e9",s:`<path d="M168 236 L306 214 L314 232 L176 255Z" fill="#5d6773"/>${Array.from({length:22},(_,i)=>{const r=i%2,k=Math.floor(i/2);const x=174+k*12+r*2,y=238-k*2+r*8;return `<rect x="${x}" y="${y-2}" width="9" height="6" rx="1" fill="#dfe6ec" transform="skewX(-18)" transform-origin="${x} ${y}"/>`}).join("")}`},
{id:"touch",n:"Touch Screen",c:"#10b981",s:`<path d="M180 260 L312 240 L318 254 L186 276Z" fill="#0b1520" stroke="#3a4652"/><path d="M186 263 L240 255 L243 266 L189 273Z" fill="#1d6fa3" opacity=".9"/><path d="M248 254 L306 245 L309 256 L251 265Z" fill="#26a69a" opacity=".9"/>`},
{id:"knobs",n:"Control Knobs",c:"#f43f5e",s:`${[[200,290],[218,287],[236,284],[290,276],[308,273],[326,270],[208,302],[226,299],[300,286],[318,283]].map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="7" ry="4.5" fill="${i%3==0?'#3b82f6':'#5d6773'}" stroke="#222" stroke-width=".8"/><ellipse cx="${x-1}" cy="${y-1.5}" rx="3" ry="1.5" fill="#fff8"/>`).join("")}<ellipse cx="262" cy="290" rx="15" ry="9" fill="#cfd6dd" stroke="#7a838c"/><ellipse cx="262" cy="288" rx="9" ry="5.5" fill="#3a4450"/><ellipse cx="259" cy="286" rx="3" ry="1.6" fill="#fff9"/>`},
{id:"handle",n:"Front Handle",c:"#84cc16",s:`<path d="M300 300 Q395 290 388 262 L380 246" stroke="url(#body)" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M300 300 Q395 290 388 262 L380 246" stroke="#8a96a2" stroke-width="12" fill="none" stroke-linecap="round" opacity=".35"/><path d="M190 322 Q170 320 160 300" stroke="#c6ced6" stroke-width="10" fill="none" stroke-linecap="round"/>`},
{id:"probeR",n:"Probe Holders R",c:"#2dd4bf",s:[[334,222],[358,232]].map(([x,y])=>`<path d="M${x-11} ${y} L${x+11} ${y} L${x+7} ${y+26} L${x-7} ${y+26}Z" fill="url(#teal)"/><ellipse cx="${x}" cy="${y}" rx="11" ry="4.5" fill="#d8fffc" stroke="#2fa3a8"/>`).join("")},
{id:"probe",n:"Transducer",c:"#fb7185",s:`<path d="M334 216 q-30 70 -100 120 q-40 30 -90 20" stroke="#2c333b" stroke-width="3" fill="none"/><path d="M328 196 L340 196 L344 222 L324 222Z" fill="#3b4652"/><rect x="322" y="188" width="24" height="10" rx="4" fill="#8fa0b0"/>`},
{id:"arm",n:"Monitor Arm",c:"#fde047",s:`<path d="M206 196 Q190 176 172 172 L190 164 Q214 168 236 186 Z" fill="url(#body)" stroke="#9aa6b2"/><ellipse cx="220" cy="186" rx="22" ry="8" fill="url(#bodyV)" stroke="#9aa6b2"/>`},
{id:"spk",n:"Side Speaker",c:"#c084fc",s:`<path d="M80 56 L98 60 L98 162 L80 156Z" fill="url(#bodyV)" stroke="#9aa6b2"/>${Array.from({length:12},(_,i)=>`<rect x="84" y="${66+i*7.5}" width="10" height="2.5" fill="#8a96a2"/>`).join("")}`},
{id:"monitor",n:"Monitor",c:"#38bdf8",s:`<rect x="96" y="34" width="182" height="146" rx="7" fill="url(#dark)" stroke="#1f252b"/><rect x="104" y="42" width="166" height="128" rx="3" fill="url(#glass)"/><path d="M110 46 L180 46 L120 120Z" fill="#fff" opacity=".06"/><circle cx="262" cy="175" r="2" fill="#22c55e"/>`}
];
const svg=document.getElementById("machine"),tray=document.getElementById("tray"),drag=document.getElementById("drag"),ring=document.getElementById("ring");
let placed={},guide=true,powered=false,mode="b";
svg.innerHTML=DEFS+`<g id="ghost" opacity=".18"></g><g id="parts"></g><g id="screen" style="display:none"></g>`;
const ghost=svg.querySelector("#ghost"),pg=svg.querySelector("#parts"),scr=svg.querySelector("#screen");
// build ghost outlines + slots + bbox
PARTS.forEach(p=>{
  const g=document.createElementNS(NS,"g");g.innerHTML=p.s;g.setAttribute("filter","none");
  g.querySelectorAll("*").forEach(e=>{e.setAttribute("fill","none");e.setAttribute("stroke","#7dd3fc");e.setAttribute("stroke-dasharray","4 3");e.setAttribute("stroke-width","1.2")});
  ghost.appendChild(g);
  const slot=document.createElementNS(NS,"g");slot.id="p_"+p.id;slot.innerHTML=p.s;slot.style.display="none";pg.appendChild(slot);
  slot.style.display="";p.bb=slot.getBBox();slot.style.display="none";
});
function setColor(k){const [a,b,c]=COLORS[k];document.documentElement.style.setProperty("--b1",a);document.documentElement.style.setProperty("--b2",b);document.documentElement.style.setProperty("--b3",c);
  document.querySelectorAll("#colors b").forEach(e=>e.classList.toggle("act",e.dataset.k==k))}
Object.keys(COLORS).forEach(k=>{const b=document.createElement("b");b.dataset.k=k;b.style.background=COLORS[k][0];b.onclick=()=>setColor(k);document.getElementById("colors").appendChild(b)});
setColor("White");
function thumb(p){const pad=4,b=p.bb;return `<svg viewBox="${b.x-pad} ${b.y-pad} ${b.width+pad*2} ${b.height+pad*2}">${DEFS}${p.s}</svg>`}
function buildTray(order){tray.innerHTML="";order.forEach(p=>{if(placed[p.id])return;const t=document.createElement("div");t.className="tile";t.style.setProperty("--c",p.c);t.innerHTML=thumb(p)+`<span>${p.n}</span>`;t.dataset.id=p.id;t.addEventListener("pointerdown",e=>start(e,p,t));tray.appendChild(t)})}
function shuffled(){return PARTS.slice().sort(()=>Math.random()-.5)}
// drag
let cur=null;
function scale(){const m=svg.getScreenCTM();return m.a}
function start(e,p,tile){e.preventDefault();const s=scale();cur={p,tile,w:p.bb.width*s,h:p.bb.height*s};
  drag.style.setProperty("--c",p.c);drag.innerHTML=`<svg width="${cur.w}" height="${cur.h}" viewBox="${p.bb.x} ${p.bb.y} ${p.bb.width} ${p.bb.height}" style="overflow:visible">${DEFS}${p.s}</svg>`;
  drag.style.display="block";ring.style.display="block";tile.style.opacity=".25";move(e);
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end)}
function move(e){if(!cur)return;e.preventDefault();cur.x=e.clientX;cur.y=e.clientY;
  drag.style.transform=`translate(${cur.x-cur.w/2}px,${cur.y-cur.h/2}px) scale(1.04)`;ring.style.left=cur.x+"px";ring.style.top=cur.y+"px"}
function end(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",end);window.removeEventListener("pointercancel",end);
  if(!cur)return;const {p,tile}=cur;const m=svg.getScreenCTM();
  const tx=m.a*(p.bb.x+p.bb.width/2)+m.e,ty=m.d*(p.bb.y+p.bb.height/2)+m.f;
  const d=Math.hypot(cur.x-tx,cur.y-ty),tol=Math.max(45,Math.min(cur.w,cur.h)*.45);
  drag.style.display="none";ring.style.display="none";
  if(d<tol){place(p.id);tile.remove()}else tile.style.opacity="1";cur=null}
function place(id){placed[id]=1;const el=document.getElementById("p_"+id);el.style.display="";el.classList.remove("placed");void el.getBBox();el.classList.add("placed");update()}
function update(){const n=Object.keys(placed).length;document.querySelector("#bar i").style.width=(n/20*100)+"%";
  ghost.style.display=guide&&n<20?"":"none";const pw=document.getElementById("pwr");pw.classList.toggle("ready",n==20&&!powered);
  if(n==20&&!powered)toast("Assembly complete! Press Power")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)}
// screen
let raf;
function drawScreen(t){
  const c=mode=="c";let h=`<clipPath id="sc"><rect x="104" y="42" width="166" height="128"/></clipPath><g clip-path="url(#sc)"><rect x="104" y="42" width="166" height="128" fill="#000"/>
  <path d="M187 50 L250 160 Q187 172 124 160Z" fill="url(#scan)" opacity=".55"/>`;
  for(let i=0;i<70;i++){const a=(i*137.5)%120-60,r=20+((i*53)%100);const x=187+Math.sin(a*Math.PI/180)*r,y=50+Math.cos(a*Math.PI/180)*r;const f=.3+.5*Math.abs(Math.sin(t/400+i));h+=`<circle cx="${x}" cy="${y}" r="${1+i%3}" fill="#fff" opacity="${f*.6}"/>`}
  const pr=1+.08*Math.sin(t/220);
  h+=`<ellipse cx="187" cy="112" rx="${26*pr}" ry="${16*pr}" fill="#000" stroke="#aaa" stroke-width="1.5" opacity=".9"/>`;
  if(c)h+=`<ellipse cx="180" cy="110" rx="${10*pr}" ry="6" fill="#e11d48" opacity=".75"/><ellipse cx="195" cy="114" rx="${9*pr}" ry="5" fill="#2563eb" opacity=".75"/>`;
  const sw=Math.sin(t/600)*40;h+=`<line x1="187" y1="50" x2="${187+sw}" y2="160" stroke="#22d3ee" stroke-width=".8" opacity=".6"/>`;
  h+=`<polyline fill="none" stroke="#4ade80" stroke-width="1.2" points="${Array.from({length:40},(_,i)=>{const x=106+i*4,ph=(i*4+t/8)%60;return x+","+(164-(ph<4?12:ph<8?-4:0))}).join(" ")}"/></g>`;
  scr.innerHTML=h;raf=requestAnimationFrame(drawScreen)}
document.getElementById("pwr").onclick=()=>{
  if(Object.keys(placed).length<20){toast("Complete all 20 parts first");return}
  powered=!powered;const b=document.getElementById("pwr");b.classList.toggle("on",powered);b.classList.remove("ready");
  if(powered){scr.style.display="";raf=requestAnimationFrame(drawScreen)}else{cancelAnimationFrame(raf);scr.style.display="none"}};
function reset(){placed={};powered=false;cancelAnimationFrame(raf);scr.style.display="none";document.getElementById("pwr").className="";
  PARTS.forEach(p=>document.getElementById("p_"+p.id).style.display="none");buildTray(shuffled());update()}
document.getElementById("bReset").onclick=reset;
document.getElementById("bHint").onclick=()=>{const t=tray.querySelector(".tile");if(!t)return;const p=PARTS.find(x=>x.id==t.dataset.id);
  const g=ghost.children[PARTS.indexOf(p)];ghost.style.display="";g.setAttribute("opacity","6");g.querySelectorAll("*").forEach(e=>e.setAttribute("stroke","#facc15"));
  t.scrollIntoView({behavior:"smooth",inline:"center"});setTimeout(()=>{g.removeAttribute("opacity");g.querySelectorAll("*").forEach(e=>e.setAttribute("stroke","#7dd3fc"));update()},1500)};
const cc=document.getElementById("cc");document.getElementById("bCC").onclick=()=>cc.style.display=cc.style.display=="block"?"none":"block";
cc.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-bg]").forEach(x=>x.classList.toggle("act",x==b));document.getElementById("stage").classList.toggle("light",b.dataset.bg=="light")});
cc.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("act",x==b));guide=b.dataset.g=="1";update()});
cc.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{cc.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("act",x==b));mode=b.dataset.m});
document.getElementById("auto").onclick=()=>{let i=0;const left=PARTS.filter(p=>!placed[p.id]);const iv=setInterval(()=>{if(i>=left.length){clearInterval(iv);return}place(left[i].id);const t=tray.querySelector(`[data-id="${left[i].id}"]`);t&&t.remove();i++},120)};
