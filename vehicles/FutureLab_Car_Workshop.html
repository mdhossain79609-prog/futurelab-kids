<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FutureLab Kids — 3D Car Workshop</title>
<style>
:root{--blue:#1677df;--deep:#123c75;--sky:#dff5ff;--orange:#ff9f1c;--paint:#ef4444}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(145deg,#dff6ff,#f5f2ff);color:#183653;min-height:100vh}.app{max-width:980px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;font-size:clamp(20px,4vw,30px);color:#1255a5}.brand span{color:#ff8b16}.pill,.btn{border:0;border-radius:16px;padding:11px 15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #0002}.pill{background:#fff;color:#18599a}.panel{background:#fff;border:3px solid #c9eaff;border-radius:22px;padding:12px;margin-top:12px;box-shadow:0 8px 20px #2873a51a}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.heading h2{margin:2px 0;color:#15559a;font-size:clamp(19px,4vw,26px)}.hint{font-size:13px;color:#54718b}.stage{position:relative;min-height:250px;height:clamp(250px,42vw,390px);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#fff 0,#eaf8ff 55%,#d7edff 100%);border:2px solid #b8e2ff;touch-action:pan-y}.stage:after{content:"";position:absolute;left:8%;right:8%;bottom:19%;height:14px;border-radius:50%;background:#52718a22;filter:blur(7px)}svg.car{position:absolute;width:90%;height:88%;left:5%;top:5%;overflow:visible;transform-origin:50% 55%;transition:transform .2s}.ghost{position:absolute;z-index:9;pointer-events:none;display:none;width:84px;height:58px;border:2px dashed #ff8b16;border-radius:14px;background:#fff9;align-items:center;justify-content:center;font-size:32px;transform:translate(-50%,-50%)}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-top:12px}.part{background:linear-gradient(#fff,#eaf6ff);border:2px solid #b8dcfa;border-radius:15px;padding:9px 5px;text-align:center;font-weight:800;touch-action:none;user-select:none;box-shadow:0 3px 0 #b9d9f1;cursor:grab}.part b{display:block;font-size:30px}.part small{font-size:12px}.part.done{opacity:.45;border-color:#45b878}.part.locked{opacity:.3;pointer-events:none}.progress{height:10px;background:#e6eff7;border-radius:9px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#20c997,#69d6ff);transition:width .25s}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.btn{color:white;background:linear-gradient(#2998f5,#1466c4);font-size:clamp(12px,2.7vw,15px)}.btn.orange{background:linear-gradient(#ffbd4a,#f17c11)}.btn.purple{background:linear-gradient(#a78bfa,#7250d7)}.btn.green{background:linear-gradient(#4bd49a,#159b69)}.btn:active,.part:active{transform:translateY(2px)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#102b4dcc;z-index:30;display:grid;place-items:center;padding:18px}.dialog{width:min(420px,100%);background:white;border-radius:22px;padding:18px;box-shadow:0 15px 50px #0005}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.choice{border:2px solid #d3e8f8;background:#f3faff;border-radius:14px;padding:12px;text-align:center;font-weight:800;cursor:pointer}.choice .swatch{height:28px;border-radius:9px;margin-bottom:6px}.drive{background:linear-gradient(#bceaff,#eafaff);min-height:calc(100vh - 80px)}.drivearea{position:relative;height:300px;border-radius:18px;overflow:hidden;background:linear-gradient(#8fd4ff 0 52%,#71bf73 52% 100%)}.road{position:absolute;left:0;right:0;bottom:-5px;height:48%;background:#596574;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}.road:after{content:"";position:absolute;left:49%;top:0;width:4px;height:100%;background:repeating-linear-gradient(to bottom,#fff 0 24px,transparent 24px 48px);animation:roadmove .5s linear infinite;animation-play-state:paused}@keyframes roadmove{to{background-position:0 48px}}.drivecar{position:absolute;left:10%;bottom:21%;width:43%;height:48%;z-index:2;transition:transform .25s}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.controls .btn{min-height:48px}.steer{grid-column:1/-1;display:flex;justify-content:center;gap:12px}.status{text-align:center;font-weight:900;color:#13599d;margin:8px}.foot{text-align:center;color:#64809a;font-size:11px;padding:12px}
@media(max-width:480px){.app{padding:8px}.panel{padding:9px}.actions{gap:6px}.btn{padding:10px 4px;border-radius:12px}.stage{height:270px}.controls{grid-template-columns:repeat(2,1fr)}.steer{grid-column:1/-1}}
</style></head><body><main class="app">
<header class="top"><div class="brand">🚀 FutureLab <span>Kids</span></div><button class="pill" id="homeBtn">⌂ Home</button></header>
<section id="workshop">
<div class="panel"><div class="heading"><h2>🚘 Build Your Dream Car</h2><span class="hint" id="stageName">SECTION 1 · INSIDE</span></div><div class="hint" id="instruction">Drag each part onto the matching glowing area.</div><div class="progress"><i id="bar"></i></div>
<div class="stage" id="stage"><div class="ghost" id="ghost">⚙️</div>
<svg class="car" id="carSvg" viewBox="0 0 700 360" aria-label="Car assembly model">
<defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#dce5ec"/><stop offset=".5" stop-color="#8da2b3"/><stop offset="1" stop-color="#526879"/></linearGradient><linearGradient id="paint" x2="0" y2="1"><stop stop-color="#ffb4b4"/><stop offset=".4" stop-color="var(--paint)"/><stop offset="1" stop-color="#a81727"/></linearGradient></defs>
<g id="frame" fill="none" stroke="#8799a8" stroke-width="15" stroke-dasharray="8 7" stroke-linejoin="round"><path d="M105 235 Q115 190 190 185 L510 185 Q580 190 600 235 L585 270 L120 270Z"/><path d="M175 195V270M525 195V270"/></g>
<g id="mechanics" opacity=".0"><rect x="205" y="193" width="290" height="35" rx="12" fill="url(#metal)"/><path d="M150 254H550" stroke="#293b4b" stroke-width="14"/><rect x="292" y="168" width="105" height="38" rx="9" fill="#e88d2a" stroke="#9d4f13" stroke-width="5"/><path d="M345 168V142M345 142L375 125" stroke="#344b5e" stroke-width="9" stroke-linecap="round"/><path d="M225 225L225 250M475 225L475 250" stroke="#344b5e" stroke-width="12"/><rect x="310" y="225" width="60" height="24" rx="8" fill="#416a8c"/></g>
<g id="lights" opacity="0"><path d="M120 218l42-8 0 25-42-4Z" fill="#fff5a1" stroke="#f7d64a" stroke-width="4"/><path d="M538 212l42 7v18l-42 5Z" fill="#ff4f4f" stroke="#b32121" stroke-width="4"/></g>
<g id="body" opacity="0"><path d="M90 232 Q105 190 195 180 L250 111 Q275 82 330 82H430Q475 82 510 126L565 188Q605 198 615 235L600 265H100Z" fill="url(#paint)" stroke="#8f1d2b" stroke-width="8"/><path d="M262 119Q282 99 326 99H421Q451 99 478 133L500 176H224Z" fill="#80d9f7" stroke="#e8f8ff" stroke-width="8"/><path d="M350 101V176" stroke="#d7f5ff" stroke-width="7"/><path d="M105 231H600" stroke="#ffd7d7" stroke-width="5" opacity=".7"/></g>
<g id="wheels" opacity="0"><g fill="#202a34" stroke="#536b7e" stroke-width="8"><circle cx="190" cy="258" r="49"/><circle cx="520" cy="258" r="49"/></g><g fill="#d8e5ed" stroke="#71899a" stroke-width="5"><circle cx="190" cy="258" r="22"/><circle cx="520" cy="258" r="22"/></g><g stroke="#8799a8" stroke-width="5"><path d="M190 238v40M170 258h40M520 238v40M500 258h40"/></g></g>
</svg></div>
<div class="tools" id="parts"></div>
<div class="actions"><button class="btn orange" data-modal="colors">🎨 Coloring</button><button class="btn purple" data-modal="lights">💡 Lighting</button><button class="btn" data-modal="music">🎵 Music</button><button class="btn green" id="testBtn">🏁 Test Start</button></div></div>
</section>
<section id="testDrive" class="hidden"><div class="panel drive"><div class="heading"><h2>🏁 Test Drive</h2><button class="pill" id="backBtn">← Workshop</button></div><div class="drivearea"><div class="road" id="road"></div><svg class="drivecar" id="driveCar" viewBox="0 0 300 150"><g id="driveNose"><path d="M15 95L35 50Q55 25 115 25H210Q250 30 280 75L290 105H10Z" fill="var(--paint)" stroke="#81202b" stroke-width="7"/><path d="M75 52Q90 35 125 35H195Q220 38 238 65H65Z" fill="#8edcf6" stroke="white" stroke-width="5"/><circle cx="65" cy="105" r="25" fill="#202b36"/><circle cx="235" cy="105" r="25" fill="#202b36"/></g></svg></div><div class="status" id="speedText">Speed: 0 km/h · Gear: N</div><div class="controls"><div class="steer"><button class="btn" id="left">↶ Steer Left</button><button class="btn" id="right">Steer Right ↷</button></div><button class="btn green" id="start">🔑 Start</button><button class="btn purple" id="gear">⚙️ Gear: N</button><button class="btn" id="clutch">Clutch</button><button class="btn orange" id="brake">🛑 Brake</button><button class="btn green" id="accelerator">⚡ Accelerator</button></div></div></section>
<div class="foot">Learn • Build • Test • Create · FutureLab Kids</div></main>
<div class="modal hidden" id="modal"><div class="dialog"><div class="heading"><h2 id="modalTitle">Choose</h2><button class="pill" id="closeModal">✕</button></div><div class="choices" id="choices"></div></div></div>
<script>
const $=s=>document.querySelector(s);let section=1,installed=new Set(),paint='#ef4444',light='classic',musicOn=false,engine=false,speed=0,gear='N',steer=0,clutch=false;const inner=[['chassis','🧱','Chassis'],['axle','➖','Axle'],['engine','⚙️','Engine'],['steering','🛞','Steering'],['seat','💺','Seat']];const outer=[['lights','💡',''],['body','🚗',''],['windows','🪟',''],['wheels','🛞','']];const targets={chassis:[.5,.65],axle:[.5,.77],engine:[.5,.52],steering:[.5,.39],seat:[.5,.59],lights:[.18,.61],body:[.5,.48],windows:[.5,.37],wheels:[.5,.75]};
function renderParts(){let arr=section===1?inner:outer;$('#parts').innerHTML=arr.map(([id,ic,name])=>`<div class="part ${installed.has(id)?'done':''}" data-id="${id}"><b>${ic}</b><small>${name||' '}${installed.has(id)?' ✓':''}</small></div>`).join('');$('#stageName').textContent=section===1?'SECTION 1 · INSIDE':'SECTION 2 · OUTSIDE';$('#instruction').textContent=section===1?'Drag all 5 mechanical parts onto the car.':'Now add lights, body, windows and wheels.';let count=section===1?inner.length:outer.length;let done=arr.filter(x=>installed.has(x[0])).length;$('#bar').style.width=(done/count*100)+'%';document.querySelectorAll('.part').forEach(p=>{p.addEventListener('pointerdown',startDrag)});}
function startDrag(e){let el=e.currentTarget,id=el.dataset.id,ghost=$('#ghost');el.setPointerCapture(e.pointerId);ghost.textContent=el.querySelector('b').textContent;ghost.style.display='flex';moveGhost(e);const move=ev=>moveGhost(ev);const end=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);ghost.style.display='none';let r=$('#stage').getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height,t=targets[id];if(x>.08&&x<.92&&y>.12&&y<.92&&Math.abs(x-t[0])<.34&&Math.abs(y-t[1])<.3)install(id);};el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}function moveGhost(e){let r=$('#stage').getBoundingClientRect();$('#ghost').style.left=(e.clientX-r.left)+'px';$('#ghost').style.top=(e.clientY-r.top)+'px'}
function install(id){if(installed.has(id))return;installed.add(id);if(id==='chassis'||id==='axle'||id==='engine'||id==='steering'||id==='seat'){$('#mechanics').style.opacity=1;}if(id==='lights'){$('#lights').style.opacity=1;}if(id==='body'){$('#body').style.opacity=1;$('#mechanics').style.opacity=.0;$('#frame').style.opacity=.1;}if(id==='windows'){$('#body path:nth-of-type(2)').style.opacity=1;}if(id==='wheels')$('#wheels').style.opacity=1;renderParts();if(section===1&&inner.every(x=>installed.has(x[0]))){setTimeout(()=>{section=2;renderParts();},450)}if(section===2&&outer.every(x=>installed.has(x[0]))){$('#instruction').textContent='🎉 Your car is ready! Try coloring, lights, music and test drive.'}}
$('#parts').addEventListener('click',e=>{let p=e.target.closest('.part');if(p){/* drag is primary; tap-to-install assist for small screens */install(p.dataset.id)}});
$('#stage').addEventListener('wheel',e=>{e.preventDefault();let s=Math.max(.85,Math.min(1.3,1+(parseFloat($('#carSvg').dataset.zoom)||0)-e.deltaY*.0005));$('#carSvg').dataset.zoom=s-1;$('#carSvg').style.transform=`scale(${s}) rotateY(${($('#carSvg').dataset.turn||0)}deg)`},{passive:false});let turn=0;$('#stage').addEventListener('dblclick',()=>{turn=(turn+15)%360;$('#carSvg').dataset.turn=turn;$('#carSvg').style.transform=`scale(${1+(parseFloat($('#carSvg').dataset.zoom)||0)}) rotateY(${turn}deg)`});
function openModal(type){let data=type==='colors'?[['#ef4444','Red'],['#1688e8','Blue'],['#20b879','Green'],['#ffb020','Yellow'],['#8b5cf6','Purple'],['#303944','Black']]:type==='lights'?[['classic','Classic'],['neon','Neon'],['racing','Racing']]:[['beat','Beat'],['band','Band rhythm'],['calm','Calm tune']];$('#modalTitle').textContent=type==='colors'?'🎨 Choose car color':type==='lights'?'💡 Choose lighting':'🎵 Choose music';$('#choices').innerHTML=data.map(([v,n])=>`<div class="choice" data-value="${v}">${type==='colors'?`<div class="swatch" style="background:${v}"></div>`:type==='lights'?'✨':'🎶'}${n}</div>`).join('');$('#modal').classList.remove('hidden');$('#choices').onclick=e=>{let c=e.target.closest('.choice');if(!c)return;let v=c.dataset.value;if(type==='colors'){paint=v;document.documentElement.style.setProperty('--paint',paint)}else if(type==='lights'){light=v;$('#lights').style.filter=v==='neon'?'drop-shadow(0 0 9px #45eaff)':v==='racing'?'drop-shadow(0 0 5px #ff3b3b)':'none';}else{musicOn=true;playTune(v)}$('#modal').classList.add('hidden')}}}document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');
let audioCtx;function playTune(kind){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let notes=kind==='calm'?[392,440,523]:kind==='band'?[130,196,262,196]:[262,330,392,523];notes.forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='band'?'triangle':'sine';o.frequency.value=f;g.gain.value=.055;o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+i*.22);g.gain.setTargetAtTime(.001,audioCtx.currentTime+i*.22+.16,.08);o.stop(audioCtx.currentTime+i*.22+.5)})}catch(e){}}
$('#testBtn').onclick=()=>{$('#workshop').classList.add('hidden');$('#testDrive').classList.remove('hidden')};$('#backBtn').onclick=()=>{$('#testDrive').classList.add('hidden');$('#workshop').classList.remove('hidden')};$('#homeBtn').onclick=()=>{if(confirm('Return to Junior Builder?'))location.href='../index.html'};
function updateDrive(){let road=$('#road');road.style.animationPlayState=engine&&speed>0?'running':'paused';road.style.animationDuration=Math.max(.12,1.1-speed*.035)+'s';$('#speedText').textContent=`Speed: ${speed*10} km/h · Gear: ${gear}${clutch?' · Clutch pressed':''}`;$('#driveNose').style.transform=`rotate(${steer}deg)`;$('#driveNose').style.transformOrigin='50% 70%';}$('#start').onclick=()=>{engine=!engine;if(engine&&speed===0)speed=1;$('#start').textContent=engine?'⏻ Stop':'🔑 Start';updateDrive()};$('#gear').onclick=()=>{gear=gear==='N'?'D':gear==='D'?'R':'N';$('#gear').textContent='⚙️ Gear: '+gear;updateDrive()};$('#clutch').onclick=()=>{clutch=!clutch;$('#clutch').textContent=clutch?'Clutch ✓':'Clutch';updateDrive()};$('#accelerator').onclick=()=>{if(engine&&!clutch&&gear!=='N')speed=Math.min(10,speed+1);updateDrive()};$('#brake').onclick=()=>{speed=0;updateDrive()};$('#left').onclick=()=>{steer=Math.max(-24,steer-8);updateDrive()};$('#right').onclick=()=>{steer=Math.min(24,steer+8);updateDrive()};renderParts();
</script></body></html>
