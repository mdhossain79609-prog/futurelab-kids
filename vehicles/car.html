<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutureLab Kids - Car Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(#dff6ff,#f5fbff);
    color:#263238;
}

.car-header{
    text-align:center;
    padding:25px 15px 18px;
}

.car-logo{
    font-size:58px;
}

.car-title{
    margin:5px 0;
    font-size:30px;
    color:#6339b6;
}

.car-subtitle{
    margin:8px 0 0;
    color:#607d8b;
    font-size:15px;
}

.builder-card{
    width:92%;
    max-width:600px;
    margin:10px auto 30px;
    background:white;
    border-radius:24px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    text-align:center;
}

.builder-card h2{
    margin:5px 0 10px;
    color:#6339b6;
}

.builder-card p{
    color:#607d8b;
    line-height:1.5;
}

.start-building{
    border:0;
    border-radius:16px;
    padding:15px 28px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

    /* CAR CHASSIS */

.car-chassis{
    position:absolute;
    width:230px;
    height:85px;
    left:25px;
    top:58px;
    background:#b0bec5;
    border:6px solid #455a64;
    border-radius:18px;
    z-index:1;
    box-shadow:inset 0 0 0 4px #78909c;
}

.car-chassis span{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:11px;
    font-weight:bold;
    color:#6339b6;
}

    
/* ENGINE PART */

.car-engine-part{
    position:absolute;
    width:65px;
    height:55px;
    left:175px;
    top:73px;
    background:#78909c;
    border:4px solid #37474f;
    border-radius:12px;
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

.engine-icon{
    font-size:24px;
    line-height:22px;
}

.car-engine-part small{
    font-size:7px;
    font-weight:bold;
    color:white;
}

    /* AXLE PARTS */

.car-axle{
    position:absolute;
    width:12px;
    height:110px;
    background:#455a64;
    border-radius:8px;
    z-index:3;
}

.front-axle{
    left:55px;
    top:45px;
}

.rear-axle{
    right:55px;
    top:45px;
}

.car-axle span{
    display:none;
}

/* WHEEL PARTS */

.car-wheel-part{
    position:absolute;
    width:42px;
    height:42px;
    background:#263238;
    border:5px solid #607d8b;
    border-radius:50%;
    z-index:7;
    display:flex;
    align-items:center;
    justify-content:center;
}

.wheel-front{
    left:40px;
    bottom:12px;
}

.wheel-rear{
    right:40px;
    bottom:12px;
}

.car-wheel-part span{
    color:#cfd8dc;
    font-size:20px;
}

    /* STEERING PART */

.car-steering-part{
    position:absolute;
    width:58px;
    height:58px;
    left:35px;
    top:60px;
    background:#f5f3ff;
    border:4px solid #6339b6;
    border-radius:50%;
    z-index:8;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.15);
}

.steering-wheel{
    font-size:30px;
    line-height:28px;
    color:#6339b6;
}

.car-steering-part small{
    font-size:7px;
    font-weight:bold;
    color:#6339b6;
}

    /* ===== COMPLETE CAR AREA ===== */

.car-workshop{
    width:92%;
    max-width:600px;
    margin:15px auto;
    padding:20px;
    background:white;
    border-radius:24px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    text-align:center;
}

.car-workshop h2{
    margin:0 0 20px;
    color:#6339b6;
}

.complete-car{
    position:relative;
    width:280px;
    height:190px;
    margin:0 auto;
    perspective:700px;
}


/* ===== 3D CAR BODY ===== */

.car-body{
    position:absolute;
    width:215px;
    height:92px;

    left:32px;
    top:42px;

    background:
        linear-gradient(
            145deg,
            #93c5fd 0%,
            #3b82f6 42%,
            #2563eb 70%,
            #1e40af 100%
        );

    border:4px solid #1e3a8a;

    border-radius:
        48px 62px 20px 18px;

    z-index:6;

    transform:
        perspective(600px)
        rotateX(-5deg)
        rotateY(-7deg);

    transform-style:preserve-3d;

    box-shadow:
        0 10px 0 #1e40af,
        0 15px 18px rgba(0,0,0,0.25),
        inset 0 5px 7px rgba(255,255,255,0.55),
        inset 0 -8px 10px rgba(0,0,0,0.18);
}


/* 3D ROOF */

.car-body::before{
    content:"";
    position:absolute;

    width:125px;
    height:48px;

    left:38px;
    top:-34px;

    background:
        linear-gradient(
            145deg,
            #60a5fa,
            #2563eb
        );

    border:4px solid #1e3a8a;
    border-bottom:0;

    border-radius:45px 55px 5px 5px;

    transform:
        perspective(300px)
        rotateX(-8deg);

    box-shadow:
        inset 0 5px 6px rgba(255,255,255,0.4);

    z-index:-1;
}


/* WINDOWS */

.car-window{
    position:absolute;
    top:-24px;

    width:48px;
    height:34px;

    background:
        linear-gradient(
            145deg,
            #e0f7ff,
            #7dd3fc 65%,
            #38bdf8
        );

    border:3px solid #1e3a8a;

    box-shadow:
        inset 3px 3px 4px rgba(255,255,255,0.7);
}

.front-window{
    left:102px;
    border-radius:5px 25px 5px 5px;
    transform:skewX(12deg);
}

.rear-window{
    left:48px;
    border-radius:25px 5px 5px 5px;
    transform:skewX(-12deg);
}


/* LIGHTS */

.car-light{
    position:absolute;
    font-size:17px;
    z-index:10;
}

.front-light{
    right:-9px;
    top:42px;
}

.rear-light{
    left:-10px;
    top:43px;
}


/* CAR SHADOW */

.complete-car::after{
    content:"";
    position:absolute;

    width:210px;
    height:25px;

    left:35px;
    bottom:24px;

    background:rgba(0,0,0,0.16);

    border-radius:50%;

    filter:blur(5px);

    z-index:0;
}


/* NOTE */

.workshop-note{
    margin:15px 0 0;
    color:#607d8b;
    font-size:14px;
}
    
</style>
</head>

<body>

<header class="car-header">

    <div class="car-logo">🚗</div>

    <h1 class="car-title">
        Build Your Car
    </h1>

    <p class="car-subtitle">
        Build • Learn • Test • Drive
    </p>

</header>

    <!-- COMPLETE CAR WORKSHOP -->

<section class="car-workshop">

    <h2>🚗 My Car</h2>

    <div class="complete-car">

        <div class="car-chassis" id="carChassis">
    <span>CHASSIS</span>
</div>

        <div class="car-engine-part" id="carEngine">
    <div class="engine-icon">⚙️</div>
    <small>ENGINE</small>
</div>

        <div class="car-axle front-axle" id="frontAxle">
    <span>FRONT AXLE</span>
</div>

<div class="car-axle rear-axle" id="rearAxle">
    <span>REAR AXLE</span>
</div>

        <div class="car-wheel-part wheel-front" id="frontWheel">
    <span>◉</span>
</div>

<div class="car-wheel-part wheel-rear" id="rearWheel">
    <span>◉</span>
</div>
        <div class="car-steering-part" id="carSteering">
    <div class="steering-wheel">◎</div>
    <small>STEERING</small>
</div>

        <div class="car-body" id="carBody">
            <div class="car-window front-window"></div>
            <div class="car-window rear-window"></div>
            <div class="car-light front-light">💡</div>
            <div class="car-light rear-light">🔴</div>
        </div>

        <div class="car-engine-part" id="carEngine">

    </div>

    <p class="workshop-note">
        This is your complete car model.
    </p>

</section>

<section class="builder-card">

    <h2>🔧 Junior Car Workshop</h2>

    <p>
        Assemble your car part by part and learn how each part works.
    </p>

    <button class="start-building">
        🚗 Start Building
    </button>

</section>

</body>
</html>
