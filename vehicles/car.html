<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutureLab Kids - Build Your Car</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(#dff6ff,#f5fbff);
    color:#263238;
}

/* =========================
   HEADER
========================= */

.car-header{
    text-align:center;
    padding:18px 12px 10px;
}

.car-logo{
    font-size:48px;
}

.car-title{
    margin:4px 0;
    font-size:28px;
    color:#6339b6;
}

.car-subtitle{
    margin:5px 0 0;
    color:#607d8b;
    font-size:13px;
}

/* =========================
   TEST AREA
========================= */

.test-area{
    width:94%;
    max-width:700px;
    margin:10px auto 18px;
    background:white;
    border-radius:24px;
    padding:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

.test-layout{
    display:grid;
    grid-template-columns:1fr 155px;
    gap:10px;
    align-items:stretch;
}

/* =========================
   VERTICAL ROAD
========================= */

.road{
    position:relative;
    height:440px;
    overflow:hidden;
    border-radius:20px;
    background:
        linear-gradient(
            90deg,
            #666,
            #777 10%,
            #555 50%,
            #777 90%,
            #666
        );
    border:4px solid #455a64;
}

.road::before,
.road::after{
    content:"";
    position:absolute;
    top:0;
    width:8px;
    height:100%;
    background:#facc15;
}

.road::before{
    left:13px;
}

.road::after{
    right:13px;
}

.road-lines{
    position:absolute;
    left:50%;
    top:0;
    width:7px;
    height:100%;
    transform:translateX(-50%);
    background:
        repeating-linear-gradient(
            to bottom,
            white 0 38px,
            transparent 38px 75px
        );
    opacity:.85;
}

/* =========================
   CAR
========================= */

.car{
    position:absolute;
    width:120px;
    height:205px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transition:transform .18s ease,left .18s ease;
    z-index:5;
}

.car-shadow{
    position:absolute;
    width:108px;
    height:190px;
    left:6px;
    top:8px;
    border-radius:45px;
    background:rgba(0,0,0,.22);
    filter:blur(5px);
    transform:translate(5px,7px);
}

/* Main body */

.car-body{
    position:absolute;
    width:112px;
    height:190px;
    left:4px;
    top:5px;
    border-radius:42px 42px 25px 25px;
    background:linear-gradient(
        90deg,
        #991b1b,
        #ef4444 35%,
        #dc2626 65%,
        #7f1d1d
    );
    border:4px solid #7f1d1d;
    box-shadow:
        inset 7px 0 8px rgba(255,255,255,.22),
        inset -7px 0 8px rgba(0,0,0,.22),
        0 6px 10px rgba(0,0,0,.25);
    transition:.25s;
}

/* Roof */

.car-roof{
    position:absolute;
    width:76px;
    height:75px;
    left:18px;
    top:48px;
    border-radius:28px 28px 12px 12px;
    background:linear-gradient(
        90deg,
        #334155,
        #bae6fd 35%,
        #e0f7ff 55%,
        #334155
    );
    border:4px solid #7f1d1d;
    box-shadow:inset 0 3px 5px rgba(255,255,255,.5);
}

/* Front glass */

.front-glass{
    position:absolute;
    width:60px;
    height:30px;
    left:8px;
    top:6px;
    border-radius:18px 18px 5px 5px;
    background:#dff6ff;
    border:2px solid #334155;
}

/* Rear glass */

.rear-glass{
    position:absolute;
    width:60px;
    height:25px;
    left:8px;
    bottom:6px;
    border-radius:5px 5px 15px 15px;
    background:#bdeeff;
    border:2px solid #334155;
}

/* Wheels */

.wheel{
    position:absolute;
    width:27px;
    height:48px;
    border-radius:12px;
    background:#111827;
    border:4px solid #374151;
    z-index:8;
    box-shadow:inset 2px 0 3px rgba(255,255,255,.15);
}

.wheel-left-front{
    left:-13px;
    top:38px;
}

.wheel-right-front{
    right:-13px;
    top:38px;
}

.wheel-left-rear{
    left:-13px;
    bottom:38px;
}

.wheel-right-rear{
    right:-13px;
    bottom:38px;
}

/* Lights */

.light{
    position:absolute;
    width:22px;
    height:10px;
    border-radius:8px;
    z-index:9;
}

.front-light-left{
    left:14px;
    top:5px;
    background:#fff7a8;
}

.front-light-right{
    right:14px;
    top:5px;
    background:#fff7a8;
}

.rear-light-left{
    left:15px;
    bottom:5px;
    background:#991b1b;
}

.rear-light-right{
    right:15px;
    bottom:5px;
    background:#991b1b;
}

/* Engine visual */

.engine{
    position:absolute;
    width:48px;
    height:34px;
    left:32px;
    top:12px;
    border-radius:9px;
    background:#374151;
    border:3px solid #111827;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    opacity:1;
}

/* =========================
   CONTROL PANEL
========================= */

.controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:8px 4px;
    background:#f5f3ff;
    border-radius:20px;
    border:2px solid #ddd6fe;
}

/* Steering */

.steering-wheel-control{
    width:110px;
    height:110px;
    margin:3px auto 8px;
    border-radius:50%;
    border:12px solid #374151;
    background:#111827;
    position:relative;
    box-shadow:
        0 6px 12px rgba(0,0,0,.2),
        inset 0 0 0 5px #64748b;
    transition:transform .15s ease;
}

.steering-wheel-control::before,
.steering-wheel-control::after{
    content:"";
    position:absolute;
    background:#64748b;
    border-radius:5px;
}

.steering-wheel-control::before{
    width:9px;
    height:72px;
    left:38px;
    top:7px;
}

.steering-wheel-control::after{
    width:72px;
    height:9px;
    left:7px;
    top:39px;
}

.steering-center{
    position:absolute;
    width:28px;
    height:28px;
    left:29px;
    top:29px;
    border-radius:50%;
    background:#94a3b8;
    border:4px solid #1f2937;
    z-index:2;
}

.control-label{
    font-size:12px;
    font-weight:bold;
    color:#6339b6;
    margin-bottom:8px;
}

/* Start */

.start-test{
    width:135px;
    border:none;
    border-radius:14px;
    padding:11px 5px;
    background:#22c55e;
    color:white;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 5px 12px rgba(34,197,94,.28);
    margin-bottom:10px;
}

.start-test.active{
    background:#ef4444;
}

/* Pedals */

.pedals{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px;
}

.pedal{
    border:none;
    border-radius:10px;
    min-height:55px;
    color:white;
    font-size:10px;
    font-weight:bold;
    box-shadow:0 4px 8px rgba(0,0,0,.16);
}

.clutch{
    background:#6366f1;
}

.brake{
    background:#ef4444;
}

.accelerator{
    background:#f59e0b;
}

.pedal:active{
    transform:scale(.94);
}

/* =========================
   PARTS
========================= */

.parts-container{
    width:94%;
    max-width:700px;
    margin:0 auto 30px;
}

.parts-section{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-bottom:14px;
    box-shadow:0 5px 16px rgba(0,0,0,.08);
}

.parts-section h2{
    margin:0 0 5px;
    color:#6339b6;
    font-size:19px;
}

.parts-section p{
    margin:0 0 12px;
    color:#78909c;
    font-size:12px;
}

.parts-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.part{
    border:2px solid #dbe7f5;
    background:#f8fbff;
    border-radius:14px;
    min-height:76px;
    padding:7px 3px;
    font-size:25px;
    transition:.15s;
}

.part span{
    display:block;
    margin-top:5px;
    font-size:9px;
    font-weight:bold;
    color:#34445d;
}

.part.selected{
    border-color:#6339b6;
    background:#f3efff;
    transform:translateY(-2px);
}

/* Paint buttons */

.paint-red{background:#fee2e2;}
.paint-blue{background:#dbeafe;}
.paint-green{background:#dcfce7;}
.paint-yellow{background:#fef9c3;}
.paint-black{background:#e5e7eb;}

/* Back */

.back-btn{
    width:100%;
    border:none;
    border-radius:16px;
    padding:15px;
    background:#6339b6;
    color:white;
    font-size:16px;
    font-weight:bold;
}

/* Status */

.status{
    text-align:center;
    padding:8px;
    color:#6339b6;
    font-size:13px;
    font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    .test-layout{
        grid-template-columns:1fr 145px;
    }

    .road{
        height:420px;
    }

    .car{
        transform:translate(-50%,-50%) scale(.92);
    }

    .parts-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:390px){

    .test-layout{
        grid-template-columns:1fr 128px;
    }

    .steering-wheel-control{
        width:92px;
        height:92px;
        border-width:10px;
    }

    .steering-wheel-control::before{
        height:60px;
        left:31px;
    }

    .steering-wheel-control::after{
        width:60px;
        left:6px;
        top:31px;
    }

    .steering-center{
        width:24px;
        height:24px;
        left:24px;
        top:24px;
    }

    .start-test{
        width:118px;
        font-size:12px;
    }

}

</style>
</head>

<body>

<header class="car-header">

    <div class="car-logo">🚗</div>

    <h1 class="car-title">
        Build Your Car
    </h1>

    <p class="car-subtitle">
        Build • Test • Drive
    </p>

</header>


<!-- =========================
     TEST DRIVE AREA
========================= -->

<section class="test-area">

    <div class="test-layout">

        <!-- VERTICAL ROAD -->

        <div class="road" id="road">

            <div class="road-lines" id="roadLines"></div>

            <div class="car" id="car">

                <div class="car-shadow"></div>

                <div class="car-body" id="carBody">

                    <div class="car-roof">

                        <div class="front-glass"></div>
                        <div class="rear-glass"></div>

                    </div>

                    <div class="engine" id="engine">
                        ⚙️
                    </div>

                    <div class="light front-light-left"></div>
                    <div class="light front-light-right"></div>

                    <div class="light rear-light-left"></div>
                    <div class="light rear-light-right"></div>

                </div>

                <div class="wheel wheel-left-front"></div>
                <div class="wheel wheel-right-front"></div>
                <div class="wheel wheel-left-rear"></div>
                <div class="wheel wheel-right-rear"></div>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <div class="control-label">
                STEERING
            </div>

            <div
                class="steering-wheel-control"
                id="steeringWheel">

                <div class="steering-center"></div>

            </div>

            <button
                class="start-test"
                id="startTest"
                onclick="toggleTest()">

                ▶ START TEST

            </button>

            <div class="pedals">

                <button
                    class="pedal clutch"
                    onclick="useClutch()">

                    CLUTCH

                </button>

                <button
                    class="pedal brake"
                    onclick="useBrake()">

                    BRAKE

                </button>

                <button
                    class="pedal accelerator"
                    onpointerdown="startAccelerator()"
                    onpointerup="stopAccelerator()"
                    onpointerleave="stopAccelerator()">

                    GAS

                </button>

            </div>

        </div>

    </div>

    <div class="status" id="status">
        Ready to build
    </div>

</section>


<!-- =========================
     PARTS
========================= -->

<div class="parts-container">


    <!-- CHASSIS -->

    <section class="parts-section">

        <h2>Chassis</h2>
        <p>Choose a chassis design.</p>

        <div class="parts-grid">

            <button class="part selected" onclick="selectChassis(this,1)">▱<span>Sport</span></button>
            <button class="part" onclick="selectChassis(this,2)">▰<span>Classic</span></button>
            <button class="part" onclick="selectChassis(this,3)">▭<span>Rally</span></button>
            <button class="part" onclick="selectChassis(this,4)">⬢<span>Off-Road</span></button>
            <button class="part" onclick="selectChassis(this,5)">◈<span>Race</span></button>

        </div>

    </section>


    <!-- WHEELS -->

    <section class="parts-section">

        <h2>Wheels</h2>
        <p>Choose your wheel design.</p>

        <div class="parts-grid">

            <button class="part selected" onclick="selectWheel(this,1)">◉<span>Street</span></button>
            <button class="part" onclick="selectWheel(this,2)">◎<span>Sport</span></button>
            <button class="part" onclick="selectWheel(this,3)">◍<span>Rally</span></button>
            <button class="part" onclick="selectWheel(this,4)">●<span>Off-Road</span></button>
            <button class="part" onclick="selectWheel(this,5)">✦<span>Race</span></button>

        </div>

    </section>


    <!-- ENGINE -->

    <section class="parts-section">

        <h2>Engine</h2>
        <p>Choose an engine.</p>

        <div class="parts-grid">

            <button class="part selected" onclick="selectEngine(this,1)">⚙️<span>Standard</span></button>
            <button class="part" onclick="selectEngine(this,2)">⚡<span>Electric</span></button>
            <button class="part" onclick="selectEngine(this,3)">🔥<span>Turbo</span></button>
            <button class="part" onclick="selectEngine(this,4)">🔋<span>Hybrid</span></button>
            <button class="part" onclick="selectEngine(this,5)">🚀<span>Race</span></button>

        </div>

    </section>


    <!-- STEERING -->

    <section class="parts-section">

        <h2>Steering</h2>
        <p>Choose a steering design.</p>

        <div class="parts-grid">

            <button class="part selected" onclick="selectSteering(this,1)">◉<span>Classic</span></button>
            <button class="part" onclick="selectSteering(this,2)">◎<span>Sport</span></button>
            <button class="part" onclick="selectSteering(this,3)">⭕<span>Rally</span></button>
            <button class="part" onclick="selectSteering(this,4)">🎮<span>Smart</span></button>
            <button class="part" onclick="selectSteering(this,5)">✦<span>Race</span></button>

        </div>

    </section>


    <!-- BODY -->

    <section class="parts-section">

        <h2>Body</h2>
        <p>Choose your vehicle body.</p>

        <div class="parts-grid">

            <button class="part selected" onclick="selectBody(this,'sport')">🚗<span>Sport</span></button>
            <button class="part" onclick="selectBody(this,'jeep')">🚙<span>Jeep</span></button>
            <button class="part" onclick="selectBody(this,'pickup')">🛻<span>Pickup</span></button>
            <button class="part" onclick="selectBody(this,'truck')">🚚<span>Truck</span></button>
            <button class="part" onclick="selectBody(this,'race')">🏎️<span>Race</span></button>

        </div>

    </section>


    <!-- PAINT -->

    <section class="parts-section">

        <h2>Paint</h2>
        <p>Choose a color.</p>

        <div class="parts-grid">

            <button class="part paint-red selected" onclick="selectPaint(this,'red')">🔴<span>Red</span></button>
            <button class="part paint-blue" onclick="selectPaint(this,'blue')">🔵<span>Blue</span></button>
            <button class="part paint-green" onclick="selectPaint(this,'green')">🟢<span>Green</span></button>
            <button class="part paint-yellow" onclick="selectPaint(this,'yellow')">🟡<span>Yellow</span></button>
            <button class="part paint-black" onclick="selectPaint(this,'black')">⚫<span>Black</span></button>

        </div>

    </section>


    <!-- EXTRAS -->

    <section class="parts-section">

        <h2>Extras</h2>
        <p>Add extra equipment.</p>

        <div class="parts-grid">

            <button class="part" onclick="toggleExtra(this,'spoiler')">🏁<span>Spoiler</span></button>
            <button class="part" onclick="toggleExtra(this,'lights')">💡<span>Lights</span></button>
            <button class="part" onclick="toggleExtra(this,'roof')">📦<span>Roof</span></button>
            <button class="part" onclick="toggleExtra(this,'sport')">⭐<span>Sport Kit</span></button>
            <button class="part" onclick="toggleExtra(this,'offroad')">🛡️<span>Off-Road</span></button>

        </div>

    </section>


    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Junior Builder

    </button>

</div>


<script>

/* =========================
   CAR STATE
========================= */

let testRunning = false;
let engineInstalled = true;
let steeringInstalled = true;
let brakeWorking = true;
let clutchWorking = true;
let acceleratorWorking = true;

let carX = 50;
let carY = 50;
let speed = 0;
let angle = 0;

let acceleratorTimer = null;


/* =========================
   TEST START / STOP
========================= */

function toggleTest(){

    const button = document.getElementById("startTest");
    const status = document.getElementById("status");

    if(!testRunning){

        if(!engineInstalled){

            status.textContent = "Install an engine first";
            return;

        }

        if(!steeringInstalled){

            status.textContent = "Install steering first";
            return;

        }

        testRunning = true;

        button.textContent = "■ STOP TEST";
        button.classList.add("active");

        status.textContent = "Test drive ready";

    }else{

        testRunning = false;

        button.textContent = "▶ START TEST";
        button.classList.remove("active");

        speed = 0;

        status.textContent = "Test stopped";

    }

}


/* =========================
   STEERING
========================= */

function turnSteering(direction){

    if(!testRunning) return;

    if(!steeringInstalled){

        document.getElementById("status").textContent =
            "Install steering first";

        return;

    }

    angle += direction * 12;

    document.getElementById("steeringWheel").style.transform =
        "rotate(" + angle + "deg)";

    document.getElementById("car").style.transform =
        "translate(-50%,-50%) rotate(" + (direction * 8) + "deg)";

}


/* Touch steering */

let steeringStartX = null;

const steeringWheel =
    document.getElementById("steeringWheel");

steeringWheel.addEventListener(
    "pointerdown",
    function(e){

        steeringStartX = e.clientX;

        steeringWheel.setPointerCapture(
            e.pointerId
        );

    }
);

steeringWheel.addEventListener(
    "pointermove",
    function(e){

        if(steeringStartX === null) return;

        const diff =
            e.clientX - steeringStartX;

        if(Math.abs(diff) > 5){

            turnSteering(
                diff > 0 ? 1 : -1
            );

            steeringStartX = e.clientX;

        }

    }
);

steeringWheel.addEventListener(
    "pointerup",
    function(){

        steeringStartX = null;

    }
);

steeringWheel.addEventListener(
    "pointercancel",
    function(){

        steeringStartX = null;

    }
);


/* =========================
   PEDALS
========================= */

function useClutch(){

    if(!testRunning) return;

    if(!clutchWorking){

        document.getElementById("status").textContent =
            "Install clutch first";

        return;

    }

    speed = 0;

    document.getElementById("status").textContent =
        "Clutch engaged";

}


function useBrake(){

    if(!testRunning) return;

    if(!brakeWorking){

        document.getElementById("status").textContent =
            "Brakes are not installed";

        return;

    }

    speed = 0;

    document.getElementById("status").textContent =
        "Brake applied";

}


function startAccelerator(){

    if(!testRunning) return;

    if(!acceleratorWorking){

        document.getElementById("status").textContent =
            "Accelerator not available";

        return;

    }

    speed = 1;

    document.getElementById("status").textContent =
        "Accelerating...";

    acceleratorTimer =
        setInterval(function(){

            moveCar();

        },60);

}


function stopAccelerator(){

    clearInterval(acceleratorTimer);

    acceleratorTimer = null;

    speed = 0;

}


/* =========================
   MOVE CAR
========================= */

function moveCar(){

    if(!testRunning || speed <= 0) return;

    carY -= speed;

    if(carY < 15){
        carY = 85;
    }

    const car =
        document.getElementById("car");

    car.style.top =
        carY + "%";

}


/* =========================
   PART SELECTION
========================= */

function clearSelection(button){

    const buttons =
        button.parentElement.querySelectorAll(".part");

    buttons.forEach(function(b){

        b.classList.remove("selected");

    });

    button.classList.add("selected");

}


function selectChassis(button,type){

    clearSelection(button);

    document.getElementById("status").textContent =
        "Chassis selected";

}


function selectWheel(button,type){

    clearSelection(button);

    const wheels =
        document.querySelectorAll(".wheel");

    wheels.forEach(function(wheel){

        if(type === 1){

            wheel.style.background = "#111827";
            wheel.style.borderColor = "#374151";

        }

        if(type === 2){

            wheel.style.background = "#020617";
            wheel.style.borderColor = "#ef4444";

        }

        if(type === 3){

            wheel.style.background = "#1f2937";
            wheel.style.borderColor = "#f59e0b";

        }

        if(type === 4){

            wheel.style.background = "#111827";
            wheel.style.borderColor = "#84cc16";

        }

        if(type === 5){

            wheel.style.background = "#0f172a";
            wheel.style.borderColor = "#38bdf8";

        }

    });

}


function selectEngine(button,type){

    clearSelection(button);

    const engine =
        document.getElementById("engine");

    engineInstalled = true;

    engine.style.display = "flex";

    if(type === 1){

        engine.textContent = "⚙️";

    }

    if(type === 2){

        engine.textContent = "⚡";

    }

    if(type === 3){

        engine.textContent = "🔥";

    }

    if(type === 4){

        engine.textContent = "🔋";

    }

    if(type === 5){

        engine.textContent = "🚀";

    }

}


function selectSteering(button,type){

    clearSelection(button);

    steeringInstalled = true;

    const wheel =
        document.getElementById("steeringWheel");

    if(type === 1){
        wheel.style.borderColor = "#374151";
    }

    if(type === 2){
        wheel.style.borderColor = "#ef4444";
    }

    if(type === 3){
        wheel.style.borderColor = "#f59e0b";
    }

    if(type === 4){
        wheel.style.borderColor = "#6366f1";
    }

    if(type === 5){
        wheel.style.borderColor = "#38bdf8";
    }

}


function selectBody(button,type){

    clearSelection(button);

    const body =
        document.getElementById("carBody");

    if(type === "sport"){
        body.style.borderRadius =
            "42px 42px 25px 25px";
    }

    if(type === "jeep"){
        body.style.borderRadius =
            "20px";
    }

    if(type === "pickup"){
        body.style.borderRadius =
            "20px 10px 10px 20px";
    }

    if(type === "truck"){
        body.style.borderRadius =
            "15px";
    }

    if(type === "race"){
        body.style.borderRadius =
            "50px";
    }

}


function selectPaint(button,color){

    clearSelection(button);

    const body =
        document.getElementById("carBody");

    const colors = {

        red:[
            "#991b1b",
            "#ef4444",
            "#dc2626",
            "#7f1d1d"
        ],

        blue:[
            "#1d4ed8",
            "#60a5fa",
            "#2563eb",
            "#1e3a8a"
        ],

        green:[
            "#166534",
            "#4ade80",
            "#16a34a",
            "#14532d"
        ],

        yellow:[
            "#a16207",
            "#facc15",
            "#eab308",
            "#713f12"
        ],

        black:[
            "#111827",
            "#475569",
            "#1f2937",
            "#020617"
        ]

    };

    const c = colors[color];

    body.style.background =
        "linear-gradient(90deg," +
        c[0] + "," +
        c[1] + " 35%," +
        c[2] + " 65%," +
        c[3] +
        ")";

}


function toggleExtra(button,type){

    button.classList.toggle("selected");

    const body =
        document.getElementById("carBody");

    if(type === "lights"){

        const lights =
            document.querySelectorAll(".light");

        lights.forEach(function(light){

            if(button.classList.contains("selected")){

                light.style.boxShadow =
                    "0 0 10px #fff";

            }else{

                light.style.boxShadow =
                    "none";

            }

        });

    }

    if(type === "spoiler"){

        let spoiler =
            document.getElementById("spoiler");

        if(button.classList.contains("selected")){

            if(!spoiler){

                spoiler =
                    document.createElement("div");

                spoiler.id = "spoiler";

                spoiler.style.position =
                    "absolute";

                spoiler.style.width =
                    "65px";

                spoiler.style.height =
                    "8px";

                spoiler.style.left =
                    "24px";

                spoiler.style.bottom =
                    "6px";

                spoiler.style.background =
                    "#111827";

                spoiler.style.borderRadius =
                    "8px";

                spoiler.style.zIndex =
                    "12";

                document.getElementById("car")
                    .appendChild(spoiler);

            }

        }else{

            if(spoiler){
                spoiler.remove();
            }

        }

    }

    if(type === "roof"){

        const roof =
            document.querySelector(".car-roof");

        roof.style.boxShadow =
            button.classList.contains("selected")
            ? "0 0 12px rgba(255,255,255,.8)"
            : "none";

    }

}


function goBack(){

    window.location.href =
        "../index.html";

}

</script>
