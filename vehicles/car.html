<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutureLab Kids - Car Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(#dff6ff,#f5fbff);
    color:#263238;
}

.car-header{
    text-align:center;
    padding:25px 15px 18px;
}

.car-logo{
    font-size:58px;
}

.car-title{
    margin:5px 0;
    font-size:30px;
    color:#6339b6;
}

.car-subtitle{
    margin:8px 0 0;
    color:#607d8b;
    font-size:15px;
}

.builder-card{
    width:92%;
    max-width:600px;
    margin:10px auto 30px;
    background:white;
    border-radius:24px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    text-align:center;
}

.builder-card h2{
    margin:5px 0 10px;
    color:#6339b6;
}

.builder-card p{
    color:#607d8b;
    line-height:1.5;
}

.start-building{
    border:0;
    border-radius:16px;
    padding:15px 28px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<header class="car-header">

    <div class="car-logo">🚗</div>

    <h1 class="car-title">
        Build Your Car
    </h1>

    <p class="car-subtitle">
        Build • Learn • Test • Drive
    </p>

</header>

<section class="builder-card">

    <h2>🔧 Junior Car Workshop</h2>

    <p>
        Assemble your car part by part and learn how each part works.
    </p>

    <button class="start-building">
        🚗 Start Building
    </button>

</section>

</body>
</html>
