
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FutureLab Kids - 3D Car Workshop</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
 -webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#dff4ff;color:#263238;
 touch-action:pan-x pan-y;
}
button{font-family:inherit;cursor:pointer}
.screen{display:none;width:100%;height:100dvh;overflow:hidden}
.screen.active{display:flex;flex-direction:column}

/* HEADER */
.header{
 flex:0 0 65px;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;
 background:linear-gradient(120deg,#6339b6,#9b5de5);
 color:white;box-shadow:0 4px 10px #0003;
}
.header h1{font-size:23px;margin:0;font-weight:900}
.header p{font-size:11px;margin:3px 0}

/* WORKSHOP */
.workshop{
 flex:1;min-height:0;
 padding:7px;
 display:flex;flex-direction:column;gap:7px;
 background:linear-gradient(145deg,#f9d99c,#d99b55);
}
.workshop-label{
 flex:0 0 27px;text-align:center;
 font-weight:bold;color:#713b13;font-size:15px;
}

/* BUILD AREA */
.build-area{
 flex:0 0 37%;
 min-height:180px;position:relative;
 border:5px solid #8b5528;border-radius:19px;
 background:
 radial-gradient(ellipse at 50% 90%,#ffffff55,transparent 65%),
 linear-gradient(145deg,#718ca9,#405c7d);
 box-shadow:inset 0 5px 12px #0004,0 5px 10px #0002;
 overflow:hidden;
}
.build-label{
 position:absolute;top:6px;left:0;right:0;
 text-align:center;color:white;font-size:12px;
 font-weight:bold;text-shadow:0 2px 3px #0008;
}
.car{
 position:absolute;width:min(88%,370px);
 height:145px;left:50%;top:52%;
 transform:translate(-50%,-50%);
}
.car-shadow{
 position:absolute;left:8%;right:8%;bottom:4px;
 height:18px;border-radius:50%;background:#0006;
 filter:blur(6px);
}
.car-frame{
 position:absolute;left:8%;right:8%;bottom:34px;
 height:35px;border-radius:10px;
 background:linear-gradient(#b8c7d8,#46576b 55%,#26384e);
 border:3px solid #25364a;
 box-shadow:0 6px 0 #182638,inset 0 4px 5px #fff8;
}
.slot{
 position:absolute;display:flex;align-items:center;
 justify-content:center;text-align:center;
 border:2px dashed #ffffffcc;border-radius:9px;
 background:#ffffff25;color:white;
 font-size:9px;font-weight:bold;
 text-shadow:0 1px 3px #000;
}
.slot .installed-icon{font-size:25px;filter:drop-shadow(0 3px 2px #0005)}
.slot.filled{
 border:2px solid #a7f3d0;
 background:#16a34a55;
 box-shadow:0 0 10px #86efac;
}
 /* PART DROP AREA LAYERS */
.slot-body{z-index:1}
.slot-base{z-index:2}
.slot-axle{z-index:3}
.slot-wheel1,.slot-wheel2{z-index:5}
.slot-engine{z-index:6}
.slot-steering{z-index:7}
.slot-brake{z-index:8}
.slot-battery,.slot-seat,.slot-lights,
.slot-mirror,.slot-spoiler{z-index:9}
.slot-base{left:8%;right:8%;bottom:28px;height:48px}
.slot-engine{left:35%;bottom:67px;width:25%;height:38px}
.slot-axle{left:13%;right:13%;bottom:25px;height:13px}
.slot-wheel1{left:13%;bottom:3px;width:35px;height:35px;border-radius:50%}
.slot-wheel2{right:13%;bottom:3px;width:35px;height:35px;border-radius:50%}
.slot-steering{left:18%;top:30px;width:42px;height:42px;border-radius:50%}
.slot-brake{left:61%;bottom:62px;width:35px;height:25px}
.slot-body{left:9%;right:9%;top:27px;height:80px;border-radius:35px 45px 12px 12px}
.slot-battery{right:17%;bottom:67px;width:30px;height:27px}
.slot-seat{left:48%;top:40px;width:30px;height:32px}
.slot-lights{left:5%;top:65px;width:20px;height:17px}
.slot-mirror{right:10%;top:28px;width:22px;height:20px}
.slot-spoiler{right:5%;top:40px;width:30px;height:15px}

/* PARTS */
.parts-panel{
 flex:1;min-height:0;
 border:4px solid #a66a31;border-radius:18px;
 background:linear-gradient(145deg,#fff0d4,#f6d7a8);
 padding:7px;
 display:flex;flex-direction:column;
}
.parts-heading{
 flex:0 0 28px;text-align:center;
 font-size:16px;font-weight:bold;color:#6339b6;
}
.parts-grid{
 flex:1;min-height:0;
 display:grid;grid-template-columns:repeat(4,1fr);
 grid-template-rows:repeat(3,minmax(0,1fr));
 gap:6px;
}
.part{
 min-width:0;min-height:0;
 border:2px solid #d5e3f1;border-radius:13px;
 background:linear-gradient(145deg,#fff,#dcecff);
 box-shadow:0 4px 0 #9fb4cb,0 5px 8px #0002;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 gap:2px;padding:3px;
 touch-action:none;
 user-select:none;
}
.part-icon{
 font-size:clamp(21px,5vw,32px);
 filter:drop-shadow(0 3px 2px #0003);
}
.part-name{font-size:clamp(9px,2.5vw,12px);font-weight:bold;color:#334155}
.part.used{opacity:.25;filter:grayscale(1);pointer-events:none}

/* BUTTONS */
.status{
 flex:0 0 22px;text-align:center;
 font-size:12px;font-weight:bold;color:#6339b6;
 overflow:hidden;
}
.main-button{
 flex:0 0 48px;width:75%;align-self:center;
 border:0;border-radius:15px;
 background:linear-gradient(#4ade80,#16a34a);
 color:white;font-size:19px;font-weight:bold;
 box-shadow:0 5px 0 #15803d,0 7px 10px #0002;
}
.main-button:disabled{background:#94a3b8;box-shadow:0 5px 0 #64748b}

/* DRAG GHOST */
.drag-ghost{
 position:fixed;z-index:9999;pointer-events:none;
 width:75px;height:70px;border-radius:15px;
 background:#fff;border:3px solid #8b5cf6;
 box-shadow:0 8px 20px #0005;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;
 transform:translate(-50%,-50%);
}
.drag-ghost b{font-size:30px}
.drag-ghost small{font-size:10px;font-weight:bold}

/* TEST DRIVE */
.drive-area{
 flex:1;min-height:0;display:grid;
 grid-template-columns:minmax(0,1fr) 142px;
 gap:7px;padding:7px;
 background:linear-gradient(#b8e5ff,#e5f7ff);
}
.road{
 position:relative;overflow:hidden;
 border:5px solid #334155;border-radius:17px;
 background:#4b5563;
}
.road:before,.road:after{
 content:"";position:absolute;top:0;bottom:0;width:7px;
 background:#facc15;
}
.road:before{left:9px}.road:after{right:9px}
.road-lines{
 position:absolute;left:50%;top:0;bottom:0;width:7px;
 transform:translateX(-50%);
 background:repeating-linear-gradient(to bottom,white 0 35px,transparent 35px 70px);
}
.road.moving .road-lines{animation:roadMove .35s linear infinite}
@keyframes roadMove{to{background-position:0 70px}}
.drive-car{
 position:absolute;width:105px;height:155px;
 left:50%;bottom:13%;
 transform:translateX(-50%);
 transition:transform .15s;
}
.drive-body{
 position:absolute;inset:0 8px 0;
 border-radius:35px 35px 17px 17px;
 background:linear-gradient(90deg,#1d4ed8,#60a5fa,#1e40af);
 border:4px solid #1e3a8a;
 box-shadow:inset 5px 0 7px #fff8,0 6px 8px #0005;
}
.drive-window{
 position:absolute;left:22px;top:35px;
 width:53px;height:50px;border-radius:18px 18px 7px 7px;
 background:linear-gradient(135deg,#e0f7ff,#38bdf8);
 border:3px solid #1e3a8a;
}
.drive-wheel{
 position:absolute;width:22px;height:38px;
 background:#172033;border:4px solid #94a3b8;
 border-radius:8px;z-index:3;
}
.dwl{left:0;top:35px}.dwr{right:0;top:35px}
.dwl2{left:0;bottom:25px}.dwr2{right:0;bottom:25px}

/* CONTROLS */
.controls{
 border:3px solid #a78bfa;border-radius:16px;
 background:linear-gradient(#f5f3ff,#ddd6fe);
 padding:6px;text-align:center;
 display:flex;flex-direction:column;gap:6px;
}
.control-title{font-size:12px;font-weight:bold;color:#6339b6}
.steer-wheel{
 width:92px;height:92px;flex-shrink:0;
 align-self:center;border-radius:50%;
 border:12px solid #1f2937;background:#64748b;
 position:relative;touch-action:none;
 box-shadow:inset 0 0 0 3px #cbd5e1,0 4px 5px #0004;
}
.steer-wheel:before{
 content:"";position:absolute;left:27px;top:4px;
 width:10px;height:58px;background:#cbd5e1;border-radius:5px;
}
.steer-wheel:after{
 content:"";position:absolute;left:4px;top:27px;
 width:58px;height:10px;background:#cbd5e1;border-radius:5px;
}
.steer-hub{
 position:absolute;left:21px;top:21px;width:22px;height:22px;
 border-radius:50%;background:#ef4444;border:3px solid #7f1d1d;z-index:2;
}
.drive-start,.back{
 border:0;border-radius:10px;padding:9px 3px;
 color:white;font-weight:bold;font-size:12px;
 background:#16a34a;
}
.pedals{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.pedal{
 border:0;border-radius:8px;padding:8px 1px;
 color:white;font-size:8px;font-weight:bold;min-height:44px;
}
.clutch{background:#6366f1}
.brake{background:#dc2626}
.accel{background:#f59e0b}
.gear-label{font-size:11px;font-weight:bold;color:#6339b6}
.gear{
 border:0;border-radius:50%;width:53px;height:53px;
 align-self:center;background:linear-gradient(145deg,#475569,#111827);
 color:white;font-weight:bold;border:4px solid #94a3b8;
}
.back{background:#6339b6;margin-top:auto}
@media(max-height:680px){
 .header{flex-basis:52px}
 .build-area{flex-basis:34%;min-height:150px}
 .main-button{flex-basis:40px}
 .steer-wheel{width:75px;height:75px}
 .steer-wheel:before{height:47px;left:20px}
 .steer-wheel:after{width:47px;top:20px}
 .steer-hub{left:15px;top:15px}
}
</style>
</head>

<body>

<!-- WORKSHOP SCREEN -->
<div id="buildScreen" class="screen active">
 <header class="header">
  <h1>🚀 FutureLab Kids</h1>
  <p>JUNIOR 3D CAR WORKSHOP</p>
 </header>

 <main class="workshop">
  <div class="workshop-label">🔧 BUILD YOUR DREAM CAR</div>

  <section class="build-area" id="buildArea">
   <div class="build-label">DRAG PARTS TO THE CAR</div>
   <div class="car" id="car">
    <div class="car-shadow"></div>
    <div class="car-frame"></div>
    <div class="slot slot-base" data-slot="chassis">CHASSIS</div>
    <div class="slot slot-axle" data-slot="axle">AXLE</div>
    <div class="slot slot-wheel1" data-slot="wheels">W</div>
    <div class="slot slot-wheel2" data-slot="wheels">W</div>
    <div class="slot slot-engine" data-slot="engine">ENGINE</div>
    <div class="slot slot-steering" data-slot="steering">S</div>
    <div class="slot slot-brake" data-slot="brakes">B</div>
    <div class="slot slot-body" data-slot="body">BODY</div>
    <div class="slot slot-battery" data-slot="battery">+</div>
    <div class="slot slot-seat" data-slot="seat">SEAT</div>
    <div class="slot slot-lights" data-slot="lights">L</div>
    <div class="slot slot-mirror" data-slot="mirror">M</div>
    <div class="slot slot-spoiler" data-slot="spoiler">S</div>
   </div>
  </section>

  <div class="status" id="status">Drag the parts and build your car!</div>

  <section class="parts-panel">
   <div class="parts-heading">🧰 WORKSHOP PARTS</div>
   <div class="parts-grid" id="partsGrid">
    <button class="part" data-part="chassis"><span class="part-icon">🛠️</span><span class="part-name">Chassis</span></button>
    <button class="part" data-part="engine"><span class="part-icon">⚙️</span><span class="part-name">Engine</span></button>
    <button class="part" data-part="axle"><span class="part-icon">🔩</span><span class="part-name">Axle</span></button>
    <button class="part" data-part="wheels"><span class="part-icon">🛞</span><span class="part-name">Wheels</span></button>
    <button class="part" data-part="steering"><span class="part-icon">🕹️</span><span class="part-name">Steering</span></button>
    <button class="part" data-part="brakes"><span class="part-icon">🛑</span><span class="part-name">Brakes</span></button>
    <button class="part" data-part="body"><span class="part-icon">🚘</span><span class="part-name">Body</span></button>
    <button class="part" data-part="battery"><span class="part-icon">🔋</span><span class="part-name">Battery</span></button>
    <button class="part" data-part="seat"><span class="part-icon">💺</span><span class="part-name">Seat</span></button>
    <button class="part" data-part="lights"><span class="part-icon">💡</span><span class="part-name">Lights</span></button>
    <button class="part" data-part="mirror"><span class="part-icon">🪞</span><span class="part-name">Mirror</span></button>
    <button class="part" data-part="spoiler"><span class="part-icon">🪽</span><span class="part-name">Spoiler</span></button>
   </div>
  </section>

  <button class="main-button" id="testButton" disabled>🏁 START TEST</button>
 </main>
</div>

<!-- TEST DRIVE SCREEN -->
<div id="testScreen" class="screen">
 <header class="header">
  <h1>🏁 TEST DRIVE</h1>
  <p>DRIVE YOUR NEW CAR</p>
 </header>
 <main class="drive-area">
  <section class="road" id="road">
   <div class="road-lines"></div>
   <div class="drive-car" id="driveCar">
    <div class="drive-body"></div>
    <div class="drive-window"></div>
    <div class="drive-wheel dwl"></div>
    <div class="drive-wheel dwr"></div>
    <div class="drive-wheel dwl2"></div>
    <div class="drive-wheel dwr2"></div>
   </div>
  </section>

  <section class="controls">
   <div class="control-title">STEERING</div>
   <div class="steer-wheel" id="steerWheel"><div class="steer-hub"></div></div>
   <button class="drive-start" id="driveButton">▶ START</button>
   <div class="pedals">
    <button class="pedal clutch" id="clutch">CLUTCH</button>
    <button class="pedal brake" id="brake">BRAKE</button>
    <button class="pedal accel" id="accelerator">ACCELERATOR</button>
   </div>
   <div class="gear-label">GEAR</div>
   <button class="gear" id="gear">N</button>
   <button class="back" id="backButton">← WORKSHOP</button>
  </section>
 </main>
</div>

<script>
const names={
 chassis:"Chassis",engine:"Engine",axle:"Axle",wheels:"Wheels",
 steering:"Steering",brakes:"Brakes",body:"Body",battery:"Battery",
 seat:"Seat",lights:"Lights",mirror:"Mirror",spoiler:"Spoiler"
};
const icons={
 chassis:"🛠️",engine:"⚙️",axle:"🔩",wheels:"🛞",
 steering:"🕹️",brakes:"🛑",body:"🚘",battery:"🔋",
 seat:"💺",lights:"💡",mirror:"🪞",spoiler:"🪽"
};
const installed={};
const status=document.getElementById("status");
let ghost=null,dragPart=null;

function say(t){status.textContent=t}

function ready(){
 return ["chassis","engine","axle","wheels","steering","brakes","body"]
 .every(p=>installed[p]);
}
function updateTestButton(){
 document.getElementById("testButton").disabled=!ready();
 if(ready())say("🎉 Great job! Your car is ready!");
}
function canInstall(p){
 if(p==="chassis")return true;
 if(!installed.chassis)return false;
 if(p==="body"){
  return ["engine","axle","wheels","steering","brakes"].every(x=>installed[x]);
 }
 if(["engine","axle","steering","brakes"].includes(p))return true;
 if(p==="wheels")return installed.axle;
 return true;
}
function putPart(p){
 if(installed[p])return;
 if(!canInstall(p)){
  say(p==="body"?"Install the main parts before the body!":
      p==="wheels"?"Install the axle first!":"Install the chassis first!");
  return;
 }
 installed[p]=true;
 document.querySelectorAll('[data-slot="'+p+'"]').forEach(slot=>{
  slot.classList.add("filled");
  slot.innerHTML='<span class="installed-icon">'+icons[p]+'</span>';
 });
 const card=document.querySelector('[data-part="'+p+'"]');
 if(card)card.classList.add("used");
 say(names[p]+" installed!");
 updateTestButton();
}
function removePart(p){
 if(!installed[p])return;
 if(p==="chassis" && Object.keys(installed).length>1){
  say("Remove the other parts first!");return;
 }
 if(p==="axle" && installed.wheels){
  say("Remove the wheels first!");return;
 }
 if(["engine","axle","wheels","steering","brakes"].includes(p)&&installed.body){
  say("Remove the body first!");return;
 }
 delete installed[p];
 document.querySelectorAll('[data-slot="'+p+'"]').forEach(slot=>{
  slot.classList.remove("filled");
  slot.textContent=p.toUpperCase();
 });
 const card=document.querySelector('[data-part="'+p+'"]');
 if(card)card.classList.remove("used");
 say(names[p]+" returned to the workshop!");
 updateTestButton();
}

/* DRAG AND DROP PARTS */

let activePointer = null;

document.querySelectorAll(".part").forEach(card => {

 card.addEventListener("pointerdown", function(e){

  if(card.classList.contains("used")) return;

  e.preventDefault();

  dragPart = card.dataset.part;
  activePointer = e.pointerId;

  ghost = document.createElement("div");
  ghost.className = "drag-ghost";

  ghost.innerHTML =
   "<b>" + icons[dragPart] + "</b>" +
   "<small>" + names[dragPart] + "</small>";

  document.body.appendChild(ghost);

  moveGhost(e.clientX,e.clientY);

 });

});

document.addEventListener("pointermove",function(e){

 if(!ghost || e.pointerId !== activePointer) return;

 e.preventDefault();

 moveGhost(e.clientX,e.clientY);

},{passive:false});


document.addEventListener("pointerup",function(e){

 if(!ghost || e.pointerId !== activePointer) return;

 const x = e.clientX;
 const y = e.clientY;

 ghost.remove();
 ghost = null;

 activePointer = null;

 const target = document.elementFromPoint(x,y);

 const slot = target ? target.closest(".slot") : null;

 if(slot && slot.dataset.slot === dragPart){

  putPart(dragPart);

 }else{

  say("❌ Wrong place! Part returned to workshop.");

 }

 dragPart = null;

});


document.addEventListener("pointercancel",function(){

 if(ghost) ghost.remove();

 ghost = null;
 dragPart = null;
 activePointer = null;

});
 /* MOVE DRAG PART WITH FINGER */

function moveGhost(x,y){

 if(ghost){

  ghost.style.left = x + "px";
  ghost.style.top = (y +45)+ "px";

 }

}

/* Tap installed parts on car to remove */
document.querySelectorAll(".slot").forEach(slot=>{
 slot.addEventListener("click",()=>{
  const p=slot.dataset.slot;
  if(installed[p])removePart(p);
 });
});

/* Test drive */
document.getElementById("testButton").addEventListener("click",()=>{
 if(!ready())return;
 document.getElementById("buildScreen").classList.remove("active");
 document.getElementById("testScreen").classList.add("active");
});
document.getElementById("backButton").addEventListener("click",()=>{
 stopDriving();
 document.getElementById("testScreen").classList.remove("active");
 document.getElementById("buildScreen").classList.add("active");
});


let running=false,gas=false,gearNo=0,angle=0,carAngle=0;
let lane=0;

const gears=["N","1","2","3","R"];
const gearButton=document.getElementById("gear");
const road=document.getElementById("road");
const driveButton=document.getElementById("driveButton");
const driveCar=document.getElementById("driveCar");

function updateDriveMotion(){
 if(running && gas && gearNo!==0){
  road.classList.add("moving");
  road.classList.toggle("reverse",gearNo===4);
 }else{
  road.classList.remove("moving","reverse");
 }
}

gearButton.addEventListener("click",()=>{
 gearNo=(gearNo+1)%gears.length;
 gearButton.textContent=gears[gearNo];
 gas=false;
 updateDriveMotion();
});

driveButton.addEventListener("click",()=>{
 if(!running){
  if(!installed.engine || !installed.wheels || !installed.brakes){
   say("Some important parts are missing!");
   return;
  }
  running=true;
  driveButton.textContent="■ STOP";
  driveButton.style.background="#dc2626";
  say("Engine started! Choose a gear.");
 }else{
  stopDriving();
 }
});

function stopDriving(){
 running=false;
 gas=false;
 updateDriveMotion();
 driveButton.textContent="▶ START";
 driveButton.style.background="#16a34a";
}

const accelerator=document.getElementById("accelerator");

accelerator.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(running && gearNo!==0 && installed.engine){
  gas=true;
  updateDriveMotion();
 }
});

["pointerup","pointercancel","pointerleave"].forEach(ev=>{
 accelerator.addEventListener(ev,()=>{
  gas=false;
  updateDriveMotion();
 });
});

document.getElementById("clutch").addEventListener("pointerdown",()=>{
 gas=false;
 updateDriveMotion();
});

document.getElementById("brake").addEventListener("pointerdown",()=>{
 gas=false;
 updateDriveMotion();
 say("Brake applied!");
});

/* STEERING AND LANE MOVEMENT */

const steer=document.getElementById("steerWheel");
let lastX=null;

steer.addEventListener("pointerdown",e=>{
 e.preventDefault();
 lastX=e.clientX;
 steer.setPointerCapture(e.pointerId);
});

steer.addEventListener("pointermove",e=>{
 if(lastX===null)return;

 let diff=e.clientX-lastX;
 lastX=e.clientX;

 if(!running || !installed.steering)return;

 angle=Math.max(-65,Math.min(65,angle+diff*1.3));
 steer.style.transform="rotate("+angle+"deg)";

 carAngle=angle*.22;
 lane=Math.max(-65,Math.min(65,lane+diff*.7));

 driveCar.style.transform=
 "translateX(calc(-50% + "+lane+"px)) rotate("+carAngle+"deg)";
});

["pointerup","pointercancel"].forEach(ev=>{
 steer.addEventListener(ev,()=>lastX=null);
});

</script>
</body>
</html>
