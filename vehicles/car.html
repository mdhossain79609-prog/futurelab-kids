<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutureLab Kids - Junior Car Workshop</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(#dff6ff,#f5fbff);
    color:#263238;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    text-align:center;
    padding:14px 10px 8px;
}

.logo{
    font-size:42px;
}

.title{
    margin:2px 0;
    color:#6339b6;
    font-size:27px;
    font-weight:800;
}

.subtitle{
    margin:4px 0;
    color:#607d8b;
    font-size:13px;
}

/* =====================================================
   SCREEN
===================================================== */

.screen{
    display:none;
}

.screen.active{
    display:block;
}

/* =====================================================
   WORKSHOP
===================================================== */

.workshop{
    width:95%;
    max-width:900px;
    margin:8px auto 25px;
    background:#d8b07a;
    border:6px solid #8b5a2b;
    border-radius:24px;
    padding:12px;
    box-shadow:0 10px 28px rgba(0,0,0,.18);
    position:relative;
    overflow:hidden;
}

.workshop-top{
    background:linear-gradient(#f6c453,#e9a92d);
    border:4px solid #9a681c;
    border-radius:16px;
    padding:10px;
    text-align:center;
    margin-bottom:10px;
}

.workshop-top h2{
    margin:0;
    color:#57360d;
    font-size:22px;
}

.workshop-top p{
    margin:4px 0 0;
    color:#674819;
    font-size:12px;
}

/* =====================================================
   BUILD AREA
===================================================== */

.build-area{
    position:relative;
    width:100%;
    min-height:430px;
    background:
        linear-gradient(
            rgba(255,255,255,.12),
            rgba(255,255,255,.12)
        ),
        #c58d52;
    border:4px solid #8b5a2b;
    border-radius:20px;
    overflow:hidden;
}

/* Workshop tools in background */

.tool{
    position:absolute;
    opacity:.25;
    font-size:30px;
}

.tool-1{
    left:10px;
    top:10px;
}

.tool-2{
    right:10px;
    top:12px;
}

.tool-3{
    left:18px;
    bottom:15px;
}

.tool-4{
    right:15px;
    bottom:18px;
}

/* =====================================================
   CAR PLATFORM
===================================================== */

.car-platform{
    position:absolute;
    width:58%;
    min-width:260px;
    max-width:470px;
    height:285px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        repeating-linear-gradient(
            135deg,
            #facc15 0 14px,
            #111827 14px 28px
        );
    border-radius:18px;
    padding:7px;
    box-shadow:0 8px 15px rgba(0,0,0,.25);
}

.car-platform-inner{
    width:100%;
    height:100%;
    background:#64748b;
    border-radius:12px;
    position:relative;
    overflow:hidden;
}

/* =====================================================
   CAR ASSEMBLY
===================================================== */

.assembly-car{
    position:absolute;
    width:230px;
    height:200px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* chassis */

.chassis{
    position:absolute;
    width:205px;
    height:70px;
    left:12px;
    top:80px;
    background:#374151;
    border:6px solid #111827;
    border-radius:12px;
    z-index:1;
    box-shadow:inset 0 0 0 4px #64748b;
}

.chassis::after{
    content:"";
    position:absolute;
    width:185px;
    height:10px;
    left:4px;
    top:24px;
    background:#111827;
    border-radius:8px;
}

/* axle */

.axle{
    position:absolute;
    width:220px;
    height:12px;
    left:5px;
    background:#1f2937;
    border-radius:10px;
    z-index:2;
    display:none;
}

.front-axle{
    top:77px;
}

.rear-axle{
    top:140px;
}

/* wheels */

.wheel{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#111827;
    border:6px solid #94a3b8;
    z-index:5;
    display:none;
}

.wheel::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    left:9px;
    top:9px;
    border-radius:50%;
    background:#cbd5e1;
}

.wheel-front-left{
    left:-4px;
    top:62px;
}

.wheel-front-right{
    right:-4px;
    top:62px;
}

.wheel-rear-left{
    left:-4px;
    top:133px;
}

.wheel-rear-right{
    right:-4px;
    top:133px;
}

/* engine */

.engine{
    position:absolute;
    width:70px;
    height:48px;
    left:76px;
    top:91px;
    background:#64748b;
    border:4px solid #1f2937;
    border-radius:10px;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:27px;
    z-index:4;
}

/* steering */

.steering{
    position:absolute;
    width:48px;
    height:48px;
    left:45px;
    top:88px;
    border:7px solid #111827;
    border-radius:50%;
    background:#374151;
    display:none;
    z-index:8;
}

.steering::after{
    content:"";
    position:absolute;
    width:8px;
    height:32px;
    left:13px;
    top:2px;
    background:#94a3b8;
    border-radius:5px;
    transform:rotate(45deg);
}

/* brake system */

.brake-system{
    position:absolute;
    width:55px;
    height:28px;
    left:118px;
    top:112px;
    background:#dc2626;
    border:4px solid #7f1d1d;
    border-radius:8px;
    display:none;
    z-index:6;
}

/* body */

.body-shell{
    position:absolute;
    width:195px;
    height:112px;
    left:18px;
    top:45px;
    background:linear-gradient(
        90deg,
        #991b1b,
        #ef4444 45%,
        #b91c1c
    );
    border:5px solid #7f1d1d;
    border-radius:48px 55px 18px 18px;
    z-index:10;
    display:none;
    box-shadow:
        inset 8px 0 10px rgba(255,255,255,.2),
        inset -8px 0 10px rgba(0,0,0,.2);
}

.body-shell::before{
    content:"";
    position:absolute;
    width:105px;
    height:48px;
    left:40px;
    top:-37px;
    background:#dc2626;
    border:5px solid #7f1d1d;
    border-bottom:0;
    border-radius:45px 50px 0 0;
}

.body-window{
    position:absolute;
    width:42px;
    height:32px;
    top:-26px;
    background:#dff6ff;
    border:3px solid #334155;
    z-index:2;
}

.window-left{
    left:50px;
    border-radius:18px 4px 4px 4px;
}

.window-right{
    right:48px;
    border-radius:4px 18px 4px 4px;
}

/* lights */

.car-light{
    position:absolute;
    width:18px;
    height:12px;
    border-radius:8px;
    background:#fff7a8;
    z-index:12;
}

.light-left{
    left:7px;
    top:46px;
}

.light-right{
    right:7px;
    top:46px;
}

/* =====================================================
   PARTS SCATTER AREA
===================================================== */

.parts-area{
    position:relative;
    min-height:270px;
    margin-top:10px;
    background:#f3e1c3;
    border:4px solid #a8753b;
    border-radius:18px;
    padding:12px;
}

.parts-title{
    text-align:center;
    color:#6339b6;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.parts{
    position:relative;
    min-height:220px;
}

/* =====================================================
   PART BUTTONS
===================================================== */

.part{
    position:absolute;
    width:78px;
    min-height:65px;
    border:3px solid #cbd5e1;
    background:white;
    border-radius:14px;
    box-shadow:0 5px 10px rgba(0,0,0,.15);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px;
    transition:.18s;
}

.part:hover{
    transform:translateY(-4px) scale(1.04);
}

.part:active{
    transform:scale(.95);
}

.part-icon{
    font-size:28px;
    line-height:30px;
}

.part-name{
    font-size:9px;
    font-weight:bold;
    color:#334155;
}

/* scattered positions */

.p1{left:2%;top:5px;}
.p2{left:16%;top:78px;}
.p3{left:31%;top:8px;}
.p4{left:46%;top:82px;}
.p5{left:61%;top:5px;}
.p6{left:76%;top:82px;}
.p7{left:87%;top:8px;}
.p8{left:8%;top:145px;}
.p9{left:25%;top:150px;}
.p10{left:43%;top:145px;}
.p11{left:61%;top:150px;}
.p12{left:79%;top:145px;}

/* installed state */

.part.installed{
    opacity:.35;
    filter:grayscale(1);
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
    text-align:center;
    min-height:25px;
    padding:7px;
    color:#6339b6;
    font-weight:bold;
    font-size:13px;
}

/* =====================================================
   BUILD BUTTON
===================================================== */

.test-button{
    display:block;
    width:220px;
    margin:10px auto 5px;
    border:0;
    border-radius:17px;
    padding:15px;
    background:#22c55e;
    color:white;
    font-size:17px;
    font-weight:bold;
    box-shadow:0 6px 12px rgba(34,197,94,.3);
}

.test-button:disabled{
    background:#94a3b8;
    box-shadow:none;
    cursor:not-allowed;
}

/* =====================================================
   TEST DRIVE SCREEN
===================================================== */

.test-screen{
    width:95%;
    max-width:900px;
    margin:8px auto 25px;
}

.drive-layout{
    display:grid;
    grid-template-columns:1fr 175px;
    gap:10px;
}

/* road */

.road{
    position:relative;
    height:600px;
    border-radius:24px;
    overflow:hidden;
    border:6px solid #374151;
    background:
        linear-gradient(
            90deg,
            #475569 0%,
            #64748b 12%,
            #4b5563 12%,
            #4b5563 88%,
            #64748b 88%,
            #475569 100%
        );
}

.road-edge-left,
.road-edge-right{
    position:absolute;
    top:0;
    width:9px;
    height:100%;
    background:#facc15;
}

.road-edge-left{
    left:15px;
}

.road-edge-right{
    right:15px;
}

.road-middle{
    position:absolute;
    left:50%;
    top:0;
    width:8px;
    height:100%;
    transform:translateX(-50%);
    background:
        repeating-linear-gradient(
            to bottom,
            white 0 55px,
            transparent 55px 105px
        );
}

/* drive car */

.drive-car{
    position:absolute;
    width:105px;
    height:180px;
    left:50%;
    top:72%;
    transform:translate(-50%,-50%);
    z-index:5;
    transition:transform .12s linear;
}

.drive-car-body{
    position:absolute;
    width:98px;
    height:165px;
    left:3px;
    top:7px;
    border-radius:38px 38px 20px 20px;
    background:linear-gradient(
        90deg,
        #991b1b,
        #ef4444 45%,
        #b91c1c
    );
    border:4px solid #7f1d1d;
}

.drive-roof{
    position:absolute;
    width:65px;
    height:65px;
    left:13px;
    top:38px;
    border-radius:24px 24px 8px 8px;
    background:#bdeeff;
    border:4px solid #334155;
}

.drive-wheel{
    position:absolute;
    width:25px;
    height:43px;
    border-radius:10px;
    background:#111827;
    border:4px solid #64748b;
    z-index:8;
}

.dw1{
    left:-12px;
    top:34px;
}

.dw2{
    right:-12px;
    top:34px;
}

.dw3{
    left:-12px;
    bottom:32px;
}

.dw4{
    right:-12px;
    bottom:32px;
}

/* =====================================================
   CONTROLS
===================================================== */

.controls{
    background:#f5f3ff;
    border:3px solid #c4b5fd;
    border-radius:22px;
    padding:10px;
    text-align:center;
}

.controls-title{
    color:#6339b6;
    font-weight:bold;
    font-size:15px;
    margin-bottom:8px;
}

.steering-wheel{
    width:120px;
    height:120px;
    margin:0 auto 10px;
    border-radius:50%;
    border:13px solid #111827;
    background:#374151;
    position:relative;
    touch-action:none;
}

.steering-wheel::before,
.steering-wheel::after{
    content:"";
    position:absolute;
    background:#94a3b8;
    border-radius:5px;
}

.steering-wheel::before{
    width:10px;
    height:82px;
    left:42px;
    top:6px;
}

.steering-wheel::after{
    width:82px;
    height:10px;
    left:6px;
    top:42px;
}

.steering-center{
    position:absolute;
    width:32px;
    height:32px;
    left:31px;
    top:31px;
    border-radius:50%;
    background:#ef4444;
    border:4px solid #7f1d1d;
    z-index:2;
}

.start-drive{
    width:100%;
    border:0;
    border-radius:14px;
    padding:12px 5px;
    background:#22c55e;
    color:white;
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.start-drive.stop{
    background:#ef4444;
}

/* pedals */

.pedals{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
}

.pedal{
    border:0;
    border-radius:10px;
    min-height:65px;
    color:white;
    font-size:9px;
    font-weight:bold;
}

.clutch{
    background:#6366f1;
}

.brake{
    background:#ef4444;
}

.accelerator{
    background:#f59e0b;
}

.pedal:active{
    transform:scale(.94);
}

/* gear */

.gear-title{
    margin-top:12px;
    color:#6339b6;
    font-size:13px;
    font-weight:bold;
}

.gear{
    width:75px;
    height:75px;
    margin:5px auto;
    border-radius:50%;
    background:#1f2937;
    border:6px solid #64748b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:bold;
}

.back-button{
    width:100%;
    border:0;
    border-radius:15px;
    padding:13px;
    background:#6339b6;
    color:white;
    font-weight:bold;
    margin-top:10px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:650px){

    .car-platform{
        width:88%;
    }

    .assembly-car{
        transform:translate(-50%,-50%) scale(.88);
    }

    .drive-layout{
        grid-template-columns:1fr 150px;
    }

    .steering-wheel{
        width:105px;
        height:105px;
        border-width:11px;
    }

    .steering-wheel::before{
        height:70px;
        left:37px;
    }

    .steering-wheel::after{
        width:70px;
        left:6px;
        top:36px;
    }

    .steering-center{
        width:28px;
        height:28px;
        left:27px;
        top:27px;
    }

}

@media(max-width:430px){

    .workshop{
        width:98%;
        padding:7px;
    }

    .build-area{
        min-height:390px;
    }

    .car-platform{
        min-width:235px;
        height:255px;
    }

    .assembly-car{
        transform:translate(-50%,-50%) scale(.72);
    }

    .part{
        width:65px;
        min-height:58px;
    }

    .part-icon{
        font-size:23px;
    }

    .part-name{
        font-size:8px;
    }

    .drive-layout{
        grid-template-columns:1fr 128px;
    }

    .road{
        height:540px;
    }

    .controls{
        padding:6px;
    }

    .steering-wheel{
        width:88px;
        height:88px;
        border-width:9px;
    }

    .steering-wheel::before{
        width:8px;
        height:58px;
        left:31px;
    }

    .steering-wheel::after{
        width:58px;
        height:8px;
        left:6px;
        top:30px;
    }

    .steering-center{
        width:24px;
        height:24px;
        left:23px;
        top:23px;
    }

}

/* =====================================================
   EXTRA BODY COLORS
===================================================== */

.blue{
    background:linear-gradient(
        90deg,
        #1d4ed8,
        #60a5fa 45%,
        #1e40af
    ) !important;
    border-color:#1e3a8a !important;
}

.green{
    background:linear-gradient(
        90deg,
        #166534,
        #4ade80 45%,
        #14532d
    ) !important;
    border-color:#14532d !important;
}

.yellow{
    background:linear-gradient(
        90deg,
        #a16207,
        #facc15 45%,
        #713f12
    ) !important;
    border-color:#713f12 !important;
}

.black{
    background:linear-gradient(
        90deg,
        #111827,
        #475569 45%,
        #020617
    ) !important;
    border-color:#020617 !important;
}

</style>
</head>


<body>


<!-- =====================================================
     BUILD SCREEN
===================================================== -->

<div id="buildScreen" class="screen active">

    <header class="header">

        <div class="logo">🚗</div>

        <h1 class="title">
            Build Your Car
        </h1>

        <p class="subtitle">
            Junior Car Workshop
        </p>

    </header>


    <section class="workshop">

        <div class="workshop-top">

            <h2>
                🔧 Junior Car Workshop
            </h2>

            <p>
                Pick a part and build your car
            </p>

        </div>


        <!-- BUILD AREA -->

        <div class="build-area">

            <div class="tool tool-1">🔧</div>
            <div class="tool tool-2">🔩</div>
            <div class="tool tool-3">⚙️</div>
            <div class="tool tool-4">🛠️</div>


            <div class="car-platform">

                <div class="car-platform-inner">

                    <div class="assembly-car"
                         id="assemblyCar">

                        <!-- CHASSIS -->

                        <div
                            class="chassis"
                            id="chassis">
                        </div>


                        <!-- AXLES -->

                        <div
                            class="axle front-axle"
                            id="frontAxle">
                        </div>

                        <div
                            class="axle rear-axle"
                            id="rearAxle">
                        </div>


                        <!-- WHEELS -->

                        <div
                            class="wheel wheel-front-left"
                            id="wheel1">
                        </div>

                        <div
                            class="wheel wheel-front-right"
                            id="wheel2">
                        </div>

                        <div
                            class="wheel wheel-rear-left"
                            id="wheel3">
                        </div>

                        <div
                            class="wheel wheel-rear-right"
                            id="wheel4">
                        </div>


                        <!-- ENGINE -->

                        <div
                            class="engine"
                            id="engine">
                            ⚙️
                        </div>


                        <!-- STEERING -->

                        <div
                            class="steering"
                            id="steering">
                        </div>


                        <!-- BRAKES -->

                        <div
                            class="brake-system"
                            id="brakeSystem">
                        </div>


                        <!-- BODY -->

                        <div
                            class="body-shell"
                            id="bodyShell">

                            <div
                                class="body-window window-left">
                            </div>

                            <div
                                class="body-window window-right">
                            </div>

                            <div
                                class="car-light light-left">
                            </div>

                            <div
                                class="car-light light-right">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <div
            class="message"
            id="buildMessage">

            Start with the chassis

        </div>


        <!-- =================================================
             SCATTERED WORKSHOP PARTS
        ================================================= -->

        <div class="parts-area">

            <div class="parts-title">
                🧰 Workshop Parts
            </div>


            <div class="parts">


                <!-- CHASSIS -->

                <button
                    class="part p1"
                    id="partChassis"
                    onclick="installChassis()">

                    <div class="part-icon">
                        🔧
                    </div>

                    <div class="part-name">
                        Chassis
                    </div>

                </button>


                <!-- ENGINE -->

                <button
                    class="part p2"
                    id="partEngine"
                    onclick="installEngine()">

                    <div class="part-icon">
                        ⚙️
                    </div>

                    <div class="part-name">
                        Engine
                    </div>

                </button>


                <!-- AXLE -->

                <button
                    class="part p3"
                    id="partAxle"
                    onclick="installAxle()">

                    <div class="part-icon">
                        🔩
                    </div>

                    <div class="part-name">
                        Axle
                    </div>

                </button>


                <!-- WHEELS -->

                <button
                    class="part p4"
                    id="partWheels"
                    onclick="installWheels()">

                    <div class="part-icon">
                        🛞
                    </div>

                    <div class="part-name">
                        Wheels
                    </div>

                </button>


                <!-- STEERING -->

                <button
                    class="part p5"
                    id="partSteering"
                    onclick="installSteering()">

                    <div class="part-icon">
                        🕹️
                    </div>

                    <div class="part-name">
                        Steering
                    </div>

                </button>


                <!-- BRAKE -->

                <button
                    class="part p6"
                    id="partBrake"
                    onclick="installBrake()">

                    <div class="part-icon">
                        🛑
                    </div>

                    <div class="part-name">
                        Brakes
                    </div>

                </button>


                <!-- BODY -->

                <button
                    class="part p7"
                    id="partBody"
                    onclick="installBody()">

                    <div class="part-icon">
                        🚗
                    </div>

                    <div class="part-name">
                        Body
                    </div>

                </button>


                <!-- BATTERY -->

                <button
                    class="part p8"
                    id="partBattery"
                    onclick="installBattery()">

                    <div class="part-icon">
                        🔋
                    </div>

                    <div class="part-name">
                        Battery
                    </div>

                </button>


                <!-- SEAT -->

                <button
                    class="part p9"
                    id="partSeat"
                    onclick="installExtra(this,'seat')">

                    <div class="part-icon">
                        💺
                    </div>

                    <div class="part-name">
                        Seat
                    </div>

                </button>


                <!-- LIGHTS -->

                <button
                    class="part p10"
                    id="partLights"
                    onclick="installExtra(this,'lights')">

                    <div class="part-icon">
                        💡
                    </div>

                    <div class="part-name">
                        Lights
                    </div>

                </button>


                <!-- MIRROR -->

                <button
                    class="part p11"
                    id="partMirror"
                    onclick="installExtra(this,'mirror')">

                    <div class="part-icon">
                        🪞
                    </div>

                    <div class="part-name">
                        Mirror
                    </div>

                </button>


                <!-- SPOILER -->

                <button
                    class="part p12"
                    id="partSpoiler"
                    onclick="installExtra(this,'spoiler')">

                    <div class="part-icon">
                        🪽
                    </div>

                    <div class="part-name">
                        Spoiler
                    </div>

                </button>

            </div>

        </div>


        <button
            class="test-button"
            id="testButton"
            disabled
            onclick="openTestDrive()">

            ▶ Start Test

        </button>

    </section>

</div>


<!-- =====================================================
     TEST DRIVE SCREEN
===================================================== -->

<div id="testScreen" class="screen">

    <header class="header">

        <div class="logo">
            🏁
        </div>

        <h1 class="title">
            Test Drive
        </h1>

        <p class="subtitle">
            Build • Test • Drive
        </p>

    </header>


    <section class="test-screen">

        <div class="drive-layout">


            <!-- ROAD -->

            <div
                class="road"
                id="road">

                <div class="road-edge-left"></div>

                <div class="road-edge-right"></div>

                <div class="road-middle"></div>


                <!-- DRIVE CAR -->

                <div
                    class="drive-car"
                    id="driveCar">

                    <div
                        class="drive-car-body"
                        id="driveCarBody">

                        <div class="drive-roof"></div>

                    </div>


                    <div class="drive-wheel dw1"></div>
                    <div class="drive-wheel dw2"></div>
                    <div class="drive-wheel dw3"></div>
                    <div class="drive-wheel dw4"></div>

                </div>

            </div>


            <!-- CONTROLS -->

            <div class="controls">

                <div class="controls-title">
                    STEERING
                </div>


                <div
                    class="steering-wheel"
                    id="steeringWheel">

                    <div class="steering-center"></div>

                </div>


                <button
                    class="start-drive"
                    id="driveButton"
                    onclick="toggleDrive()">

                    ▶ START TEST

                </button>


                <div class="pedals">

                    <button
                        class="pedal clutch"
                        onclick="pressClutch()">

                        CLUTCH

                    </button>


                    <button
                        class="pedal brake"
                        onclick="pressBrake()">

                        BRAKE

                    </button>


                    <button
                        class="pedal accelerator"
                        onpointerdown="pressAccelerator()"
                        onpointerup="releaseAccelerator()"
                        onpointerleave="releaseAccelerator()">

                        ACCELERATOR

                    </button>

                </div>


                <div class="gear-title">
                    GEAR
                </div>


                <button
                    class="gear"
                    id="gearButton"
                    onclick="changeGear()">

                    N

                </button>


                <button
                    class="back-button"
                    onclick="backToWorkshop()">

                    ← Workshop

                </button>

            </div>

        </div>

    </section>

</div>


<script>

/* =====================================================
   BUILD STATE
===================================================== */

let built = {

    chassis:false,
    engine:false,
    axle:false,
    wheels:false,
    steering:false,
    brake:false,
    body:false,
    battery:false,
    seat:false,
    lights:false,
    mirror:false,
    spoiler:false

};


/* =====================================================
   MESSAGE
===================================================== */

function message(text){

    document.getElementById("buildMessage")
        .textContent = text;

}


/* =====================================================
   CHASSIS
===================================================== */

function installChassis(){

    built.chassis = true;

    document.getElementById("chassis")
        .style.display = "block";

    document.getElementById("partChassis")
        .classList.add("installed");

    message("Chassis installed");

    checkBuild();

}


/* =====================================================
   ENGINE
===================================================== */

function installEngine(){

    if(!built.chassis){

        message("Install the chassis first");

        return;
    }

    built.engine = true;

    document.getElementById("engine")
        .style.display = "flex";

    document.getElementById("partEngine")
        .classList.add("installed");

    message("Engine installed");

    checkBuild();

}


/* =====================================================
   AXLE
===================================================== */

function installAxle(){

    if(!built.chassis){

        message("Install the chassis first");

        return;
    }

    built.axle = true;

    document.getElementById("frontAxle")
        .style.display = "block";

    document.getElementById("rearAxle")
        .style.display = "block";

    document.getElementById("partAxle")
        .classList.add("installed");

    message("Axles installed");

    checkBuild();

}


/* =====================================================
   WHEELS
===================================================== */

function installWheels(){

    if(!built.axle){

        message("Install the axles first");

        return;
    }

    built.wheels = true;

    document.querySelectorAll(".wheel")
        .forEach(function(w){

            w.style.display = "block";

        });

    document.getElementById("partWheels")
        .classList.add("installed");

    message("Four wheels installed");

    checkBuild();

}


/* =====================================================
   STEERING
===================================================== */

function installSteering(){

    if(!built.chassis){

        message("Install the chassis first");

        return;
    }

    built.steering = true;

    document.getElementById("steering")
        .style.display = "block";

    document.getElementById("partSteering")
        .classList.add("installed");

    message("Steering installed");

    checkBuild();

}


/* =====================================================
   BRAKE
===================================================== */

function installBrake(){

    if(!built.chassis){

        message("Install the chassis first");

        return;
    }

    built.brake = true;

    document.getElementById("brakeSystem")
        .style.display = "block";

    document.getElementById("partBrake")
        .classList.add("installed");

    message("Brake system installed");

    checkBuild();

}


/* =====================================================
   BODY
===================================================== */

function installBody(){

    if(!built.chassis){

        message("Build the chassis first");

        return;
    }

    if(!built.engine){

        message("Install the engine first");

        return;
    }

    if(!built.axle){

        message("Install the axles first");

        return;
    }

    if(!built.wheels){

        message("Install the wheels first");

        return;
    }

    if(!built.steering){

        message("Install the steering first");

        return;
    }

    if(!built.brake){

        message("Install the brakes first");

        return;
    }

    built.body = true;

    document.getElementById("bodyShell")
        .style.display = "block";

    document.getElementById("partBody")
        .classList.add("installed");

    message("Body installed");

    checkBuild();

}


/* =====================================================
   BATTERY
===================================================== */

function installBattery(){

    if(!built.chassis){

        message("Install the chassis first");

        return;
    }

    built.battery = true;

    document.getElementById("partBattery")
        .classList.add("installed");

    message("Battery installed");

    checkBuild();

}


/* =====================================================
   EXTRA PARTS
===================================================== */

function installExtra(button,type){

    if(!built.body){

        message("Install the body first");

        return;
    }

    button.classList.add("installed");

    built[type] = true;

    if(type === "lights"){

        document.querySelectorAll(".car-light")
            .forEach(function(light){

                light.style.boxShadow =
                    "0 0 14px #fff7a8";

            });

        message("Lights installed");

    }

    if(type === "seat"){

        message("Seat installed");

    }

    if(type === "mirror"){

        message("Mirror installed");

    }

    if(type === "spoiler"){

        message("Spoiler installed");

    }

}


/* =====================================================
   CHECK COMPLETE
===================================================== */

function checkBuild(){

    const ready =
        built.chassis &&
        built.engine &&
        built.axle &&
        built.wheels &&
        built.steering &&
        built.brake &&
        built.body;

    const button =
        document.getElementById("testButton");

    if(ready){

        button.disabled = false;

        message(
            "🎉 Car complete! Ready for Test Drive"
        );

    }

}


/* =====================================================
   OPEN TEST DRIVE
===================================================== */

function openTestDrive(){

    const ready =
        built.chassis &&
        built.engine &&
        built.axle &&
        built.wheels &&
        built.steering &&
        built.brake &&
        built.body;

    if(!ready){

        message(
            "Finish building the car first"
        );

        return;

    }

    document.getElementById("buildScreen")
        .classList.remove("active");

    document.getElementById("testScreen")
        .classList.add("active");

    window.scrollTo(0,0);

}


/* =====================================================
   TEST DRIVE STATE
===================================================== */

let driving = false;
let accelerating = false;
let gear = 0;
let carX = 50;
let carY = 72;
let steeringAngle = 0;
let moveTimer = null;


/* =====================================================
   GEAR
===================================================== */

const gears = [
    "N",
    "1",
    "2",
    "3",
    "4",
    "5",
    "R"
];

function changeGear(){

    gear++;

    if(gear >= gears.length){

        gear = 0;

    }

    document.getElementById("gearButton")
        .textContent = gears[gear];

}


/* =====================================================
   START / STOP
===================================================== */

function toggleDrive(){

    const button =
        document.getElementById("driveButton");

    if(!driving){

        if(!built.engine){

            alert("Engine is missing");

            return;

        }

        if(!built.wheels){

            alert("Wheels are missing");

            return;

        }

        if(!built.steering){

            alert("Steering is missing");

            return;

        }

        if(!built.brake){

            alert("Brake system is missing");

            return;

        }

        if(gear === 0){

            alert("Select Gear 1 first");

            return;

        }

        driving = true;

        button.textContent =
            "■ STOP TEST";

        button.classList.add("stop");

        startMovement();

    }else{

        driving = false;

        accelerating = false;

        stopMovement();

        button.textContent =
            "▶ START TEST";

        button.classList.remove("stop");

    }

}


/* =====================================================
   ACCELERATOR
===================================================== */

function pressAccelerator(){

    if(!driving){

        return;

    }

    if(gear === 0){

        return;

    }

    accelerating = true;

}


function releaseAccelerator(){

    accelerating = false;

}


/* =====================================================
   CLUTCH
===================================================== */

function pressClutch(){

    if(!driving){

        return;

    }

    accelerating = false;

}


/* =====================================================
   BRAKE
===================================================== */

function pressBrake(){

    accelerating = false;

}


/* =====================================================
   MOVEMENT
===================================================== */

function startMovement(){

    stopMovement();

    moveTimer =
        setInterval(function(){

            if(!driving){

                return;

            }

            if(accelerating){

                carY -= 0.7;

                if(carY < 15){

                    carY = 80;

                }

            }

            updateDriveCar();

        },40);

}


function stopMovement(){

    if(moveTimer){

        clearInterval(moveTimer);

        moveTimer = null;

    }

}


/* =====================================================
   DRIVE CAR POSITION
===================================================== */

function updateDriveCar(){

    const car =
        document.getElementById("driveCar");

    car.style.left =
        carX + "%";

    car.style.top =
        carY + "%";

}


/* =====================================================
   STEERING TOUCH
===================================================== */

let steeringStart = null;

const wheel =
    document.getElementById("steeringWheel");

wheel.addEventListener(
    "pointerdown",
    function(e){

        steeringStart = e.clientX;

        wheel.setPointerCapture(
            e.pointerId
        );

    }
);


wheel.addEventListener(
    "pointermove",
    function(e){

        if(steeringStart === null){

            return;

        }

        const diff =
            e.clientX - steeringStart;

        if(Math.abs(diff) < 5){

            return;

        }

        if(!driving){

            return;

        }

        if(!built.steering){

            return;

        }

        carX += diff * 0.15;

        if(carX < 23){

            carX = 23;

        }

        if(carX > 77){

            carX = 77;

        }

        steeringAngle += diff * 0.7;

        wheel.style.transform =
            "rotate(" +
            steeringAngle +
            "deg)";

        updateDriveCar();

        steeringStart =
            e.clientX;

    }
);


wheel.addEventListener(
    "pointerup",
    function(){

        steeringStart = null;

    }
);


wheel.addEventListener(
    "pointercancel",
    function(){

        steeringStart = null;

    }
);


/* =====================================================
   BACK TO WORKSHOP
===================================================== */

function backToWorkshop(){

    driving = false;

    accelerating = false;

    stopMovement();

    document.getElementById("testScreen")
        .classList.remove("active");

    document.getElementById("buildScreen")
        .classList.add("active");

    window.scrollTo(0,0);

}


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(!driving){

            return;

        }

        if(e.key === "ArrowLeft"){

            carX -= 2;

            if(carX < 23){

                carX = 23;

            }

            updateDriveCar();

        }

        if(e.key === "ArrowRight"){

            carX += 2;

            if(carX > 77){

                carX = 77;

            }

            updateDriveCar();

        }

        if(e.key === "ArrowUp"){

            accelerating = true;

        }

        if(e.key === " "){

            pressBrake();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.key === "ArrowUp"){

            accelerating = false;

        }

    }
);

</script>

</body>
</html>
