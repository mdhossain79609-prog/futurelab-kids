<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutureLab Kids - Car Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(#dff6ff,#f5fbff);
    color:#263238;
}

.car-header{
    text-align:center;
    padding:25px 15px 18px;
}

.car-logo{
    font-size:58px;
}

.car-title{
    margin:5px 0;
    font-size:30px;
    color:#6339b6;
}

.car-subtitle{
    margin:8px 0 0;
    color:#607d8b;
    font-size:15px;
}

.builder-card{
    width:92%;
    max-width:600px;
    margin:10px auto 30px;
    background:white;
    border-radius:24px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    text-align:center;
}

.builder-card h2{
    margin:5px 0 10px;
    color:#6339b6;
}

.builder-card p{
    color:#607d8b;
    line-height:1.5;
}

.start-building{
    border:0;
    border-radius:16px;
    padding:15px 28px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

    /* CAR CHASSIS */

.car-chassis{
    position:absolute;
    width:230px;
    height:85px;
    left:25px;
    top:58px;
    background:#b0bec5;
    border:6px solid #455a64;
    border-radius:18px;
    z-index:1;
    box-shadow:inset 0 0 0 4px #78909c;
}

.car-chassis span{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:11px;
    font-weight:bold;
    color:#6339b6;
}

    
/* ENGINE PART */

.car-engine-part{
    position:absolute;
    width:65px;
    height:55px;
    left:175px;
    top:73px;
    background:#78909c;
    border:4px solid #37474f;
    border-radius:12px;
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

.engine-icon{
    font-size:24px;
    line-height:22px;
}

.car-engine-part small{
    font-size:7px;
    font-weight:bold;
    color:white;
}

    /* AXLE PARTS */

.car-axle{
    position:absolute;
    width:12px;
    height:110px;
    background:#455a64;
    border-radius:8px;
    z-index:3;
}

.front-axle{
    left:55px;
    top:45px;
}

.rear-axle{
    right:55px;
    top:45px;
}

.car-axle span{
    display:none;
}

/* WHEEL PARTS */

.car-wheel-part{
    position:absolute;
    width:42px;
    height:42px;
    background:#263238;
    border:5px solid #607d8b;
    border-radius:50%;
    z-index:7;
    display:flex;
    align-items:center;
    justify-content:center;
}

.wheel-front{
    left:40px;
    bottom:12px;
}

.wheel-rear{
    right:40px;
    bottom:12px;
}

.car-wheel-part span{
    color:#cfd8dc;
    font-size:20px;
}
    
</style>
</head>

<body>

<header class="car-header">

    <div class="car-logo">🚗</div>

    <h1 class="car-title">
        Build Your Car
    </h1>

    <p class="car-subtitle">
        Build • Learn • Test • Drive
    </p>

</header>

    <!-- COMPLETE CAR WORKSHOP -->

<section class="car-workshop">

    <h2>🚗 My Car</h2>

    <div class="complete-car">

        <div class="car-chassis" id="carChassis">
    <span>CHASSIS</span>
</div>

        <div class="car-engine-part" id="carEngine">
    <div class="engine-icon">⚙️</div>
    <small>ENGINE</small>
</div>

        <div class="car-axle front-axle" id="frontAxle">
    <span>FRONT AXLE</span>
</div>

<div class="car-axle rear-axle" id="rearAxle">
    <span>REAR AXLE</span>
</div>

        <div class="car-wheel-part wheel-front" id="frontWheel">
    <span>◉</span>
</div>

<div class="car-wheel-part wheel-rear" id="rearWheel">
    <span>◉</span>
</div>

        <div class="car-body">
            <div class="car-window front-window"></div>
            <div class="car-window rear-window"></div>
            <div class="car-light front-light">💡</div>
            <div class="car-light rear-light">🔴</div>
        </div>

        <div class="car-wheel wheel-1"></div>
        <div class="car-wheel wheel-2"></div>
        <div class="car-wheel wheel-3"></div>
        <div class="car-wheel wheel-4"></div>

        <div class="car-engine">⚙️</div>

    </div>

    <p class="workshop-note">
        This is your complete car model.
    </p>

</section>

<section class="builder-card">

    <h2>🔧 Junior Car Workshop</h2>

    <p>
        Assemble your car part by part and learn how each part works.
    </p>

    <button class="start-building">
        🚗 Start Building
    </button>

</section>

</body>
</html>
